<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quantum Energy Core | Elite UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        :root { --neon: #00f2ff; --bg: #050b12; }
        body { background: var(--bg); color: var(--neon); font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        .core { width: 400px; background: #0c141d; padding: 40px; border-radius: 20px; border: 1px solid var(--neon); box-shadow: 0 0 40px rgba(0, 242, 255, 0.2); transition: 0.5s; }
        .core:hover { box-shadow: 0 0 60px rgba(0, 242, 255, 0.4); }
        
        h1 { font-size: 1.5rem; text-align: center; text-transform: uppercase; margin-bottom: 30px; letter-spacing: 3px; }
        input, select { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--neon); color: white; padding: 10px; margin-bottom: 20px; outline: none; }
        
        button { width: 100%; padding: 15px; background: transparent; border: 2px solid var(--neon); color: var(--neon); cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: var(--neon); color: black; }
        
        #result { margin-top: 30px; padding: 20px; background: rgba(0, 242, 255, 0.05); border-radius: 10px; font-size: 0.9rem; line-height: 1.6; }
    </style>
</head>
<body>

<div class="core">
    <h1>Quantum Core</h1>
    
    <select id="reactionType">
        <option value="fission">Nuclear Fission</option>
        <option value="fusion">Nuclear Fusion</option>
    </select>

    <input type="number" id="mass" placeholder="Mass Defect (kg)">

    <button onclick="calculate()">[ EXECUTE CALCULATION ]</button>

    <div id="result">System Awaiting Data Input...</div>
</div>

<script>
    function calculate() {
        const c = 299792458;
        let m = parseFloat(document.getElementById('mass').value);
        let output = document.getElementById('result');
        
        if(!m || m <= 0) {
            output.innerHTML = "<span style='color:#ff4757'>CRITICAL ERROR: Input valid mass!</span>";
            return;
        }

        let E = m * Math.pow(c, 2);
        output.innerHTML = `
            <strong>STATUS:</strong> Reaction Success<br>
            <strong>ENERGY OUTPUT:</strong> ${E.toExponential(3)} J<br>
            <strong>EQUIVALENT TNT:</strong> ${(E / 4.184e9).toFixed(2)} Tons<br>
            <span style='font-size:0.7rem; opacity:0.6;'>// CALCULATED BY E=mc²</span>
        `;
    }
</script>
</body>
</html>
