    <style>
/* ===== NB KIT: sticker / neo-brutalist দৃশ্যরূপ =====
   প্রতিটি গেম নিজের :root-এ এই টোকেনগুলো বদলে নিজস্ব রং পায়:
   --o1 --o2 --o3 (বাইরের ব্যাকগ্রাউন্ড), --paper (বোর্ড), --paper2, --ink, --a1 --a2 --a3 (অ্যাকসেন্ট)  */
:root {
    color-scheme: light;
    --o1: #ff6b4a; --o2: #ffd23f; --o3: #5ad1c4;
    --paper: #fff8ec; --paper2: #ffffff; --ink: #1d1030; --mute: #6a5f80;
    --a1: #ff6b4a; --a2: #2ec4b6; --a3: #ffd23f; --good: #12a36b; --bad: #e5384d;
    --bw: 3px; --rad: 16px; --sh: 5px;
    --display: 'Bricolage Grotesque','Hind Siliguri',system-ui,sans-serif;
    --body: 'Hind Siliguri','Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
    --pat: radial-gradient(rgba(29,16,48,.20) 1.4px, transparent 1.6px);
    --pat-size: 22px 22px;
}
:root[data-bg="2"] { --o1: #2ec4b6; --o2: #c9f2ee; --o3: #ff6b4a; }
:root[data-bg="3"] { --o1: #a78bfa; --o2: #ffd6f0; --o3: #ffd23f; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--body); font-weight: 500; line-height: 1.55;
    padding: 18px max(14px, env(safe-area-inset-right, 0px)) 30px max(14px, env(safe-area-inset-left, 0px));
    background-color: var(--o1);
    background-image: var(--pat), radial-gradient(circle at 12% 6%, var(--o2) 0, transparent 46%), radial-gradient(circle at 94% 96%, var(--o3) 0, transparent 50%);
    background-size: var(--pat-size), 100% 100%, 100% 100%;
    background-attachment: fixed; transition: background-color .4s; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

.stage { max-width: 860px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 24px; box-shadow: 9px 9px 0 var(--ink); }
.credit { width: fit-content; max-width: 100%; margin: 18px auto 0; padding: 6px 14px; text-align: center; font-size: 12.5px; font-weight: 700; letter-spacing: .3px; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--ink); }

/* উপরের বার */
.top { display: flex; align-items: center; gap: 10px; }
.titlebox { margin-right: auto; min-width: 0; }
.titlebox b { display: inline-block; padding: 3px 12px; font: 800 clamp(1.05rem, 3.6vw, 1.35rem)/1.3 var(--display); color: var(--ink); background: var(--a3); border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-1.2deg); }
.titlebox small { display: block; margin: 5px 0 0 4px; font-size: 12px; font-weight: 700; color: var(--mute); }
.btn, .back-btn, .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 14px;

    border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s, background .12s;

.btn:hover:not(:disabled), .back-btn:hover, .icon-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }

/* পিল, ক্যাপসুল, কার্ড */

.pill b { font-variant-numeric: tabular-nums; }

.toast.on { animation: nbtoast 1.7s ease forwards; }
@keyframes nbtoast { 0% { opacity: 0; transform: translate(-50%, -10px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@keyframes nbshake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes nbpop { from { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); } to { transform: scale(1); opacity: 1; } }

@media (max-width: 560px) { .lab { grid-template-columns: 1fr; } .vessel { flex-direction: row; justify-content: center; gap: 14px; min-height: 0; } .panel { grid-template-columns: 1fr; } }

    <script>
/* ===== NB SOUND: শূন্য-নির্ভরতার WebAudio সাউন্ড ইফেক্ট =====
   ব্যবহার: const sfx = NBSound('গেমের-কী'); sfx.ok(); sfx.bad(); sfx.win(); sfx.lose(); sfx.tap(); sfx.pop();
   বাটন: #soundBtn থাকলে সেটি নিজে নিজে 🔔/🔕 টগল করে (localStorage '<কী>-sound') */
function NBSound(key) {
    let on = true, ac = null;
    try { on = localStorage.getItem(key + '-sound') !== '0'; } catch (e) {}
    function tone(f, t0, dur, type, vol) {
        if (!on) return;
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
            const t = ac.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .03);
        } catch (e) {}
    }
    const api = {
        ok() { tone(660, 0, .12); tone(880, .1, .16); },
        bad() { tone(220, 0, .2, 'sawtooth', .1); tone(160, .14, .26, 'sawtooth', .1); },
        tap() { tone(520, 0, .06, 'triangle', .1); },
        pop() { tone(440, 0, .08, 'square', .06); tone(740, .06, .1, 'square', .06); },
        win() { tone(523, 0, .12); tone(659, .12, .12); tone(784, .24, .12); tone(1047, .36, .3); },
        lose() { tone(392, 0, .2); tone(330, .2, .2); tone(262, .4, .4); },
        get on() { return on; },
        toggle() { on = !on; try { localStorage.setItem(key + '-sound', on ? '1' : '0'); } catch (e) {} paint(); if (on) api.ok(); }
    };
    function paint() { const b = document.getElementById('soundBtn'); if (b) b.textContent = on ? '🔔' : '🔕'; }
    document.addEventListener('DOMContentLoaded', () => { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } });
    if (document.readyState !== 'loading') { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } }
    return api;
}

(function () {
'use strict';
let sfx; try { sfx = NBSound('gaslab'); } catch (e) { sfx = { ok() {}, bad() {}, tap() {}, pop() {}, win() {}, lose() {}, toggle() {} }; }
const $ = s => document.querySelector(s);
const bn = n => Number(n).toLocaleString('bn-BD', { useGrouping: false });
const fx = (n, d) => Number(n).toLocaleString('bn-BD', { useGrouping: false, minimumFractionDigits: d, maximumFractionDigits: d });
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
$('#bgBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-bg') || '1'; const next = cur === '1' ? '2' : cur === '2' ? '3' : '1';
    if (next === '1') document.documentElement.removeAttribute('data-bg'); else document.documentElement.setAttribute('data-bg', next);
    lsSet('gaslab-bg', next); sfx.tap();
});
const R = 0.0821;
/* st(x): x = স্লাইডারের মান → {P,V,T,n}; val(o,x): যা লক্ষ্যের সাথে মেলাতে হবে */
const N0 = 2 * 5 / (R * 300), N1 = 1 * 6 / (R * 300);
const LEVELS = [

    cx.lineWidth = 5; cx.strokeStyle = '#14233b'; cx.strokeRect(g.x0, g.y0, g.xp - g.x0, g.y1 - g.y0);
    cx.fillStyle = l.cyl === 'rigid' ? '#8a97b3' : '#ffd54a'; cx.fillRect(g.xp, g.y0 - 8, 22, g.y1 - g.y0 + 16); cx.strokeRect(g.xp, g.y0 - 8, 22, g.y1 - g.y0 + 16);
    if (l.cyl === 'rigid') { cx.fillStyle = '#14233b'; [g.y0 + 8, g.y1 - 8].forEach(y => { cx.beginPath(); cx.arc(g.xp + 11, y, 4, 0, 6.28); cx.fill(); }); }
    else { cx.beginPath(); cx.moveTo(g.xp + 22, H / 2); cx.lineTo(W - 20, H / 2); cx.stroke(); cx.fillStyle = '#ff6a57'; cx.fillRect(W - 44, H / 2 - 34, 28, 68); cx.strokeRect(W - 44, H / 2 - 34, 28, 68); }
    cx.fillStyle = '#14233b'; cx.font = '800 15px "Hind Siliguri",sans-serif'; cx.textAlign = 'left';
    cx.fillText(l.cyl === 'rigid' ? '🔒 দৃঢ় পাত্র' : l.cyl === 'free' ? '🎈 মুক্ত পিস্টন (১ atm)' : '🗜️ পিস্টন', g.x0, 28);
    cx.fillText('🔥'.repeat(Math.max(1, Math.round((o.T - 150) / 100))), g.x0, 224);
}
let raf = 0;
function loop() { const o = state(); syncParts(o); draw(o); raf = requestAnimationFrame(loop); }
const dg = () => L().d == null ? 2 : L().d;
function readouts() {
    const o = state(), l = L(), hide = l.blind && !S.fired;
    const cell = (lab, val, hid) => '<div' + (hid ? ' class="hid"' : '') + '><small>' + lab + '</small><b>' + val + '</b></div>';
    $('#ro').innerHTML = cell('P (atm)', hide ? '???' : fx(P(o), 2), hide) + cell('V (L)', fx(o.V, 1)) + cell('T (K)', bn(Math.round(o.T))) + cell('n (mol)', fx(o.n, 3)); return o;
}
function render() {
    const l = L(), o = readouts(); const k = l.knob; const dd = dg();
    $('#sTry').textContent = bn(S.tries); $('#sHint').textContent = bn(S.hints); $('#pMode').textContent = l.blind ? '🙈 অন্ধ (হিসাব করো)' : '👀 লাইভ';
    $('#btnHint').disabled = S.hints <= 0 || S.done; $('#btnHint').hidden = l.hn === 0;
    $('#btnGo').textContent = l.blind ? '🔥 পরীক্ষা চালাও' : '✅ যাচাই করো';
    let info = '🎯 লক্ষ্য: <b>' + l.gname + ' = ' + fx(l.target, dd) + l.unit + '</b> (±' + bn(Math.round(l.tol * 100)) + '%)<br>দেওয়া আছে: ' + l.given;
    if (!l.blind) { if (l.live) info += ' · ' + l.live(o); info += ' · এখন: <b>' + fx(gv(), dd) + l.unit + '</b>' + (ok() ? ' ✔' : ''); }
    else if (S.fired) info += '<br>শেষ পরীক্ষায়: <b>' + fx(gv(), dd) + l.unit + '</b>';
    if (l.partial && S.fired) info += '<br>আংশিক চাপ: N₂ = ' + fx((o.n - S.v) / o.n * P(o), 2) + ' atm, He = ' + fx(S.v / o.n * P(o), 2) + ' atm';
    $('#info').innerHTML = info;
    const st = k.step < 0.01 ? 3 : (k.step < 0.1 ? 2 : (k.step < 1 ? 1 : 0));
    $('#panel').innerHTML = '<div class="ctl"><label for="kn"><span>' + k.n + '</span><output id="ko">' + fx(S.v, st) + k.u + '</output></label><input type="range" id="kn" min="' + k.min + '" max="' + k.max + '" step="' + k.step + '" value="' + S.v + '"></div>';
}
function start(i) {
    S.lv = i; const l = L(); S.v = l.knob.v; S.hints = l.hn; S.tries = 0; S.miss = 0; S.done = false; S.fired = false; parts = [];
    renderTabs(); $('#job').innerHTML = '<span class="sticker">লেভেল ' + bn(i + 1) + ' / ' + bn(LEVELS.length) + '</span><h2>' + l.icon + ' ' + l.name + ' — ' + l.sub + '</h2><p>' + l.intro + '</p>';
    $('#shift').innerHTML = l.blind ? '🧮 আগে খাতায় হিসাব করো, তারপর স্লাইডার সেট করে পরীক্ষা চালাও।' : 'স্লাইডার নাড়িয়ে অণুদের আচরণ দেখো।';
    render();
}
function renderTabs() { $('#lv').innerHTML = LEVELS.map((l, i) => '<button class="lvb' + (i === S.lv ? ' on' : '') + '" data-lv="' + i + '"' + (unlocked(i) ? '' : ' disabled') + '><b>' + bn(i + 1) + '. ' + (unlocked(i) ? l.icon : '🔒') + ' ' + l.name + '</b><small>' + l.sub + '</small>' + (stars[i] ? '<i>' + starStr(stars[i]) + '</i>' : '') + '</button>').join(''); const a = document.querySelector('.lvb.on'); if (a) $('#lv').scrollLeft = Math.max(0, a.offsetLeft - 24); }
function finish() {
    S.done = true; sfx.win(); const l = L(); const used = l.hn - S.hints; const score = S.miss + 2 * used; const st = score <= 1 ? 3 : score <= 3 ? 2 : 1;
    if (!stars[S.lv] || st > stars[S.lv]) { stars[S.lv] = st; lsSet('gaslab-stars', JSON.stringify(stars)); }
    renderTabs(); render(); const last = S.lv === LEVELS.length - 1;
    $('#sheet').innerHTML = '<div class="stars">' + starStr(st) + '</div><h2>' + l.icon + ' ' + l.name + ' — মিলে গেছে!</h2><p>পরীক্ষা: <b>' + bn(S.tries) + '</b> · সূত্র দেখেছ: <b>' + bn(used) + '</b></p><div class="learn">🧠 ' + l.learn + '</div><div class="row">' +
        (last ? '<b>🏆 সব লেভেল শেষ! তুমি গ্যাস-মাস্টার।</b>' : '<button class="btn primary big" data-act="next">পরের লেভেল ▶</button>') + '<button class="btn" data-act="again">↺ আবার</button><button class="btn" data-act="close">বন্ধ করো</button></div>';
    $('#modal').hidden = false;
}
function go() {
    if (S.done) return; const l = L(); S.tries++; S.fired = true;
    if (ok()) { finish(); return; }
    S.miss++; sfx.bad(); const v = gv(), t = l.target;
    $('#shift').innerHTML = '❌ ফলাফল <b>' + fx(v, dg()) + l.unit + '</b> — লক্ষ্য ' + fx(t, dg()) + l.unit + '। ' + (v > t ? 'বেশি হয়ে গেছে, ' : 'কম হয়েছে, ') + 'হিসাব আবার মেলাও।';
    render();
}
document.addEventListener('input', e => { if (e.target.id === 'kn') { S.v = +e.target.value; if (L().blind) S.fired = false; render(); sfx.tap(); } });
document.addEventListener('click', e => {
    const t = e.target.closest('[data-lv],[data-act],#btnHint,#btnReset,#btnGo,#btnRules'); if (!t) return;
    if (t.dataset.lv != null) { sfx.tap(); start(+t.dataset.lv); return; }
    if (t.id === 'btnGo') { go(); return; }
    if (t.id === 'btnReset') { sfx.tap(); start(S.lv); return; }
    if (t.id === 'btnHint') { if (S.hints > 0 && !S.done && L().hint) { S.hints--; sfx.pop(); $('#shift').innerHTML = '💡 ' + L().hint; render(); } return; }
    if (t.id === 'btnRules') { $('#sheet').innerHTML = '<h2>📖 নিয়ম</h2><ul><li>স্লাইডার সরিয়ে লক্ষ্যের মান ঠিক করো। অণুদের নাচ দেখো: গরমে দ্রুত, বেশি অণু = বেশি ধাক্কা।</li><li><b>অন্ধ লেভেলে</b> চাপমাপক ঢাকা — হিসাব করে মান বসাও, তারপর পরীক্ষা চালাও।</li><li>পরের লেভেলগুলোয় সহনশীলতা ±১% এবং সূত্র-সাহায্য কম।</li><li>ভুল পরীক্ষা ও সূত্র দেখা কমালে বেশি তারা।</li></ul><div class="row"><button class="btn primary" data-act="close">বুঝেছি</button></div>'; $('#modal').hidden = false; return; }
    if (t.dataset.act === 'close') { $('#modal').hidden = true; return; }
    if (t.dataset.act === 'again') { $('#modal').hidden = true; start(S.lv); return; }
    if (t.dataset.act === 'next') { $('#modal').hidden = true; start(Math.min(S.lv + 1, LEVELS.length - 1)); return; }
});
window.__t = { S, LEVELS, state, P, ok, start, go, render, gv };
start(0); loop();
})();
