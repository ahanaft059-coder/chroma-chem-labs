    <style>
/* ===== NB KIT: sticker / neo-brutalist দৃশ্যরূপ =====
   প্রতিটি গেম নিজের :root-এ এই টোকেনগুলো বদলে নিজস্ব রং পায়:
   --o1 --o2 --o3 (বাইরের ব্যাকগ্রাউন্ড), --paper (বোর্ড), --paper2, --ink, --a1 --a2 --a3 (অ্যাকসেন্ট)  */
:root {
    color-scheme: light;
    --o1: #ff6b4a; --o2: #ffd23f; --o3: #5ad1c4;
    --paper: #fff8ec; --paper2: #ffffff; --ink: #1d1030; --mute: #6a5f80;
    --a1: #ff6b4a; --a2: #2ec4b6; --a3: #ffd23f; --good: #12a36b; --bad: #e5384d;
    --bw: 3px; --rad: 16px; --sh: 5px;
    --display: 'Bricolage Grotesque','Hind Siliguri',system-ui,sans-serif;
    --body: 'Hind Siliguri','Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
    --pat: radial-gradient(rgba(29,16,48,.20) 1.4px, transparent 1.6px);
    --pat-size: 22px 22px;
}
:root[data-bg="2"] { --o1: #2ec4b6; --o2: #c9f2ee; --o3: #ff6b4a; }
:root[data-bg="3"] { --o1: #a78bfa; --o2: #ffd6f0; --o3: #ffd23f; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--body); font-weight: 500; line-height: 1.55;
    padding: 18px max(14px, env(safe-area-inset-right, 0px)) 30px max(14px, env(safe-area-inset-left, 0px));
    background-color: var(--o1);
    background-image: var(--pat), radial-gradient(circle at 12% 6%, var(--o2) 0, transparent 46%), radial-gradient(circle at 94% 96%, var(--o3) 0, transparent 50%);
    background-size: var(--pat-size), 100% 100%, 100% 100%;
    background-attachment: fixed; transition: background-color .4s; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

.stage { max-width: 860px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 24px; box-shadow: 9px 9px 0 var(--ink); }
.credit { width: fit-content; max-width: 100%; margin: 18px auto 0; padding: 6px 14px; text-align: center; font-size: 12.5px; font-weight: 700; letter-spacing: .3px; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--ink); }

.titlebox small { display: block; margin: 5px 0 0 4px; font-size: 12px; font-weight: 700; color: var(--mute); }

    <script>
/* ===== NB SOUND: শূন্য-নির্ভরতার WebAudio সাউন্ড ইফেক্ট =====
   ব্যবহার: const sfx = NBSound('গেমের-কী'); sfx.ok(); sfx.bad(); sfx.win(); sfx.lose(); sfx.tap(); sfx.pop();
   বাটন: #soundBtn থাকলে সেটি নিজে নিজে 🔔/🔕 টগল করে (localStorage '<কী>-sound') */
function NBSound(key) {
    let on = true, ac = null;
    try { on = localStorage.getItem(key + '-sound') !== '0'; } catch (e) {}
    function tone(f, t0, dur, type, vol) {
        if (!on) return;
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
            const t = ac.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .03);
        } catch (e) {}
    }
    const api = {
        ok() { tone(660, 0, .12); tone(880, .1, .16); },
        bad() { tone(220, 0, .2, 'sawtooth', .1); tone(160, .14, .26, 'sawtooth', .1); },
        tap() { tone(520, 0, .06, 'triangle', .1); },
        pop() { tone(440, 0, .08, 'square', .06); tone(740, .06, .1, 'square', .06); },
        win() { tone(523, 0, .12); tone(659, .12, .12); tone(784, .24, .12); tone(1047, .36, .3); },
        lose() { tone(392, 0, .2); tone(330, .2, .2); tone(262, .4, .4); },
        get on() { return on; },
        toggle() { on = !on; try { localStorage.setItem(key + '-sound', on ? '1' : '0'); } catch (e) {} paint(); if (on) api.ok(); }
    };
    function paint() { const b = document.getElementById('soundBtn'); if (b) b.textContent = on ? '🔔' : '🔕'; }
    document.addEventListener('DOMContentLoaded', () => { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } });
    if (document.readyState !== 'loading') { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } }
    return api;
}

(function () {
'use strict';
let sfx; try { sfx = NBSound('gaslab'); } catch (e) { sfx = { ok() {}, bad() {}, tap() {}, pop() {}, win() {}, lose() {}, toggle() {} }; }
const $ = s => document.querySelector(s);
const bn = n => Number(n).toLocaleString('bn-BD', { useGrouping: false });
const fx = (n, d) => Number(n).toLocaleString('bn-BD', { useGrouping: false, minimumFractionDigits: d, maximumFractionDigits: d });
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
$('#bgBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-bg') || '1'; const next = cur === '1' ? '2' : cur === '2' ? '3' : '1';
    if (next === '1') document.documentElement.removeAttribute('data-bg'); else document.documentElement.setAttribute('data-bg', next);
    lsSet('gaslab-bg', next); sfx.tap();
});
const R = 0.0821;
/* P = nRT/V ; কনটেইনার: knob = চলক */
const LEVELS = [
 { name: 'বয়েলের সূত্র', sub: 'T স্থির', icon: '🗜️', blind: false, tol: 0.03, vmax: 10, cyl: 'piston',
   intro: 'T = ৩০০ K ও গ্যাসের পরিমাণ স্থির। পিস্টন চেপে চাপ ঠিক <b>৪.০ atm</b> করো। পরীক্ষা করে দেখো P × V কীভাবে বদলায়!',
   fixed: { T: 300, n: 0.5 }, knob: { k: 'V', n: '🗜️ আয়তন V', u: ' L', min: 1, max: 10, step: 0.1, v: 8 },
   goal: o => P(o), target: 4.0, unit: ' atm', gname: 'চাপ P',
   hint: 'P₁V₁ = P₂V₂ (T, n স্থির)। এখন P×V এর মান দেখো — ধ্রুবক! তাহলে V = (P×V) ÷ ৪।',
   learn: 'T ও n স্থির থাকলে P ∝ 1/V, অর্থাৎ P×V = ধ্রুবক। আয়তন অর্ধেক করলে চাপ দ্বিগুণ — অণুরা দেয়ালে দ্বিগুণ ঘন ঘন ধাক্কা দেয়।' },
 { name: 'চার্লসের সূত্র', sub: 'P স্থির (বেলুন)', icon: '🎈', blind: false, tol: 0.03, vmax: 25, cyl: 'free',
   intro: 'পিস্টন মুক্ত, বাইরের চাপ ১ atm স্থির। গ্যাসকে গরম বা ঠান্ডা করে বেলুনের আয়তন ঠিক <b>১৫ L</b> করো।',
   fixed: { P: 1, n: 0.5 }, knob: { k: 'T', n: '🌡️ তাপমাত্রা T', u: ' K', min: 200, max: 600, step: 5, v: 250 },
   goal: o => o.V, target: 15, unit: ' L', gname: 'আয়তন V',
   hint: 'V/T = ধ্রুবক। এখন V/T এর মান দেখো; T = V ÷ (V/T)।',
   learn: 'P স্থির থাকলে V ∝ T (কেলভিনে)। গরম অণু দ্রুত ছোটে, পিস্টনকে বেশি ঠেলে — আয়তন বাড়ে।' },
 { name: 'গে-লুসাকের সূত্র', sub: 'V স্থির (বন্ধ ক্যান) · অন্ধ', icon: '🥫', blind: true, tol: 0.03, vmax: 6.5, cyl: 'rigid',
   intro: 'বন্ধ ক্যানে <b>৩০০ K-এ চাপ ২.০ atm</b>। চাপমাপক যন্ত্র ঢাকা! হিসাব করে তাপমাত্রা ঠিক করো যাতে চাপ <b>৩.০ atm</b> হয়, তারপর পরীক্ষা চালাও।',
   fixed: { V: 5, n: 2 * 5 / (R * 300) }, knob: { k: 'T', n: '🌡️ তাপমাত্রা T', u: ' K', min: 250, max: 600, step: 5, v: 300 },
   goal: o => P(o), target: 3.0, unit: ' atm', gname: 'চাপ P',
   hint: 'P₁/T₁ = P₂/T₂ ⇒ T₂ = T₁ × P₂/P₁ = ৩০০ × ৩ ÷ ২।',
   learn: 'V স্থির থাকলে P ∝ T। বন্ধ ক্যান আগুনে দিলে তাই বিস্ফোরণের ভয় — চাপ তাপমাত্রার সাথে সরলরেখায় বাড়ে।' },
 { name: 'আদর্শ গ্যাস সমীকরণ', sub: 'PV = nRT · অন্ধ', icon: '⚗️', blind: true, tol: 0.03, vmax: 8, cyl: 'rigid',
   intro: 'ট্যাংক ৬ L, তাপমাত্রা ৩৫০ K। কত মোল (n) গ্যাস ভরলে চাপ হবে <b>২.৫ atm</b>? R = ০.০৮২১ L·atm/(mol·K)। চাপমাপক ঢাকা।',
   fixed: { V: 6, T: 350 }, knob: { k: 'n', n: '⚗️ গ্যাসের পরিমাণ n', u: ' mol', min: 0.1, max: 2, step: 0.01, v: 1 },
   goal: o => P(o), target: 2.5, unit: ' atm', gname: 'চাপ P',
   hint: 'n = PV ÷ RT = (২.৫ × ৬) ÷ (০.০৮২১ × ৩৫০)।',
   learn: 'PV = nRT — চারটি চলক একসাথে। তিনটি জানা থাকলে চতুর্থটি হিসাব করে বের করা যায়।' },
 { name: 'ডালটনের সূত্র', sub: 'মিশ্র গ্যাস · অন্ধ', icon: '🧪', blind: true, tol: 0.03, vmax: 12, cyl: 'rigid',
   intro: '১০ L পাত্রে ৩০০ K-এ ০.৩০ mol N₂ আছে। এতে কিছু হিলিয়াম (He) ঢুকিয়ে <b>মোট চাপ ১.৫ atm</b> করো। কত মোল He লাগবে?',
   fixed: { V: 10, T: 300, n0: 0.3 }, knob: { k: 'n', n: '🎈 যোগ করা He', u: ' mol', min: 0, max: 1, step: 0.01, v: 0.1 },
   goal: o => P(o), target: 1.5, unit: ' atm', gname: 'মোট চাপ',
   hint: 'n মোট = PV ÷ RT = (১.৫ × ১০) ÷ (০.০৮২১ × ৩০০); এরপর He = n মোট − ০.৩০।',
   learn: 'মিশ্র গ্যাসে মোট চাপ = আংশিক চাপগুলোর যোগফল (P = P₁ + P₂)। প্রতিটি গ্যাস এমনভাবে আচরণ করে যেন সে একাই পাত্রে আছে।' }
];
const S = { lv: 0, v: 0, hints: 2, tries: 0, miss: 0, done: false, fired: false };
let stars = {}; try { stars = JSON.parse(lsGet('gaslab-stars') || '{}') || {}; } catch (e) { stars = {}; }
const unlocked = i => i === 0 || stars[i - 1] > 0;
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const L = () => LEVELS[S.lv];
function state() {
    const l = L(), o = Object.assign({ P: 1, V: 4, T: 300, n: 0.5 }, l.fixed); o[l.knob.k] = S.v;
    if (S.lv === 4) { o.n = o.n0 + S.v; }
    if (l.knob.k === 'T' && l.cyl === 'free') { /* V = nRT/P */ }
    if (l.cyl === 'free') o.V = o.n * R * o.T / o.P; else o.P = o.n * R * o.T / o.V;
    return o;
}
function P(o) { return o.n * R * o.T / o.V; }
function ok(o) { const l = L(), v = l.goal(o); return Math.abs(v - l.target) <= l.tol * l.target; }

/* ---- সিমুলেশন ---- */
const cv = $('#cv'), cx = cv.getContext('2d'); const W = 720, H = 240;
let parts = [];
function syncParts(o) {
    const want = Math.max(4, Math.min(70, Math.round(o.n * 50)));
    while (parts.length < want) parts.push({ x: 40 + Math.random() * 100, y: 50 + Math.random() * 130, a: Math.random() * 6.28 });
    parts.length = want;
}
function geom(o) { const l = L(); const x0 = 24, full = W - 150; const xp = x0 + Math.max(0.04, Math.min(1, o.V / l.vmax)) * full; return { x0, xp, y0: 46, y1: 196 }; }
function draw(o) {
    const g = geom(o), l = L(); cx.clearRect(0, 0, W, H);
    const hue = Math.max(0, Math.min(215, 215 - (o.T - 150) / 500 * 215)); const sp = 1.2 * Math.sqrt(o.T / 300) * 2.2;
    cx.fillStyle = 'hsla(' + hue + ',90%,92%,1)'; cx.fillRect(g.x0, g.y0, g.xp - g.x0, g.y1 - g.y0);
    parts.forEach(p => {
        p.x += Math.cos(p.a) * sp; p.y += Math.sin(p.a) * sp;
        if (p.x < g.x0 + 8) { p.x = g.x0 + 8; p.a = Math.PI - p.a; } if (p.x > g.xp - 8) { p.x = g.xp - 8; p.a = Math.PI - p.a; }
        if (p.y < g.y0 + 8) { p.y = g.y0 + 8; p.a = -p.a; } if (p.y > g.y1 - 8) { p.y = g.y1 - 8; p.a = -p.a; }
        cx.beginPath(); cx.arc(p.x, p.y, 6, 0, 6.283); cx.fillStyle = 'hsl(' + hue + ',85%,52%)'; cx.fill(); cx.lineWidth = 2; cx.strokeStyle = '#14233b'; cx.stroke();
    });
    cx.lineWidth = 5; cx.strokeStyle = '#14233b'; cx.strokeRect(g.x0, g.y0, g.xp - g.x0, g.y1 - g.y0);
    /* পিস্টন */
    cx.fillStyle = l.cyl === 'rigid' ? '#8a97b3' : '#ffd54a'; cx.fillRect(g.xp, g.y0 - 8, 22, g.y1 - g.y0 + 16); cx.strokeRect(g.xp, g.y0 - 8, 22, g.y1 - g.y0 + 16);
    if (l.cyl === 'rigid') { cx.fillStyle = '#14233b'; [g.y0 + 8, g.y1 - 8].forEach(y => { cx.beginPath(); cx.arc(g.xp + 11, y, 4, 0, 6.28); cx.fill(); }); }
    else { cx.beginPath(); cx.moveTo(g.xp + 22, H / 2); cx.lineTo(W - 20, H / 2); cx.stroke(); cx.fillStyle = '#ff6a57'; cx.fillRect(W - 44, H / 2 - 34, 28, 68); cx.strokeRect(W - 44, H / 2 - 34, 28, 68); }
    cx.fillStyle = '#14233b'; cx.font = '800 15px "Hind Siliguri",sans-serif'; cx.textAlign = 'left';
    cx.fillText(l.cyl === 'rigid' ? '🔒 দৃঢ় পাত্র' : l.cyl === 'free' ? '🎈 মুক্ত পিস্টন (১ atm)' : '🗜️ পিস্টন', g.x0, 28);
    cx.fillText('🔥'.repeat(Math.max(1, Math.round((o.T - 150) / 100))), g.x0, 224);
}
let raf = 0;
function loop() { const o = state(); syncParts(o); draw(o); raf = requestAnimationFrame(loop); }

function readouts() {
    const o = state(), l = L(), hide = l.blind && !S.fired;
    const cell = (lab, val, hid) => '<div' + (hid ? ' class="hid"' : '') + '><small>' + lab + '</small><b>' + val + '</b></div>';
    let h = cell('P (atm)', hide ? '???' : fx(P(o), 2), hide) + cell('V (L)', fx(o.V, 1)) + cell('T (K)', bn(Math.round(o.T))) + cell('n (mol)', fx(o.n, 2));
    $('#ro').innerHTML = h; return o;
}
function render() {
    const l = L(), o = readouts(); const k = l.knob;
    $('#sTry').textContent = bn(S.tries); $('#sHint').textContent = bn(S.hints); $('#pMode').textContent = l.blind ? '🙈 অন্ধ (হিসাব করো)' : '👀 লাইভ';
    $('#btnHint').disabled = S.hints <= 0 || S.done;
    $('#btnGo').textContent = l.blind ? '🔥 পরীক্ষা চালাও' : '✅ যাচাই করো';
    let info = '🎯 লক্ষ্য: <b>' + l.gname + ' = ' + fx(l.target, 1) + l.unit + '</b> (±৩%)';
    if (!l.blind) {
        if (S.lv === 0) info += ' · P × V = <b>' + fx(P(o) * o.V, 2) + '</b>';
        if (S.lv === 1) info += ' · V ÷ T = <b>' + fx(o.V / o.T, 4) + '</b>';
        info += ' · এখন: <b>' + fx(l.goal(o), 2) + l.unit + '</b>' + (ok(o) ? ' ✔' : '');
    } else if (S.fired) info += ' · শেষ পরীক্ষায়: <b>' + fx(l.goal(o), 2) + l.unit + '</b>';
    if (S.lv === 4 && S.fired) { const nt = o.n; info += '<br>আংশিক চাপ: N₂ = ' + fx(o.n0 / nt * P(o), 2) + ' atm, He = ' + fx(S.v / nt * P(o), 2) + ' atm'; }
    if (S.lv === 2 || S.lv === 3 || S.lv === 4) info += '<br>দেওয়া আছে: ' + ({ 2: 'P₁ = ২.০ atm, T₁ = ৩০০ K, V = ৫ L', 3: 'V = ৬ L, T = ৩৫০ K, R = ০.০৮২১', 4: 'V = ১০ L, T = ৩০০ K, N₂ = ০.৩০ mol, R = ০.০৮২১' }[S.lv]);
    $('#info').innerHTML = info;
    $('#panel').innerHTML = '<div class="ctl"><label for="kn"><span>' + k.n + '</span><output id="ko">' + fx(S.v, k.step < 0.1 ? 2 : (k.step < 1 ? 1 : 0)) + k.u + '</output></label><input type="range" id="kn" min="' + k.min + '" max="' + k.max + '" step="' + k.step + '" value="' + S.v + '"></div>';
}
function start(i) {
    S.lv = i; const l = L(); S.v = l.knob.v; S.hints = 2; S.tries = 0; S.miss = 0; S.done = false; S.fired = false; parts = [];
    renderTabs(); $('#job').innerHTML = '<span class="sticker">লেভেল ' + bn(i + 1) + ' / ' + bn(LEVELS.length) + '</span><h2>' + l.icon + ' ' + l.name + ' — ' + l.sub + '</h2><p>' + l.intro + '</p>';
    $('#shift').innerHTML = l.blind ? '🧮 আগে খাতায় হিসাব করো, তারপর স্লাইডার সেট করে পরীক্ষা চালাও।' : 'স্লাইডার নাড়িয়ে অণুদের আচরণ দেখো।';
    render();
}
function renderTabs() { $('#lv').innerHTML = LEVELS.map((l, i) => '<button class="lvb' + (i === S.lv ? ' on' : '') + '" data-lv="' + i + '"' + (unlocked(i) ? '' : ' disabled') + '><b>' + (unlocked(i) ? l.icon : '🔒') + ' ' + l.name + '</b><small>' + l.sub + '</small>' + (stars[i] ? '<i>' + starStr(stars[i]) + '</i>' : '') + '</button>').join(''); }
function finish() {
    S.done = true; sfx.win(); const l = L(); const score = S.miss + 2 * (2 - S.hints); const st = score <= 1 ? 3 : score <= 3 ? 2 : 1;
    if (!stars[S.lv] || st > stars[S.lv]) { stars[S.lv] = st; lsSet('gaslab-stars', JSON.stringify(stars)); }
    renderTabs(); render(); const last = S.lv === LEVELS.length - 1;
    $('#sheet').innerHTML = '<div class="stars">' + starStr(st) + '</div><h2>' + l.icon + ' ' + l.name + ' — মিলে গেছে!</h2><p>পরীক্ষা: <b>' + bn(S.tries) + '</b> · সূত্র দেখেছ: <b>' + bn(2 - S.hints) + '</b></p><div class="learn">🧠 ' + l.learn + '</div><div class="row">' +
        (last ? '' : '<button class="btn primary big" data-act="next">পরের লেভেল ▶</button>') + '<button class="btn" data-act="again">↺ আবার</button><button class="btn" data-act="close">বন্ধ করো</button></div>';
    $('#modal').hidden = false;
}
function go() {
    if (S.done) return; const l = L(); S.tries++; S.fired = true; const o = state();
    if (ok(o)) { finish(); return; }
    S.miss++; sfx.bad(); const v = l.goal(o), t = l.target;
    $('#shift').innerHTML = '❌ ফলাফল <b>' + fx(v, 2) + l.unit + '</b> — লক্ষ্য ' + fx(t, 1) + l.unit + '। ' + (v > t ? 'বেশি হয়ে গেছে, ' : 'কম হয়েছে, ') + 'সূত্র দিয়ে আবার হিসাব মেলাও।';
    render();
}
document.addEventListener('input', e => { if (e.target.id === 'kn') { S.v = +e.target.value; if (L().blind) S.fired = false; render(); sfx.tap(); } });
document.addEventListener('click', e => {
    const t = e.target.closest('[data-lv],[data-act],#btnHint,#btnReset,#btnGo,#btnRules'); if (!t) return;
    if (t.dataset.lv != null) { sfx.tap(); start(+t.dataset.lv); return; }
    if (t.id === 'btnGo') { go(); return; }
    if (t.id === 'btnReset') { sfx.tap(); start(S.lv); return; }
    if (t.id === 'btnHint') { if (S.hints > 0 && !S.done) { S.hints--; sfx.pop(); $('#shift').innerHTML = '💡 ' + L().hint; render(); } return; }
    if (t.id === 'btnRules') { $('#sheet').innerHTML = '<h2>📖 নিয়ম</h2><ul><li>স্লাইডার সরিয়ে লক্ষ্যের মান ঠিক (±৩%) করো। অণুদের নাচ দেখো: গরমে দ্রুত, বেশি অণু = বেশি ধাক্কা।</li><li><b>অন্ধ লেভেলে</b> চাপমাপক ঢাকা — হিসাব করে মান বসাও, তারপর পরীক্ষা চালাও।</li><li>ভুল পরীক্ষা ও সূত্র দেখা কমালে বেশি তারা।</li></ul><div class="row"><button class="btn primary" data-act="close">বুঝেছি</button></div>'; $('#modal').hidden = false; return; }
    if (t.dataset.act === 'close') { $('#modal').hidden = true; return; }
    if (t.dataset.act === 'again') { $('#modal').hidden = true; start(S.lv); return; }
    if (t.dataset.act === 'next') { $('#modal').hidden = true; start(Math.min(S.lv + 1, LEVELS.length - 1)); return; }
});
window.__t = { S, LEVELS, state, P, ok, start, go, render };
start(0); loop();
})();
    </script>
