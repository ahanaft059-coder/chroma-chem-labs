<style>

.bar2{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}

<script>
/* ===== NB SOUND: শূন্য-নির্ভরতার WebAudio সাউন্ড ইফেক্ট =====
   ব্যবহার: const sfx = NBSound('গেমের-কী'); sfx.ok(); sfx.bad(); sfx.win(); sfx.lose(); sfx.tap(); sfx.pop();
   বাটন: #soundBtn থাকলে সেটি নিজে নিজে 🔔/🔕 টগল করে (localStorage '<কী>-sound') */
function NBSound(key) {
    let on = true, ac = null;
    try { on = localStorage.getItem(key + '-sound') !== '0'; } catch (e) {}
    function tone(f, t0, dur, type, vol) {
        if (!on) return;
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
            const t = ac.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .03);
        } catch (e) {}

    const rk = G.players.map((p, i) => [(p.human ? '👤 তুমি' : p.ico + ' ' + p.name), bn(p.score) + ' পয়েন্ট', i === w, p.score]).sort((a, b) => b[3] - a[3]);
    const rows = rk.map((r, i) => [(i === 0 ? '🥇 ' : i === 1 ? '🥈 ' : '🥉 ') + r[0], r[1], r[2]]);
    if (W.human) { sfx.win(); PREM.wish({ name: 'মাস্টার কেমিস্ট', line: 'তুমি আগে ' + bn(CFG.target) + ' পয়েন্ট ছুঁয়ে ল্যাবের দখল নিয়েছ!', stats: [['⭐ পয়েন্ট', bn(me().score)], ['🧪 যৌগ', bn(me().crafted.length)]], rank: rows, onAgain: newGame, onSetup: () => openSetup(false) }); return; }
    sfx.lose();
    $('#sheet').innerHTML = '<span class="mtag">খেলা শেষ</span><h2>' + W.ico + ' ' + W.name + ' জিতেছে!</h2><p>রোবটের বুদ্ধি ' + SK[CFG.skill].label + ' ছিল। কৌশল বদলে আবার চেষ্টা করলেই হারানো যাবে!</p><div class="rank">' + rows.map(r => '<div class="' + (r[2] ? 'me' : '') + '"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join('') + '</div><div class="row"><button class="pbtn gold big" id="again">▶ আবার খেলো</button><button class="pbtn" id="setupB">⚙ সেটিংস</button></div>';
    $('#modal').hidden = false; $('#again').onclick = newGame; $('#setupB').onclick = () => openSetup(false);
}

/* ---------- রেন্ডার ---------- */
function cardHtml(c, i, mode) {
    if (c.kind === 'element') return '<div class="cd ' + c.theme + (c.uid === G.newUid ? ' new' : '') + (mode === 'disc' ? ' disc' : '') + '" data-i="' + i + '" title="' + c.bn + ' · ' + THEME_LABEL[c.theme] + '"><span class="az">' + c.atomic + '</span><span class="vl">' + c.valency + '</span><b class="sy">' + c.symbol + '</b><span class="bnm">' + c.bn + (c.symbol === 'He' ? ' 🛡' : '') + '</span></div>';
    return '<button class="cd act' + (mode === 'disc' ? ' disc' : '') + (G.pending && G.pending.hi === i ? ' sel' : '') + (c.uid === G.newUid ? ' new' : '') + '" data-i="' + i + '" title="' + c.name + '"><span class="ic">' + c.icon + '</span><span class="tgx">' + c.tag + '</span><span class="bnm">' + c.bn + '</span></button>';
}
function render() {
    if (!G) return; const P = me(), human = isHumanTurn(), cnt = counts(P.hand);
    $('#tgt').textContent = bn(CFG.target); $('#deckN').textContent = bn(G.deck.length);
    $('#recipes').innerHTML = G.open.map((r, i) => { const can = human && canSyn(P.hand, r); return '<button class="rc' + (can ? ' can' : '') + '" data-r="' + i + '"><span class="pt">+' + bn(r.points) + '</span><span class="f">' + r.formula + '</span><span class="n">' + r.bn + ' · <span class="tg">' + r.tagBn + '</span></span><span class="req">' + Object.keys(r.req).map(s => '<span class="rq' + ((cnt[s] || 0) >= r.req[s] ? ' ok' : '') + '">' + s + ' ' + bn(Math.min(cnt[s] || 0, r.req[s])) + '/' + bn(r.req[s]) + '</span>').join('') + '</span></button>'; }).join('');
    $('#opps').innerHTML = G.players.map((p, i) => '<div class="op' + (G.turn === i && !G.over ? ' turn' : '') + (G.pending && i !== 0 ? ' tgt' : '') + '" data-p="' + i + '"><h4><span>' + (p.human ? '👤 তুমি' : p.ico + ' ' + p.name) + '</span><b>' + bn(p.score) + '</b></h4><div class="bar2"><i style="width:' + Math.min(100, Math.round(p.score / CFG.target * 100)) + '%"></i></div><small><span>🃏 ' + bn(p.hand.length) + 'টি</span><span>' + (G.turn === i && !G.over ? '▶ চলছে' : '') + '</span></small><div class="cr">' + p.crafted.map(c => '<span title="' + c.bn + '">' + c.formula + '</span>').join('') + '</div></div>').join('');
    $('#status').textContent = G.over ? 'খেলা শেষ।' : G.pending ? L('🎯 কার ওপর ' + G.pending.card.bn + ' চালাবে? লাল ঘেরা খেলোয়াড়কে ট্যাপ করো (বাতিল: কার্ডে আবার ট্যাপ)।', '🎯 Play ' + G.pending.card.bn + ' on whom? Tap a red-outlined player (cancel: tap the card again).') : (G.msg || '');
    $('#log').innerHTML = G.log.map(l => '<div>• ' + l + '</div>').join('');
    $('#hand').innerHTML = P.hand.map((c, i) => cardHtml(c, i, G.discardMode ? 'disc' : '')).join('');
    G.newUid = null;
    $('#handInfo').textContent = 'তোমার হাত · ' + bn(P.hand.length) + '/' + bn(HAND_LIMIT) + 'টি কার্ড';
    $('#btnEnd').disabled = !human; $('#btnDisc').disabled = !human || !P.hand.length; $('#btnDisc').textContent = G.discardMode ? '✖ ফেলা বাতিল' : '🗑 কার্ড ফেলো';
}
/* ---------- ইনপুট ---------- */
$('#recipes').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (!b || !isHumanTurn() || G.discardMode) return; const ri = +b.dataset.r; if (!synthesize(0, ri)) { sfx.bad(); PREM.toast('এই রেসিপির জন্য কার্ড যথেষ্ট নয়।'); } });
$('#hand').addEventListener('click', e => {
    const el = e.target.closest('[data-i]'); if (!el || !isHumanTurn()) return; const i = +el.dataset.i, c = me().hand[i]; if (!c) return;
    if (G.discardMode) { const d = me().hand.splice(i, 1)[0]; log('🗑 ' + d.bn + ' ফেলে দিলে'); G.discardMode = false; sfx.tap(); say('কার্ড ফেলা হয়েছে। এবার দান শেষ করো।'); render(); return; }
    if (c.kind === 'element') { PREM.toast(c.bn + ' (' + c.symbol + ') · যোজনী ' + c.valency + ' · ' + THEME_LABEL[c.theme]); return; }
    if (G.pending && G.pending.hi === i) { G.pending = null; render(); return; }
    if (!needsTarget(c)) { doAction(0, i, null); return; }
    const ops = opponentsOf(0); if (ops.length === 1) { doAction(0, i, ops[0]); return; }
    G.pending = { hi: i, card: c }; sfx.tap(); render();
});
$('#opps').addEventListener('click', e => { const el = e.target.closest('[data-p]'); if (!el || !G.pending || !isHumanTurn()) return; const ti = +el.dataset.p; if (ti === 0) return; const hi = G.pending.hi; G.pending = null; doAction(0, hi, ti); });
$('#btnEnd').addEventListener('click', endTurn);
$('#btnDisc').addEventListener('click', () => { if (!isHumanTurn()) return; G.discardMode = !G.discardMode; G.pending = null; render(); });
$('#btnRules').addEventListener('click', () => { $('#sheet').innerHTML = '<span class="mtag">কীভাবে খেলবে</span><h2>যৌগ বানিয়ে সবার আগে লক্ষ্যে পৌঁছাও</h2><ul class="rules"><li><b>দান</b><span>প্রতি দানের শুরুতে ১টি কার্ড আপনি উঠবে। যতবার পারো যৌগ বানাও, অ্যাকশন খেলো, তারপর “দান শেষ”।</span></li><li><b>যৌগ</b><span>উপরের রেসিপিতে লাগা মৌলের কার্ড হাতে থাকলে রেসিপিতে ট্যাপ করো — পয়েন্ট পাবে।</span></li><li><b>💥 বিস্ফোরণ</b><span>প্রতিপক্ষের ২টি কার্ড নষ্ট; তার হাতে He (🛡) থাকলে সেটি শিল্ড হয়ে আটকায়।</span></li><li><b>⚡ তড়িৎ বিশ্লেষণ</b><span>প্রতিপক্ষের ১টি কার্ড চুরি।</span></li><li><b>💧 প্রশমন</b><span>প্রতিপক্ষের অ্যাসিড/ক্ষার যৌগ নষ্ট, নইলে −৪ পয়েন্ট।</span></li><li><b>🧪 অনুঘটক</b><span>২টি বাড়তি কার্ড।</span></li><li><b>কম্বো</b><span>HCl ও NaOH দুটোই বানালে একবার +৫।</span></li><li><b>হাতের সীমা</b><span>সর্বোচ্চ ' + bn(HAND_LIMIT) + 'টি কার্ড; বেশি হলে ফেলতে হবে।</span></li><li><b>টাইমার</b><span>চালু থাকলে সময় শেষে দান নিজে থেকে শেষ হবে।</span></li></ul><div class="row"><button class="pbtn gold" id="rClose">বুঝেছি</button></div>'; $('#modal').hidden = false; $('#rClose').onclick = () => { $('#modal').hidden = true; }; });
$('#btnNew').addEventListener('click', () => openSetup(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && G && G.pending) { G.pending = null; render(); } });
function openSetup(first) {
    PREM.setup({ tag: 'CHEM-CLASH', title: 'যৌগের লড়াই — সেটিংস', saved: CFG, cancel: !first && !!G && !G.over, intro: 'রোবটদের সাথে রসায়নের ল্যাবে লড়াই! জিতলে বিশেষ শুভেচ্ছা, আর যতবার খুশি আবার খেলতে পারবে।',
        groups: [
            { k: 'bots', label: '🤖 রোবট প্রতিপক্ষ', def: 1, opts: [[1, '১'], [2, '২'], [3, '৩']] },
            { k: 'skill', label: '🧠 রোবটের বুদ্ধি', def: 'normal', opts: [['easy', 'সহজ'], ['normal', 'মাঝারি'], ['hard', 'কঠিন']] },
            { k: 'target', label: '🎯 জিততে পয়েন্ট', def: 30, opts: [[20, '২০ (ছোট)'], [30, '৩০'], [50, '৫০ (লম্বা)']] },
            { k: 'timer', label: '⏱ দানের টাইমার', def: 0, opts: [[0, 'বন্ধ'], [30, '৩০ সে.'], [60, '৬০ সে.'], [90, '৯০ সে.']] }
        ], onStart: c => { CFG = c; PREM.store.set('chem-cfg', c); newGame(); } });
}
function newGame() {
    stopClock(); seq++; $('#modal').hidden = true;
    G = { id: seq, deck: createDeck(), rdeck: shuffle(RECIPES.concat(RECIPES)), open: [], players: [], turn: 0, over: false, pending: null, discardMode: false, msg: '', log: [], newUid: null };
    G.players.push({ name: 'তুমি', human: true, hand: [], score: 0, crafted: [], combo: false });
    for (let i = 0; i < CFG.bots; i++) G.players.push({ name: BOTN[i][0], ico: BOTN[i][1], hand: [], score: 0, crafted: [], combo: false });
    for (let i = 0; i < 3; i++) G.open.push(nextRecipe());
    G.players.forEach(p => { for (let k = 0; k < 6; k++) p.hand.push(drawCard()); });
    startTurn();
}
window.__t = { get G() { return G; }, CFG: () => CFG, newGame, synthesize, doAction, endTurn, canSyn, setCfg: c => { CFG = Object.assign(CFG, c); }, bestRecipe };
openSetup(true);
})();

</script>
