<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ionization Energy Explorer - Premium Edition</title>
    <style>
        :root { 
            --bg-color: #000000; 
            --card-color: #0b0f17;
            --text-color: #f8fafc; 
            --accent-color: #f43f5e; /* Premium Rose/Red Glow Accent */
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; }
        
        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 30px 15px; 
            margin: 0;
            min-height: 100vh;
        }
        
        .container { 
            max-width: 650px; 
            margin: 40px auto; 
            width: 100%;
        }

        .back-btn { 
            position: fixed; top: 15px; left: 15px; 
            background: #1e293b; color: #94a3b8; 
            padding: 8px 16px; border-radius: 10px; 
            text-decoration: none; font-weight: 600; font-size: 0.9rem;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease; z-index: 50; 
        }
        .back-btn:hover { background: #334155; color: #f8fafc; transform: translateX(-3px); }

        h1 {
            font-size: 1.6rem; 
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(to right, #f43f5e, #be123c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        
        .info-banner { 
            background: linear-gradient(135deg, rgba(11, 15, 23, 0.9), rgba(244, 63, 94, 0.05));
            border: 1px solid rgba(244, 63, 94, 0.2);
            padding: 16px 20px; 
            margin-bottom: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(244, 63, 94, 0.1);
            position: relative;
            overflow: hidden;
        }
        .info-banner::before {
            content: '';
            position: absolute; left: 0; top: 0; height: 100%; width: 4px;
            background: linear-gradient(to bottom, #f43f5e, #be123c);
        }
        .info-desc {
            color: #94a3b8; font-size: 0.88rem; line-height: 1.6; margin: 0;
        }
        .info-desc strong { color: #f8fafc; font-weight: 600; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            gap: 8px; 
            margin-bottom: 25px;
        }
        
        .cell { 
            aspect-ratio: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border-radius: 10px; 
            border: 1px solid var(--border-color); 
            font-weight: 850; 
            font-size: 1.05rem; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            position: relative;
        }
        
        .cell:hover, .cell.highlight { 
            transform: scale(1.15); 
            z-index: 10; 
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.7); 
            border-color: var(--accent-color) !important;
        }
        
        .empty-cell {
            grid-column: span 6;
        }
        
        .val { 
            font-size: 0.58rem; 
            font-weight: 700; 
            margin-top: 2px; 
            letter-spacing: 0.3px;
        }

        /* Search Box Placed at Bottom */
        .search-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .search-box {
            width: 100%; max-width: 350px; padding: 12px 18px;
            background: var(--card-color); border: 1px solid var(--border-color);
            color: #f8fafc; border-radius: 12px; font-size: 0.95rem; outline: none;
            transition: all 0.3s ease; text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .search-box:focus { border-color: var(--accent-color); box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }

        /* Popup Modal Style */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            z-index: 100;
        }
        .modal-overlay.active {
            opacity: 1; pointer-events: auto;
        }
        .modal-card {
            background: var(--card-color); border: 1px solid var(--accent-color);
            padding: 25px; border-radius: 20px; width: 90%; max-width: 320px;
            text-align: center; box-shadow: 0 20px 40px rgba(244, 63, 94, 0.2);
            transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }
        .modal-symbol {
            font-size: 2.5rem; font-weight: 800; color: var(--accent-color);
            margin-bottom: 5px;
        }
        .modal-name {
            font-size: 1.2rem; font-weight: 700; color: #f8fafc; margin-bottom: 15px;
        }
        .modal-radius {
            background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 10px; border-radius: 10px; font-size: 1rem; color: #fda4af;
            font-weight: 600; margin-bottom: 20px;
        }
        .close-btn {
            background: linear-gradient(135deg, #f43f5e, #be123c); color: #fff;
            border: none; padding: 8px 20px; border-radius: 8px; font-weight: 600;
            cursor: pointer; transition: opacity 0.2s;
        }
        .close-btn:hover { opacity: 0.9; }

        @media (max-width: 480px) {
            body { padding: 20px 10px; }
            h1 { font-size: 1.3rem; }
            .grid { gap: 5px; }
            .cell { font-size: 0.85rem; border-radius: 8px; }
            .val { font-size: 0.5rem; }
        }
    </style>
</head>
<body>

<a href="properties_page.html" class="back-btn">← ফিরে যান</a>

<div class="container">
    <h1>আয়নীকরণ শক্তি (Ionization Energy)</h1>
    
    <div class="info-banner">
        <p class="info-desc">
            পর্যায় সারণীতে <strong>বাম থেকে ডানে</strong> গেলে আয়নীকরণ শক্তি বৃদ্ধি পায়, আর ওপর থেকে নিচে গেলে এটি হ্রাস পায়। যেকোনো মৌলে ক্লিক করে মান ও পপ-আপ কার্ড দেখুন। (একক: kJ/mol)
        </p>
    </div>

    <div class="grid" id="grid">
        <!-- H & He statically rendered -->
        <div class="cell" data-symbol="h" onclick="showModal('হাইড্রোজেন', 'H', '1312 kJ/mol')" style="background-color: hsl(350, 80%, 26%); color: #f8fafc; border-color: rgba(244, 63, 94, 0.25);">
            H<div class="val" style="color: #fda4af;">1312</div>
        </div>
        <div class="empty-cell"></div>
        <div class="cell" data-symbol="he" onclick="showModal('হিলিয়াম', 'He', '2372 kJ/mol')" style="background-color: hsl(350, 80%, 42%); color: #ffffff; border-color: rgba(244, 63, 94, 0.45);">
            He<div class="val" style="color: #ffe4e6;">2372</div>
        </div>
        
        <script>
            const elements = [
                {s: 'Li', n: 'লিথিয়াম', v: 520}, {s: 'Be', n: 'বেরিলিয়াম', v: 899}, {s: 'B', n: 'বোরন', v: 801}, {s: 'C', n: 'কার্বন', v: 1086}, {s: 'N', n: 'নাইট্রোজেন', v: 1402}, {s: 'O', n: 'অক্সিজেন', v: 1314}, {s: 'F', n: 'ফ্লোরিন', v: 1681}, {s: 'Ne', n: 'নিয়ন', v: 2080},
                {s: 'Na', n: 'সোডিয়াম', v: 496}, {s: 'Mg', n: 'ম্যাগনেসিয়াম', v: 738}, {s: 'Al', n: 'অ্যালুমিনিয়াম', v: 578}, {s: 'Si', n: 'সিলিকন', v: 787}, {s: 'P', n: 'ফসফরাস', v: 1012}, {s: 'S', n: 'সালফার', v: 1000}, {s: 'Cl', n: 'ক্লোরিন', v: 1251}, {s: 'Ar', n: 'আর্গন', v: 1520},
                {s: 'K', n: 'পটাশিয়াম', v: 419}, {s: 'Ca', n: 'ক্যালসিয়াম', v: 590}, {s: 'Ga', n: 'গ্যালিয়াম', v: 579}, {s: 'Ge', n: 'জার্মানিয়াম', v: 762}, {s: 'As', n: 'আর্সেনিক', v: 947}, {s: 'Se', n: 'সেলেনিয়াম', v: 941}, {s: 'Br', n: 'ব্রোমিন', v: 1140}, {s: 'Kr', n: 'ক্রিপ্টন', v: 1351},
                {s: 'Rb', n: 'রুবিডিয়াম', v: 403}, {s: 'Sr', n: 'স্ট্রনশিয়াম', v: 549}, {s: 'In', n: 'ইনডিয়াম', v: 558}, {s: 'Sn', n: 'টিন', v: 709}, {s: 'Sb', n: 'অ্যান্টিমনি', v: 834}, {s: 'Te', n: 'টেলুরিয়াম', v: 869}, {s: 'I', n: 'আয়োডিন', v: 1008}, {s: 'Xe', n: 'জেনন', v: 1170}
            ];

            const grid = document.getElementById('grid');
            elements.forEach(e => {
                let lightness = 10 + (e.v / 65); 
                let textColor = lightness > 55 ? '#000000' : '#f8fafc';
                let subTextColor = lightness > 55 ? 'rgba(0,0,0,0.8)' : '#fda4af';
                
                grid.innerHTML += `
                    <div class="cell" data-symbol="${e.s.toLowerCase()}" onclick="showModal('${e.n}', '${e.s}', '${e.v} kJ/mol')" style="background-color: hsl(350, 80%, ${lightness}%); color: ${textColor}; border-color: rgba(244, 63, 94, 0.2);">
                        ${e.s}<div class="val" style="color: ${subTextColor}">${e.v}</div>
                    </div>`;
            });
        </script>
    </div>

    <!-- Search Box Placed at Bottom -->
    <div class="search-container">
        <input type="text" id="elementSearch" class="search-box" placeholder="🔍 মৌল খুঁজুন (যেমন: H, Na, Ne)..." onkeyup="filterElement()">
    </div>
</div>

<!-- Popup Modal Structure -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-symbol" id="modalSymbol">H</div>
        <div class="modal-name" id="modalName">হাইড্রোজেন</div>
        <div class="modal-radius" id="modalRadius">আয়নীকরণ শক্তি: 1312 kJ/mol</div>
        <button class="close-btn" onclick="closeModalDirect()">বন্ধ করুন</button>
    </div>
</div>

<script>
    function showModal(name, symbol, value) {
        document.getElementById('modalSymbol').innerText = symbol;
        document.getElementById('modalName').innerText = name;
        document.getElementById('modalRadius').innerText = `আয়নীকরণ শক্তি: ${value}`;
        document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal(event) {
        document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModalDirect() {
        document.getElementById('modalOverlay').classList.remove('active');
    }

    function filterElement() {
        let query = document.getElementById('elementSearch').value.toLowerCase().trim();
        let cells = document.querySelectorAll('.grid .cell');

        cells.forEach(cell => {
            let symbol = cell.getAttribute('data-symbol');
            if (query === "" || symbol.includes(query)) {
                cell.style.opacity = "1";
                if(query !== "" && symbol === query) {
                    cell.classList.add('highlight');
                } else {
                    cell.classList.remove('highlight');
                }
            } else {
                cell.style.opacity = "0.2";
                cell.classList.remove('highlight');
            }
        });
    }
</script>

</body>
</html>
