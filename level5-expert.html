    let currentSetIndex = 0;

    function renderSet() {
        let currentSet = setsData[currentSetIndex];
        
        document.getElementById('setTitleText').innerText = `সেট ${currentSetIndex + 1} / 4`;
        document.getElementById('progressText').innerText = `${(currentSetIndex + 1) * 25}% সম্পন্ন`;
        document.getElementById('progressBar').style.width = ((currentSetIndex + 1) * 25) + '%';
        
        let cardHTML = `
            <div class="card-inner-header">
                <h2>${currentSet.setTitle}</h2>
                <div class="q-count-badge">২৫ টি প্রশ্ন</div>
            </div>
        `;
        
        currentSet.questions.forEach((qObj, qIndex) => {
            cardHTML += `
                <div class="question-box">
                    <div class="board-tag">📌 ${qObj.board}</div>
                    <p class="q-text">${qObj.q}</p>
            `;
            
            qObj.options.forEach((optText, optIndex) => {
                let optLetter = ['ক', 'খ', 'গ', 'ঘ'][optIndex];
                cardHTML += `
                    <label class="option-label">
                        <input type="radio" name="q_${qIndex}" value="${optIndex}"> 
                        ${optLetter}) ${optText}
                    </label>
                `;
            });
            
            cardHTML += `</div>`;
        });

        if (currentSetIndex < setsData.length - 1) {
            cardHTML += `<button class="action-btn" onclick="evaluateSet()">সেট ${currentSet.setNum} জমা দিন</button>`;
        } else {
            cardHTML += `<button class="action-btn" onclick="evaluateSet()">মাস্টার ফাইনাল জমা দিন ও সার্টিফিকেট ক্লেইম করুন 🎓</button>`;
        }

        document.getElementById('examCard').innerHTML = cardHTML;
    }

    function evaluateSet() {
        let currentSet = setsData[currentSetIndex];
        let score = 0;

        currentSet.questions.forEach((qObj, qIndex) => {
            let selectedOpt = document.querySelector(`input[name="q_${qIndex}"]:checked`);
            if (selectedOpt && parseInt(selectedOpt.value) === qObj.correct) {
                score++;
            }
        });

        if (score >= 20) {
            if (currentSetIndex < setsData.length - 1) {
                document.getElementById('modalTitle').innerText = "চমৎকার! 🎉";
                document.getElementById('modalText').innerText = `আপনি ২৫টির মধ্যে ${score}টি সঠিক উত্তর দিয়েছেন!\nসেট ${currentSet.setNum} সফলভাবে পাস করেছেন।`;
                document.getElementById('nextBtn').innerText = "পরবর্তী সেটে যান →";
                document.getElementById('nextBtn').setAttribute('onclick', "nextSet()");
                document.getElementById('welcomeModal').style.display = 'flex';
            } else {
                // ফাইনাল সেট শেষ হওয়ার পর সার্টিফিকেট পাওয়ার বার্তা ও পরবর্তী পদক্ষেপ
                document.getElementById('modalTitle').innerText = "অভিনন্দন গ্র্যান্ড মাস্টার! 👑🎓";
                document.getElementById('modalText').innerText = `আপনি ফাইনাল সেটে ২৫টির মধ্যে ${score}টি সঠিক উত্তর দিয়ে লেভেল ৫ সফলভাবে সম্পন্ন করেছেন!\n\n✨ সার্টিফিকেট পেতে সামনে এগিয়ে যান বা নিচের লিংকে ক্লিক করুন।`;
                document.getElementById('nextBtn').innerText = "সার্টিফিকেট ক্লেইম পেজে যান 🏆";
                document.getElementById('nextBtn').setAttribute('onclick', "window.location.href='certificate_claim.html'");
                document.getElementById('welcomeModal').style.display = 'flex';
            }
        } else {
            document.getElementById('modalTitle').innerText = "সতর্কবার্তা! ⚠️";
            document.getElementById('modalText').innerText = `আপনার প্রাপ্ত স্কোর ${score}/২৫।\nপরবর্তী সেটে যাওয়ার জন্য কমপক্ষে ২০টি সঠিক উত্তর দিতে হবে!\nদয়া করে আবার চেষ্টা করুন।`;
            document.getElementById('nextBtn').innerText = "পুনরায় চেষ্টা করুন (Retry) 🔄";
            document.getElementById('nextBtn').setAttribute('onclick', "closeModal()");
            document.getElementById('welcomeModal').style.display = 'flex';
        }
    }

    function closeModal() {
        document.getElementById('welcomeModal').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function nextSet() {
        document.getElementById('welcomeModal').style.display = 'none';
        currentSetIndex++;
        renderSet();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = renderSet;
</script>
