    <style>
/* ===== NB KIT: sticker / neo-brutalist দৃশ্যরূপ =====
   প্রতিটি গেম নিজের :root-এ এই টোকেনগুলো বদলে নিজস্ব রং পায়:
   --o1 --o2 --o3 (বাইরের ব্যাকগ্রাউন্ড), --paper (বোর্ড), --paper2, --ink, --a1 --a2 --a3 (অ্যাকসেন্ট)  */
:root {
    color-scheme: light;
    --o1: #ff6b4a; --o2: #ffd23f; --o3: #5ad1c4;
    --paper: #fff8ec; --paper2: #ffffff; --ink: #1d1030; --mute: #6a5f80;
    --a1: #ff6b4a; --a2: #2ec4b6; --a3: #ffd23f; --good: #12a36b; --bad: #e5384d;
    --bw: 3px; --rad: 16px; --sh: 5px;
    --display: 'Bricolage Grotesque','Hind Siliguri',system-ui,sans-serif;
    --body: 'Hind Siliguri','Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
    --pat: radial-gradient(rgba(29,16,48,.20) 1.4px, transparent 1.6px);
    --pat-size: 22px 22px;
}
:root[data-bg="2"] { --o1: #2ec4b6; --o2: #c9f2ee; --o3: #ff6b4a; }
:root[data-bg="3"] { --o1: #a78bfa; --o2: #ffd6f0; --o3: #ffd23f; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--body); font-weight: 500; line-height: 1.55;
    padding: 18px max(14px, env(safe-area-inset-right, 0px)) 30px max(14px, env(safe-area-inset-left, 0px));
    background-color: var(--o1);
    background-image: var(--pat), radial-gradient(circle at 12% 6%, var(--o2) 0, transparent 46%), radial-gradient(circle at 94% 96%, var(--o3) 0, transparent 50%);
    background-size: var(--pat-size), 100% 100%, 100% 100%;
    background-attachment: fixed; transition: background-color .4s; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

.stage { max-width: 860px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 24px; box-shadow: 9px 9px 0 var(--ink); }
.credit { width: fit-content; max-width: 100%; margin: 18px auto 0; padding: 6px 14px; text-align: center; font-size: 12.5px; font-weight: 700; letter-spacing: .3px; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--ink); }

/* উপরের বার */
.top { display: flex; align-items: center; gap: 10px; }
.titlebox { margin-right: auto; min-width: 0; }
.titlebox b { display: inline-block; padding: 3px 12px; font: 800 clamp(1.05rem, 3.6vw, 1.35rem)/1.3 var(--display); color: var(--ink); background: var(--a3); border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-1.2deg); }
.titlebox small { display: block; margin: 5px 0 0 4px; font-size: 12px; font-weight: 700; color: var(--mute); }
.btn, .back-btn, .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 14px;
    font: 800 14px/1 var(--body); text-decoration: none; cursor: pointer; color: var(--ink); background: var(--paper2);
    border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s, background .12s;
}
.btn:hover:not(:disabled), .back-btn:hover, .icon-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:active:not(:disabled), .back-btn:active, .icon-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: 2px 2px 0 var(--ink); }
.btn.primary { background: var(--a1); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
.btn.alt { background: var(--a2); }
.btn.big { min-height: 54px; padding: 0 26px; font-size: 17px; border-radius: 14px; }
.icon-btn { width: 42px; padding: 0; font-size: 17px; }

/* পিল, ক্যাপসুল, কার্ড */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; font-size: 13px; font-weight: 800; color: var(--ink); background: var(--paper2); border: 2.5px solid var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--ink); }
.pill b { font-variant-numeric: tabular-nums; }
.box { padding: 14px; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: var(--rad); box-shadow: 5px 5px 0 var(--ink); }
.sticker { display: inline-block; padding: 3px 11px; font-size: 12px; font-weight: 800; color: var(--ink); background: var(--a3); border: 2.5px solid var(--ink); border-radius: 8px; transform: rotate(-2deg); }
.meter { height: 16px; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 100%; background: var(--a1); border-right: 2.5px solid var(--ink); transition: width .25s ease; }
.hazard { height: 12px; border: 2.5px solid var(--ink); border-radius: 6px; background: repeating-linear-gradient(-45deg, var(--a3) 0 10px, var(--ink) 10px 20px); }

/* মডাল */
.modal { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; padding: 16px; background: rgba(29,16,48,.58); }
.sheet { width: min(500px, 100%); max-height: 92%; overflow: auto; padding: 22px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 22px; box-shadow: 9px 9px 0 var(--ink); }
.sheet h2 { margin: 6px 0 10px; font: 800 22px/1.35 var(--display); }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 18px); transform: translateX(-50%); z-index: 3500; padding: 8px 16px; font-size: 15px; font-weight: 800; color: var(--ink); background: var(--a3); border: var(--bw) solid var(--ink); border-radius: 99px; box-shadow: 4px 4px 0 var(--ink); opacity: 0; pointer-events: none; }
.toast.on { animation: nbtoast 1.7s ease forwards; }
@keyframes nbtoast { 0% { opacity: 0; transform: translate(-50%, -10px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@keyframes nbshake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes nbpop { from { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }

.sheet { position: relative; text-align: center; padding-top: 0; background: #fffdf3; }
.sheet::before { content: "LAB LABEL · EQUILIBRIUM"; display: block; margin: 0 -22px 14px; padding: 7px 14px; font: 800 12px/1.2 var(--display); letter-spacing: 1.5px; color: #fff; background: var(--a1); border-bottom: var(--bw) solid var(--ink); border-radius: 18px 18px 0 0; }
.stars { font-size: 38px; letter-spacing: 6px; color: #ffb800; -webkit-text-stroke: 1.5px var(--ink); text-shadow: 3px 3px 0 var(--ink); }

@media (max-width: 560px) { .lab { grid-template-columns: 1fr; } .vessel { flex-direction: row; justify-content: center; gap: 14px; min-height: 0; } .panel { grid-template-columns: 1fr; } }
    </style>

    <script>
/* ===== NB SOUND: শূন্য-নির্ভরতার WebAudio সাউন্ড ইফেক্ট =====
   ব্যবহার: const sfx = NBSound('গেমের-কী'); sfx.ok(); sfx.bad(); sfx.win(); sfx.lose(); sfx.tap(); sfx.pop();
   বাটন: #soundBtn থাকলে সেটি নিজে নিজে 🔔/🔕 টগল করে (localStorage '<কী>-sound') */
function NBSound(key) {
    let on = true, ac = null;
    try { on = localStorage.getItem(key + '-sound') !== '0'; } catch (e) {}
    function tone(f, t0, dur, type, vol) {
        if (!on) return;
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
            const t = ac.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .03);
        } catch (e) {}
    }
    const api = {
        ok() { tone(660, 0, .12); tone(880, .1, .16); },
        bad() { tone(220, 0, .2, 'sawtooth', .1); tone(160, .14, .26, 'sawtooth', .1); },
        tap() { tone(520, 0, .06, 'triangle', .1); },
        pop() { tone(440, 0, .08, 'square', .06); tone(740, .06, .1, 'square', .06); },
        win() { tone(523, 0, .12); tone(659, .12, .12); tone(784, .24, .12); tone(1047, .36, .3); },
        lose() { tone(392, 0, .2); tone(330, .2, .2); tone(262, .4, .4); },
        get on() { return on; },
        toggle() { on = !on; try { localStorage.setItem(key + '-sound', on ? '1' : '0'); } catch (e) {} paint(); if (on) api.ok(); }
    };
    function paint() { const b = document.getElementById('soundBtn'); if (b) b.textContent = on ? '🔔' : '🔕'; }
    document.addEventListener('DOMContentLoaded', () => { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } });
    if (document.readyState !== 'loading') { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } }
    return api;
}

    (function () {
        'use strict';
        let sfx;
        try { sfx = NBSound('equil'); } catch (e) { sfx = { ok() {}, bad() {}, tap() {}, pop() {}, win() {}, lose() {}, toggle() {} }; }
        const $ = s => document.querySelector(s);
        const bn = n => Number(n).toLocaleString('bn-BD', { useGrouping: false });
        const f1 = n => Number(n).toLocaleString('bn-BD', { useGrouping: false, maximumFractionDigits: 1 });
        const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
        $('#bgBtn').addEventListener('click', () => {
            const cur = document.documentElement.getAttribute('data-bg') || '1';
            const next = cur === '1' ? '2' : cur === '2' ? '3' : '1';
            if (next === '1') document.documentElement.removeAttribute('data-bg'); else document.documentElement.setAttribute('data-bg', next);
            lsSet('equil-bg', next); sfx.tap();
        });

        const R = 8.314;
        /* সাম্য সমাধান: ln Q(ξ) = ln K, ξ-তে মনোটোনিক ⇒ বাইসেকশন। গ্যাসের সক্রিয়তা = মোল-ভগ্নাংশ × P, তরলের = মোল-ভগ্নাংশ */
        function solve(rx, o) {

            else if (k === 'b') why = up ? 'বিক্রিয়ক বাড়ালে সিস্টেম তা খরচ করতে চায় → ডানে।' : 'বিক্রিয়ক কমালে সাম্য বামে ফিরে।';
            else if (k === 'rem') why = up ? 'উৎপাদ (পানি) সরালে সিস্টেম তা পূরণ করতে চায় → ডানে।' : 'পানি কম সরালে সাম্য আগের দিকে ফিরে।';
            else if (k === 'cat') why = 'ক্যাটালিস্ট দুই দিকের গতি সমান বাড়ায় — সাম্য বদলায় না, শুধু দ্রুত পৌঁছায়। গতি এখন ' + f1(after.rate) + '।';
            $('#shift').innerHTML = arrow + (dir ? ' · ফলন ' + (after.r.y >= before.r.y ? '+' : '') + f1(after.r.y - before.r.y) + '%' : '') + '<br>' + why;
        }
        function changed(k, val, isToggle) {
            const before = S.prev; const old = S.o[k]; if (old === val) return;
            S.o[k] = val; S.moves++; const after = render(); S.prev = after; explain(k, val > old, before, after); sfx.tap();
        }

        function finish() {
            S.done = true; sfx.win();
            const L = LV(), score = S.moves + 3 * (2 - S.hints), st = score <= L.par ? 3 : score <= L.par * 2 ? 2 : 1;
            if (!stars[S.lv] || st > stars[S.lv]) { stars[S.lv] = st; lsSet('equil-stars', JSON.stringify(stars)); }
            renderTabs(); render();
            const last = S.lv === LEVELS.length - 1;
            $('#sheet').innerHTML = '<div class="stars">' + starStr(st) + '</div><h2>' + L.icon + ' ' + L.name + ' — সফল!</h2><p>পরিবর্তন: <b>' + bn(S.moves) + '</b> · ইঙ্গিত: <b>' + bn(2 - S.hints) + '</b></p><div class="learn">🧠 ' + L.learn + '</div><div class="row">' +
                (last ? '' : '<button class="btn primary big" data-act="next">পরের লেভেল ▶</button>') + '<button class="btn" data-act="again">↺ আবার</button><button class="btn" data-act="close">বন্ধ করো</button></div>';
            $('#modal').hidden = false;
        }

        document.addEventListener('input', e => {
            const r = e.target.closest && e.target.closest('input[data-k]'); if (!r || S.done) return;
            const k = r.dataset.k, v = +r.value; const out = $('#o_' + k); const kn = LV().knobs.find(x => x.k === k); if (out) out.textContent = f1(v) + kn.u;
        });
        document.addEventListener('change', e => {
            const r = e.target.closest && e.target.closest('input[data-k]'); if (!r || S.done) return;
            changed(r.dataset.k, +r.value);
        });
        document.addEventListener('click', e => {
            const t = e.target.closest('[data-lv],[data-tog],[data-act],#btnHint,#btnReset,#btnRules,#btnDone'); if (!t) return;
            if (t.dataset.lv != null) { sfx.tap(); startLevel(+t.dataset.lv); return; }
            if (t.dataset.tog) { if (!S.done) changed(t.dataset.tog, S.o[t.dataset.tog] ? 0 : 1); return; }
            if (t.id === 'btnDone') { if (!t.disabled) finish(); return; }
            if (t.id === 'btnReset') { sfx.tap(); startLevel(S.lv); return; }
            if (t.id === 'btnHint') { if (S.hints > 0 && !S.done) { S.hints--; sfx.pop(); $('#shift').innerHTML = '💡 ' + LV().hint; render(); } return; }
            if (t.id === 'btnRules') {
                $('#sheet').innerHTML = '<h2>📖 নিয়ম</h2><ul><li>স্লাইডার/বাটন দিয়ে তাপ, চাপ, ক্যাটালিস্ট বা বিক্রিয়ক বদলাও।</li><li>প্রতিবার সাম্য কোনদিকে সরল তার কারণ নিচে দেখাবে (Le Chatelier)।</li><li>সব লক্ষ্য ✔ হলে <b>পরীক্ষা সম্পন্ন</b> চাপো।</li><li>কম পরিবর্তন ও কম ইঙ্গিতে বেশি তারা।</li></ul><div class="row"><button class="btn primary" data-act="close">বুঝেছি</button></div>';
                $('#modal').hidden = false; return;
            }
            if (t.dataset.act === 'close') { $('#modal').hidden = true; return; }
            if (t.dataset.act === 'again') { $('#modal').hidden = true; startLevel(S.lv); return; }
            if (t.dataset.act === 'next') { $('#modal').hidden = true; startLevel(Math.min(S.lv + 1, LEVELS.length - 1)); return; }
        });
        window.__t = { S, LEVELS, solve, rate, evalAll, startLevel, changed, goalOk, finish };
        startLevel(0);
    })();
    </script>
</body>
