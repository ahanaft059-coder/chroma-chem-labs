<style>
:root{--o-bg:#050507;--o-bg2:#0d0d14;--o-tx:#9a9aae;--st:#101118;--st2:#171925;--st3:#1f2231;--ln:rgba(255,255,255,.09);--ln2:rgba(255,255,255,.16);--tx:#f3f1ea;--mut:#9b9cb0;--gold:#f6c453;--gold2:#ff9f43;--ok:#4ade80;--bad:#ff5d6c;--blue:#5db4ff;--f0:#ff6b6b;--f1:#ffb84d;--f2:#4ade9a;--f3:#6aa8ff;--r:18px;--disp:'Hind Siliguri','Plus Jakarta Sans',system-ui,sans-serif}
:root[data-bg="2"]{--o-bg:#fff1a8;--o-bg2:#ffe680;--o-tx:#5b4b00}
:root[data-bg="3"]{--o-bg:#cde7ff;--o-bg2:#a9d4ff;--o-tx:#1d3b5c}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--o-bg)}
body{margin:0;min-height:100vh;font-family:var(--disp);color:var(--tx);background:radial-gradient(1200px 700px at 50% -10%,var(--o-bg2),var(--o-bg) 70%) fixed,var(--o-bg);padding:14px max(14px,env(safe-area-inset-right)) 30px max(14px,env(safe-area-inset-left));transition:background .4s}
:root[data-bg] body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(0,0,0,.09) 1.4px,transparent 1.6px);background-size:22px 22px;opacity:.6}
.stage{position:relative;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:14px;background:linear-gradient(180deg,var(--st2),var(--st) 40%);border:1px solid var(--ln2);border-radius:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.65),0 0 0 6px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.07)}
.credit{text-align:center;margin:16px 0 0;font-size:12.5px;font-weight:600;letter-spacing:.3px;color:var(--o-tx)}
.bar{display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:20px;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:12px;color:var(--mut);font-weight:500}
.pbtn{font:600 14px var(--disp);color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--ln2);border-radius:12px;padding:9px 14px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .12s,background .15s,border-color .15s}
.pbtn:hover:not(:disabled){background:rgba(255,255,255,.12);transform:translateY(-1px)}
.pbtn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.pbtn:disabled{opacity:.4;cursor:default}
.pbtn.gold{color:#241a00;border-color:transparent;background:linear-gradient(135deg,#ffe08a,var(--gold) 45%,var(--gold2));box-shadow:0 6px 18px -6px rgba(246,196,83,.55)}
.pbtn.gold:hover:not(:disabled){background:linear-gradient(135deg,#fff0b8,#ffd466 45%,#ffad5a)}
.pbtn.ico{width:42px;padding:0;font-size:18px}
.pbtn.big{font-size:17px;padding:13px 22px;border-radius:14px}
.pbtn .long{display:inline}
@media(max-width:520px){.pbtn .long{display:none}.brand b{font-size:17px}}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:999px;padding:6px 12px}
.pill b{font-variant-numeric:tabular-nums;color:var(--gold)}
.pill.warn{border-color:var(--bad);color:#ffd0d4}.pill.warn b{color:var(--bad)}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:rgba(255,255,255,.035);border:1px solid var(--ln);border-radius:var(--r);padding:12px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,3,8,.72);backdrop-filter:blur(7px);overflow:auto}
.modal[hidden]{display:none}
.sheet{position:relative;width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#1d2030,#13141d);border:1px solid var(--ln2);border-radius:22px;padding:22px 20px 18px;box-shadow:0 30px 80px -10px #000;animation:sh .28s cubic-bezier(.2,.9,.3,1.2)}
.sheet::before{content:"";position:absolute;left:22px;right:22px;top:0;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
@keyframes sh{from{transform:translateY(18px) scale(.96);opacity:0}}
.sheet h2{margin:2px 0 8px;font-size:23px;line-height:1.25}
.sheet p{margin:0 0 12px;color:var(--mut);line-height:1.65;font-size:14.5px}
.sheet .mtag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--gold);background:rgba(246,196,83,.1);border:1px solid rgba(246,196,83,.3);border-radius:999px;padding:3px 11px;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.grp{margin:12px 0}
.grp>label{display:block;font-weight:700;font-size:13.5px;color:var(--mut);margin-bottom:7px}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{font:600 14px var(--disp);color:var(--tx);background:rgba(255,255,255,.05);border:1px solid var(--ln2);border-radius:11px;padding:8px 14px;cursor:pointer;min-width:46px;transition:.15s}
.seg button:hover{background:rgba(255,255,255,.1)}
.seg button[aria-pressed="true"]{color:#241a00;background:linear-gradient(135deg,#ffe08a,var(--gold));border-color:transparent;box-shadow:0 4px 14px -4px rgba(246,196,83,.6)}
.seg button:disabled{opacity:.35;cursor:default}
.note{font-size:12.5px;color:var(--mut);margin-top:6px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;line-height:1.55}
.rules li b{color:var(--gold);white-space:nowrap}
.rules li span{color:#d8d8e4}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;z-index:70;background:#1b1d2b;border:1px solid var(--gold);color:var(--tx);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{animation:tst 2.2s ease both}
@keyframes tst{0%{opacity:0;transform:translate(-50%,30px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
.shake{animation:shk .38s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}

@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}

.wish .big{font-size:16.5px;color:#f3f1ea;line-height:1.7;font-weight:500}
.wish .stat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px}
.rank{display:grid;gap:6px;margin:10px 0}

.rank div.me{background:rgba(246,196,83,.14);border:1px solid rgba(246,196,83,.4)}
.rank div b{color:var(--gold)}
/* ===== JOSS LAYER: premium shine ===== */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.stage{isolation:isolate;background:radial-gradient(520px 260px at 8% -4%,rgba(246,196,83,.16),transparent 70%),radial-gradient(520px 300px at 100% 105%,rgba(143,110,255,.16),transparent 70%),radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px) 0 0/18px 18px,linear-gradient(180deg,var(--st2),var(--st) 42%)}
.stage::before,.stage::after{content:"";position:absolute;inset:-2px;border-radius:28px;padding:2px;pointer-events:none;background:conic-gradient(from var(--a),#f6c453,#ff7a59,#c792ff,#4ad8c8,#f6c453);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;animation:spinA 7s linear infinite;opacity:.9}
.stage::after{inset:-7px;padding:7px;filter:blur(13px);opacity:.38}
@keyframes spinA{to{--a:360deg}}
.brand b{background:linear-gradient(100deg,#ffe9a3,var(--gold),#ff9f43,#ffe9a3);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;animation:shim 5s linear infinite;letter-spacing:.2px}
@keyframes shim{to{background-position:-240% 0}}
.pbtn{position:relative;overflow:hidden;backdrop-filter:blur(4px)}
.pbtn.gold::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:gl 3.4s ease-in-out infinite}
@keyframes gl{0%,55%{left:-70%}100%{left:130%}}
.pbtn.gold{box-shadow:0 8px 22px -8px rgba(246,196,83,.75),inset 0 1px 0 rgba(255,255,255,.55)}
.pbtn.ico#langBtn{font-size:13px;font-weight:800;letter-spacing:.2px;width:46px}
.pill{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

.sheet h2{letter-spacing:.1px}
.seg button[aria-pressed="true"]{box-shadow:0 6px 16px -4px rgba(246,196,83,.7),inset 0 1px 0 rgba(255,255,255,.6)}
.toast{box-shadow:0 10px 30px -8px rgba(246,196,83,.5);background:linear-gradient(180deg,#232638,#171925)}
.wish{position:relative;isolation:isolate}
.wish::before{content:"";position:absolute;left:50%;top:-34px;width:360px;height:360px;margin-left:-180px;z-index:-1;background:repeating-conic-gradient(from 0deg,rgba(246,196,83,.22) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 66%);mask:radial-gradient(circle,#000 8%,transparent 66%);animation:ray 18s linear infinite}
@keyframes ray{to{transform:rotate(360deg)}}
.wish .tro{font-size:86px}
.rank div{background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.03))}
.rank div.me{box-shadow:0 0 0 1px rgba(246,196,83,.25),0 8px 22px -10px rgba(246,196,83,.6)}
:root[data-bg="2"] .credit,:root[data-bg="3"] .credit{text-shadow:none}
@media(max-width:520px){.pbtn.ico#langBtn{width:42px}.bar{gap:7px}}
@media(prefers-reduced-motion:reduce){.stage::before,.stage::after,.brand b,.pbtn.gold::after,.wish::before,.wish .tro{animation:none}}


.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.gbar .sp{flex:1}
.arena{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
.boardwrap{display:grid;gap:10px;justify-items:center}
.board{position:relative;width:min(100%,540px);aspect-ratio:1;border-radius:20px;background:#0a0b11;border:1px solid var(--ln2);padding:2.2%;box-shadow:inset 0 0 40px rgba(0,0,0,.6);touch-action:none}
.grid{position:absolute;inset:2.2%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:2.6%}
.grid i{background:rgba(255,255,255,.045);border-radius:12px}
.tiles{position:absolute;inset:2.2%}
.tile{position:absolute;width:25%;height:25%;left:calc(var(--c)*25%);top:calc(var(--r)*25%);padding:1.3%;transition:left .13s ease,top .13s ease}
.tile .face{width:100%;height:100%;border-radius:12px;display:grid;place-items:center;position:relative;color:#fff;background:linear-gradient(155deg,var(--c1),var(--c2));border:1.5px solid rgba(255,255,255,.4);box-shadow:0 6px 14px -6px #000,inset 0 1px 0 rgba(255,255,255,.4);overflow:hidden}
.tile .face::before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.25),transparent 45%)}
.tile.f0{--c1:#ff7f7f;--c2:#b0213b}.tile.f1{--c1:#ffc860;--c2:#b8600b}.tile.f2{--c1:#52e8a6;--c2:#0b7556}.tile.f3{--c1:#7ab9ff;--c2:#2a46c8}
.tile .z{position:absolute;left:8%;top:5%;font-size:clamp(9px,2.3vw,13px);font-weight:700;opacity:.9}
.tile .sym{font-size:clamp(20px,7vw,40px);font-weight:800;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.tile .nm{position:absolute;bottom:5%;left:0;right:0;text-align:center;font-size:clamp(8px,1.9vw,11px);font-weight:600;opacity:.92}
.tile .pw{position:absolute;right:8%;top:5%;font-size:clamp(8px,2vw,11px);font-weight:700;opacity:.75}
.tile.hi .face{box-shadow:0 0 22px rgba(246,196,83,.75),inset 0 1px 0 rgba(255,255,255,.5);border-color:#ffe08a}
.face.pop{animation:pop .2s ease}.face.merge{animation:mrg .24s ease}
@keyframes pop{from{transform:scale(.3);opacity:0}}@keyframes mrg{50%{transform:scale(1.18)}}
.prog{width:min(100%,540px);height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
.goalrow{width:min(100%,540px);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--mut)}
.goalrow b{color:var(--gold)}
.ladder{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;width:min(100%,540px)}
.step{font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;color:#fff;border:1px solid rgba(255,255,255,.3)}
.step.q{background:rgba(255,255,255,.05);color:var(--mut);border-color:var(--ln)}
.step.f0{background:#b0213b}.step.f1{background:#b8600b}.step.f2{background:#0b7556}.step.f3{background:#2a46c8}
.step.goal-step{outline:2px solid var(--gold);outline-offset:1px}
.lab{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px dashed var(--ln2);font-size:13.5px;line-height:1.5;width:min(100%,540px)}
.lsym{flex:none;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff}
.lab .meta{display:block;color:var(--mut);font-size:12.5px}.lab .eq{display:block;color:var(--gold);font-weight:600}
.bots{display:grid;gap:10px}
.rb{padding:10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--ln);display:grid;gap:7px}
.rb.dead{opacity:.55}.rb.lead{border-color:var(--gold);box-shadow:0 0 18px -6px rgba(246,196,83,.6)}
.rb h4{margin:0;display:flex;justify-content:space-between;gap:8px;font-size:13.5px;align-items:center}.rb h4 b{color:var(--gold);font-variant-numeric:tabular-nums}
.mb{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;aspect-ratio:1;background:#0a0b11;padding:4px;border-radius:10px;width:100%;max-width:170px;margin:0 auto}
.mb i{border-radius:5px;background:rgba(255,255,255,.05);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#fff;line-height:1}
.mb i.f0{background:linear-gradient(155deg,#ff7f7f,#b0213b)}.mb i.f1{background:linear-gradient(155deg,#ffc860,#b8600b)}.mb i.f2{background:linear-gradient(155deg,#52e8a6,#0b7556)}.mb i.f3{background:linear-gradient(155deg,#7ab9ff,#2a46c8)}
.rb small{color:var(--mut);font-size:12px;text-align:center}
.nobots{padding:16px;border-radius:14px;border:1px dashed var(--ln2);color:var(--mut);font-size:13.5px;line-height:1.6;text-align:center}
.bigsym{width:84px;height:84px;margin:6px auto 10px;border-radius:20px;display:grid;place-items:center;font-size:38px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.4)}
@media(max-width:780px){.arena{grid-template-columns:1fr}.bots{grid-template-columns:repeat(3,1fr);gap:7px}.rb{padding:7px}.rb h4{font-size:12px;flex-direction:column;align-items:flex-start;gap:1px}.mb i{font-size:8px}}
@media(max-width:420px){.rb h4 span{font-size:11px}}

</style>
</head>

<script>
/* ===== NB SOUND: শূন্য-নির্ভরতার WebAudio সাউন্ড ইফেক্ট =====
   ব্যবহার: const sfx = NBSound('গেমের-কী'); sfx.ok(); sfx.bad(); sfx.win(); sfx.lose(); sfx.tap(); sfx.pop();
   বাটন: #soundBtn থাকলে সেটি নিজে নিজে 🔔/🔕 টগল করে (localStorage '<কী>-sound') */
function NBSound(key) {
    let on = true, ac = null;
    try { on = localStorage.getItem(key + '-sound') !== '0'; } catch (e) {}
    function tone(f, t0, dur, type, vol) {
        if (!on) return;
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
            const t = ac.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .03);
        } catch (e) {}
    }

    const sub = why === 'goal' ? 'লক্ষ্যের রেসে রোবট জিতেছে। তুমি তৈরি করেছ সর্বোচ্চ ' + EL[G.maxlv].sym + '।' : (CFG.bots ? 'পয়েন্টে তুমি ' + bn(rk.findIndex(r => r.me) + 1) + ' নম্বরে।' : 'ফিউশন এখানেই থামল। চাইলে পূর্বাবস্থায় ফিরে আরেকবার চেষ্টা করো, নয়তো নতুন খেলা।');
    $('#sheet').innerHTML = '<span class="mtag">' + (why === 'goal' ? '🤖 রোবট জিতেছে' : 'খেলা শেষ') + '</span><h2>' + title + '</h2><p>' + sub + '</p><div class="rank">' + rows.map(r => '<div class="' + (r[2] ? 'me' : '') + '"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join('') + '</div><div class="row">' + (why === 'stuck' && G.undos > 0 && G.hist.length ? '<button class="pbtn" id="undoB">↶ পূর্বাবস্থা (' + bn(G.undos) + ')</button>' : '') + '<button class="pbtn gold big" id="again">▶ আবার খেলো</button><button class="pbtn" id="setupB">⚙ সেটিংস</button></div>';
    $('#modal').hidden = false; $('#again').onclick = newGame; $('#setupB').onclick = () => openSetup(false);
    if ($('#undoB')) $('#undoB').onclick = () => { $('#modal').hidden = true; G.over = false; undo(); startBots(); startClock(); };
}

/* ---------- HUD ---------- */
function discover(lv) { showEl(lv); if (!found[lv]) { found[lv] = true; save(); renderLadder(); PREM.toast('নতুন মৌল আবিষ্কার: ' + EL[lv].sym + ' · ' + EL[lv].bn); } }
function showEl(lv) {
    const e = EL[lv], p = EL[lv - 1];
    $('#lab').innerHTML = '<span class="lsym" style="background:' + FAMCOL[e.fam] + '">' + e.sym + '</span><div><b>' + e.bn + '</b><span class="meta">' + e.en + ' · Z ' + e.z + ' · ' + FAM[e.fam] + '</span>' + (lv > 1 ? '<span class="eq">' + p.sym + ' + ' + p.sym + ' → ' + e.sym + '</span>' : '') + '<span>' + e.fact + '</span></div>';
}
function renderLadder() {
    let n = 0, h = ''; for (let lv = 1; lv <= MAXLV; lv++) { const e = EL[lv], has = !!found[lv]; if (has) n++; h += '<span class="step ' + (has ? 'f' + e.fam : 'q') + (lv === goalLv() ? ' goal-step' : '') + '" title="' + (has ? e.bn : 'এখনো আবিষ্কার হয়নি') + '">' + (has ? e.sym : '?') + '</span>'; }
    $('#ladder').innerHTML = h; $('#found').textContent = bn(n) + '/' + bn(MAXLV) + ' আবিষ্কৃত';
}
function updateHUD() {
    $('#score').textContent = bn(G.score); $('#best').textContent = bn(best);
    const g = goalLv(); $('#goalSym').textContent = g ? EL[g].sym : '∞';
    $('#goalTxt').innerHTML = g ? 'লক্ষ্য: <b>' + EL[g].bn + ' (' + EL[g].sym + ')</b> সবার আগে তৈরি করো' : '<b>অন্তহীন মোড</b> — সবচেয়ে বেশি পয়েন্ট জেতে';
    $('#prog').style.width = g ? Math.min(100, Math.round(G.maxlv / g * 100)) + '%' : Math.min(100, Math.round(G.maxlv / MAXLV * 100)) + '%';
    const u = $('#btnUndo'); u.textContent = '↶ ' + bn(G.undos); u.disabled = !(G.hist.length && G.undos > 0 && !G.over);
    renderLadder(); renderBots();
}
function startClock() {
    if (clock) { clock.stop(); clock = null; } if (!CFG.timer || !G || G.over) { $('#pTimer').hidden = true; return; }
    $('#pTimer').hidden = false;
    clock = PREM.countdown(G.left != null ? G.left : CFG.timer, s => { G.left = s; $('#tmv').textContent = PREM.mmss(Math.max(0, s)); $('#pTimer').className = 'pill' + (s <= 15 ? ' warn' : ''); }, () => { if (G && !G.over) finish(null, 'time'); });
}
/* ---------- সেটআপ ও নতুন খেলা ---------- */
function openSetup(first) {
    PREM.setup({
        tag: 'Fusion 2048', title: 'তারার ফিউশন — সেটিংস', saved: CFG, cancel: !first && !!G && !G.over,
        intro: 'তীরচিহ্ন বা সোয়াইপ দিয়ে একই মৌল মিলিয়ে পরের মৌল বানাও। রোবটরা নিজের বোর্ডে একই সময়ে খেলবে — কে আগে লক্ষ্যে পৌঁছায়?',
        groups: [
            { k: 'bots', label: '🤖 রোবট প্রতিপক্ষ', def: 2, opts: [[0, '০ (একা)'], [1, '১'], [2, '২'], [3, '৩']] },
            { k: 'skill', label: '🧠 রোবটের বুদ্ধি', def: 'normal', opts: [['easy', 'সহজ'], ['normal', 'মাঝারি'], ['hard', 'কঠিন']] },
            { k: 'goal', label: '🎯 লক্ষ্য মৌল', def: 'ti', opts: [['ar', 'Ar (সহজ)'], ['ti', 'Ti (মাঝারি)'], ['fe', 'Fe (কঠিন)'], ['none', '∞ অন্তহীন']], note: c => c.goal === 'none' ? 'শেষ হবে সময়ে বা চাল ফুরোলে — যার পয়েন্ট বেশি সে জিতবে।' : 'যে আগে পৌঁছাবে সে জিতবে। একা খেললে জিতেও খেলা চালিয়ে যেতে পারো।' },
            { k: 'timer', label: '⏱ সময়সীমা', def: 0, opts: [[0, 'বন্ধ'], [180, '৩ মিনিট'], [300, '৫ মিনিট'], [600, '১০ মিনিট']], note: 'সময় শেষে পয়েন্টে এগিয়ে থাকলে জয়।' }
        ],
        onStart: c => { CFG = c; PREM.store.set('fusion-cfg', c); newGame(); }
    });
}
function newGame() {
    stopAll(); $('#modal').hidden = true; tilesEl.innerHTML = '';
    G = { cells: new Array(16).fill(null), score: 0, hist: [], undos: 3, won: false, over: false, stuck: false, maxlv: 1, left: null, bots: [] };
    for (let i = 0; i < CFG.bots; i++) { const b = new Array(16).fill(0); const e = []; while (e.length < 2) { const k = Math.floor(Math.random() * 16); if (e.indexOf(k) < 0) e.push(k); } e.forEach(k => { b[k] = spawnLv(); }); G.bots.push({ name: BOTN[i][0], ico: BOTN[i][1], b: b, score: 0, max: 2, dead: false }); }
    spawnH(); spawnH(); found[1] = true; save(); showEl(1); updateHUD(); startBots(); startClock();
}
/* ---------- ইনপুট ---------- */
const KEYS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3 };
document.addEventListener('keydown', e => { if (!$('#modal').hidden || e.ctrlKey || e.metaKey || e.altKey) return; if (Object.prototype.hasOwnProperty.call(KEYS, e.key)) { e.preventDefault(); move(KEYS[e.key]); } });
let sx = 0, sy = 0, sid = null; const board = $('#board');
board.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; sid = e.pointerId; });
window.addEventListener('pointerup', e => { if (sid === null) return; sid = null; if (!$('#modal').hidden) return; const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 3); else move(dy > 0 ? 2 : 0); });
window.addEventListener('pointercancel', () => { sid = null; });
$('#btnUndo').addEventListener('click', undo);
$('#btnRules').addEventListener('click', () => { $('#sheet').innerHTML = '<span class="mtag">কীভাবে খেলবে</span><h2>তারার মতো মৌল জুড়ে রোবটদের হারাও</h2><ul class="rules"><li><b>চালনা</b><span>তীরচিহ্ন / W A S D / বোর্ডে সোয়াইপ।</span></li><li><b>মেলানো</b><span>একই দুটি মৌল ধাক্কা খেলে পরের মৌল হয় (H+H→He)।</span></li><li><b>সিঁড়ি</b><span>H → He → C → O → Ne → Mg → Si → S → Ar → Ca → Ti → Cr → Fe</span></li><li><b>রেস</b><span>রোবটরা নিজের বোর্ডে একই সময়ে খেলে; যে আগে লক্ষ্য মৌল বানায় সে জেতে।</span></li><li><b>টাইমার</b><span>চালু থাকলে সময় শেষে বেশি পয়েন্টধারী জেতে।</span></li><li><b>অন্তহীন</b><span>লক্ষ্য নেই — আটকে না যাওয়া পর্যন্ত খেলো।</span></li><li><b>পূর্বাবস্থা</b><span>প্রতি খেলায় ৩ বার চাল ফেরাতে পারবে।</span></li></ul><div class="row"><button class="pbtn gold" id="rClose">বুঝেছি</button></div>'; $('#modal').hidden = false; $('#rClose').onclick = () => { $('#modal').hidden = true; }; });
$('#btnNew').addEventListener('click', () => openSetup(false));
window.__t = { get G() { return G; }, move, CFG: () => CFG, newGame, setCfg: c => { CFG = Object.assign(CFG, c); }, botMove, simMove, MAXLV: MAXLV };
openSetup(true);
})();

</script>
</body>
