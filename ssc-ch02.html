  B(2,'স্ফুটনাংক কিসের উপর নির্ভরশীল?','আন্তঃআণবিক শক্তি ও চাপ',['পাত্রের আকার','পদার্থের রং','গাঢ়তা'],'আন্তঃআণবিক বল বেশি হলে স্ফুটনাংক বেশি।'),
  B(2,'বাইরের চাপ কমলে তরলের স্ফুটনাংক কী হয়?','কমে',['বাড়ে','অপরিবর্তিত থাকে','দ্বিগুণ হয়'],'চাপ কমলে অল্প তাপমাত্রাতেই বাষ্পচাপ বাইরের চাপের সমান হয়।'),
  B(2,'গলন ও স্ফুটনের সময় তাপমাত্রা কেমন থাকে?','স্থির থাকে',['বাড়তে থাকে','কমতে থাকে','সর্বোচ্চ হয়ে যায়'],'অবস্থা পরিবর্তনের সময় প্রদত্ত তাপ সুপ্ততাপ হিসেবে ব্যয় হয়, তাই তাপমাত্রা অপরিবর্তিত।'),
  B(2,'আয়োডিন ও চক পাউডারের মিশ্রণ পৃথক করা যায় কীভাবে?','উর্ধ্বপাতন দ্বারা',['ছাঁকন দ্বারা','বাষ্পীভবন দ্বারা','পাতন দ্বারা'],'আয়োডিন উর্ধ্বপাতিত হয়, চক হয় না।'),
  B(2,'নিচের কোনটি কঠিন ⇌ তরল ⇌ গ্যাস নিয়মের ব্যতিক্রম?','কর্পূর',['আয়রন','অক্সিজেন','পটাসিয়াম ক্লোরাইড'],'কর্পূর তরল না হয়ে সরাসরি বাষ্পে পরিণত হয়।'),
  B(3,'একই তাপমাত্রা ও চাপে সমআকৃতির বেলুনে CH₄, O₂, C₄H₁₀ ও C₃H₈ ভরা হলো। কোনটির আণবিক ভর সবচেয়ে বেশি?','C₄H₁₀ (৫৮)',['CH₄ (১৬)','O₂ (৩২)','C₃H₈ (৪৪)'],'৫৮ আণবিক ভরের বিউটেন সবচেয়ে ভারী; তাই সবচেয়ে ধীরে ব্যাপিত/নিঃসৃত হয়।'),
  B(3,'সূচ দিয়ে সমআকৃতির বেলুন ছিদ্র করলে CH₄ ও C₄H₁₀-এর মধ্যে কোন বেলুন আগে চুপসে যাবে?','CH₄-এর বেলুন',['C₄H₁₀-এর বেলুন','দুটোই একসাথে','কোনোটিই না'],'CH₄-এর আণবিক ভর কম, তাই নিঃসরণের হার বেশি।'),
  B(3,'একটি যৌগের তাপীয় বক্ররেখায় দুটি সমতল অংশ (স্থির তাপমাত্রা) থাকলে সমতল অংশ দুটি কী নির্দেশ করে?','গলন ও স্ফুটন',['শুধু গলন','শুধু স্ফুটন','হিমায়ন ও ঘনীভবন'],'অবস্থা পরিবর্তনের সময় তাপমাত্রা স্থির থাকে—গলন ও স্ফুটন।'),
  B(3,'শীতলীকরণ বক্ররেখায় সমতল অংশ কী নির্দেশ করে?','ঘনীভবন ও হিমায়ন (অবস্থা পরিবর্তন)',['শুধু তাপমাত্রা বৃদ্ধি','সম্পূর্ণ গ্যাসীয় অবস্থা','রাসায়নিক বিক্রিয়া'],'ঠান্ডা করার সময় অবস্থা বদলের সময়ও তাপমাত্রা স্থির থাকে।'),
  B(3,'বিউটেন ও প্রোপেন কোথা থেকে প্রাপ্ত গ্যাস?','পেট্রোলিয়াম রিফাইনারি',['কয়লার খনি','সমুদ্রের পানি','বায়ুমণ্ডলের স্তর'],'এলপিজি (প্রোপেন ও বিউটেন) তেল শোধনাগার থেকে পাওয়া যায়।')
 ],
 gens:[LIB.tempK,LIB.boyle,LIB.charles]
};

$('themeBtn').onclick = () => { const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('theme', n); } catch (e) {} document.documentElement.setAttribute('data-theme', n); };
ExamEngine.start(CH);
