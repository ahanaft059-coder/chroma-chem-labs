<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লেভেল ১: বেসিক ফাউন্ডেশন - ChromaChemLabs</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0d0e12;
            --card-border: #1f2430;
            --accent-cyan: #00e5ff;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --accent-purple: #7c4dff;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        /* Top Progress Bar */
        .progress-box {
            background: #11141c;
            border: 1px solid var(--card-border);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--accent-cyan);
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: #1a1f2c;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 25%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            border-radius: 5px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* Main Header */
        .exam-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .exam-header h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .exam-header p {
            color: var(--text-dim);
            font-size: 14px;
        }

        /* Question Container */
        .set-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .set-card.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .set-title {
            font-size: 20px;
            color: var(--accent-cyan);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: rgba(0, 229, 255, 0.1);
            color: var(--accent-cyan);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid var(--accent-cyan);
        }

        /* Question Item */
        .question-item {
            margin-bottom: 22px;
            background: #12151e;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #1a1e2b;
        }

        .question-text {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .option-item {
            display: flex;
            align-items: center;
            background: #181d2a;
            border: 1px solid #282e3f;
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .option-item:hover {
            border-color: var(--accent-cyan);
            background: #1e2536;
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--accent-cyan);
            transform: scale(1.2);
            cursor: pointer;
        }

        /* Buttons */
        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), #00b4d8);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5);
        }

        /* Cheer Up Overlay Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 4, 8, 0.92);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: #0f121a;
            border: 1px solid var(--accent-cyan);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.2);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .modal-title.pass {
            color: var(--accent-green);
            text-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }

        .modal-title.fail {
            color: var(--accent-red);
            text-shadow: 0 0 15px rgba(255, 82, 82, 0.4);
        }

        .score-box {
            background: #181c28;
            border-radius: 14px;
            padding: 15px;
            margin: 18px 0;
            border: 1px solid #262c3e;
        }

        .score-text {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
        }

        .modal-desc {
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .modal-btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn.pass-btn {
            background: linear-gradient(90deg, var(--accent-green), #00c853);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }

        .modal-btn.fail-btn {
            background: linear-gradient(90deg, var(--accent-red), #d50000);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 82, 82, 0.3);
        }

        .modal-btn:hover {
            transform: scale(1.02);
        }

        /* Confetti Effect */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            animation: fall 2s infinite ease-in-out;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .set-card { padding: 18px 14px; }
            .exam-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Progress Bar -->
    <div class="progress-box">
        <div class="progress-info">
            <span id="progressSetText">সেট ১ / ৪</span>
            <span id="progressPercentText">২৫% সম্পন্ন</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressBar"></div>
        </div>
    </div>

    <!-- Header -->
    <div class="exam-header">
        <h1>রসায়ন মাস্টার এক্সাম</h1>
        <p>পাসিং মার্কস: প্রতিটি সেটে অন্তত ২০/২৫ সঠিক উত্তর আবশ্যক</p>
    </div>

    <!-- Dynamic Set Container -->
    <div id="setCardContainer"></div>
</div>

<!-- Cheer Up / Result Modal -->
<div class="modal-overlay" id="resultModal">
    <div class="modal-card">
        <span class="modal-icon" id="modalIcon">🎉</span>
        <h2 class="modal-title" id="modalTitle">অসাধারণ পারফরম্যান্স!</h2>
        
        <div class="score-box">
            <div class="score-text" id="scoreText">২০ / ২৫</div>
        </div>
        
        <p class="modal-desc" id="modalDesc">আপনি সফলভাবে এই সেটটি পাস করেছেন!</p>
        
        <button class="modal-btn" id="modalActionBtn" onclick="handleModalAction()">পরবর্তী সেটে যান →</button>
    </div>
</div>

<script>
    // 100 Board Standard SSC Chemistry Questions (4 Sets x 25)
    const examSets = [
        {
            setName: "সেট ১: পদার্থের গঠন ও বেসিক ধারণা",
            questions: [
                { q: "১. রসায়নের মূল ভিত্তি কোনটি?", options: ["পরীক্ষণ ও পর্যবেক্ষণ", "তত্ত্ব", "গাণিতিক অনুমান", "ধারণা"], correct: 0 },
                { q: "২. কোনটি রাসায়নিক পরিবর্তন?", options: ["বরফ গলা", "লোহায় মরিচা ধরা", "পানি বাষ্প হওয়া", "মোম গলা"], correct: 1 },
                { q: "৩. পরমাণুর নিউক্লিয়াসে কোনটি থাকে না?", options: ["প্রোটন", "নিউট্রন", "ইলেকট্রন", "মেসন"], correct: 2 },
                { q: "৪. সিএনজি (CNG) এর প্রধান উপাদান কোনটি?", options: ["ইথেন", "প্রোপেন", "মিথেন", "বিউটেন"], correct: 2 },
                { q: "৫. কার্বনের প্রাকৃতিকভাবে প্রাপ্ত আইসোটোপ কয়টি?", options: ["২টি", "৩টি", "৪টি", "৫টি"], correct: 1 },
                { q: "৬. পদার্থের চতুর্থ অবস্থাকে কী বলা হয়?", options: ["বাষ্প", "প্লাজমা", "তরল", "কঠিন"], correct: 1 },
                { q: "৭. পিতল কিসের সংকর ধাতু?", options: ["তামা ও দস্তা", "তামা ও টিন", "লোহা ও নিকেল", "সীসা ও টিন"], correct: 0 },
                { q: "৮. কোনটি ঊর্ধ্বপাতিত পদার্থ নয়?", options: ["কপুর", "নিশাদল", "খাবার লবণ", "নেপথালিন"], correct: 2 },
                { q: "৯. সোডিয়ামের ল্যাটিন নাম কোনটি?", options: ["Kalium", "Natrium", "Ferrum", "Cuprum"], correct: 1 },
                { q: "১০. অ্যালুমিনিয়াম আয়নের (Al³⁺) ইলেকট্রন সংখ্যা কত?", options: ["১৩", "১০", "১৪", "১২"], correct: 1 },
                { q: "১১. নিউট্রন কণিকা আবিষ্কার করেন কে?", options: ["রাদারফোর্ড", "জে জে থমসন", "জেমস চ্যাডউইক", "নীল্‌স বোর"], correct: 2 },
                { q: "১২. K-শেলে সর্বোচ্চ কয়টি ইলেকট্রন থাকতে পারে?", options: ["২টি", "৮টি", "১৮টি", "৩২টি"], correct: 0 },
                { q: "১৩. ক্যান্সার নিরাময়ে ও চিকিৎসায় কোনটি ব্যবহৃত হয়?", options: ["Co-60", "C-14", "I-131", "Na-24"], correct: 0 },
                { q: "১৪. পরমাণুর ধনাত্মক আধানযুক্ত কণিকা কোনটি?", options: ["ইলেকট্রন", "প্রোটন", "নিউট্রন", "পজিট্রন"], correct: 1 },
                { q: "১৫. সবচেয়ে হালকা মৌল কোনটি?", options: ["হিলিয়াম", "হাইড্রোজেন", "লিথিয়াম", "নাইট্রোজেন"], correct: 1 },
                { q: "১৬. পর্যায় সারণিতে কোনটি ক্ষার ধাতু?", options: ["ক্যালসিয়াম", "ম্যাগনেসিয়াম", "সোডিয়াম", "অ্যালুমিনিয়াম"], correct: 2 },
                { q: "১৭. সালফারের পারমাণবিক ভর কত?", options: ["১৬", "৩২", "৬৪", "৪০"], correct: 1 },
                { q: "১৮. শুষ্ক বরফ (Dry Ice) বলা হয় কাকে?", options: ["কঠিন H₂O", "কঠিন CO₂", "কঠিন N₂", "কঠিন NH₃"], correct: 1 },
                { q: "১৯. বরফ গলনের সুপ্ততাপ কত?", options: ["2260 kJ/kg", "336 kJ/kg", "100 kJ/kg", "4200 J/kg"], correct: 1 },
                { q: "২০. কক্ষ তাপমাত্রায় তরল ধাতু কোনটি?", options: ["ব্রোমিন", "পারদ", "সোডিয়াম", "পটাশিয়াম"], correct: 1 },
                { q: "২১. ²³₁₁Na পরমাণুতে নিউট্রন সংখ্যা কতটি?", options: ["১১", "২৩", "১২", "৩৪"], correct: 2 },
                { q: "২২. ক্লোরিনের আপেক্ষিক পারমাণবিক ভর কত?", options: ["৩৫", "৩৬", "৩৫.৫", "৩৭"], correct: 2 },
                { q: "২৩. আলফা কণা বিচ্ছুরণ পরীক্ষায় কোনটি ব্যবহৃত হয়েছিল?", options: ["সোনার পাত", "লোহার পাত", "তামার পাত", "রূপার পাত"], correct: 0 },
                { q: "২৪. প্রত্নতাত্ত্বিক নমুনার বয়স নির্ধারণে ব্যবহৃত হয় কোনটি?", options: ["C-12", "C-14", "Co-60", "P-32"], correct: 1 },
                { q: "২৫. অধাতু হওয়া সত্ত্বেও কোনটি ঘরের তাপমাত্রায় তরল?", options: ["ক্লোরিন", "আইওডিন", "ব্রোমিন", "ফ্লুরিন"], correct: 2 }
            ]
        },
        {
            setName: "সেট ২: পর্যায় সারণি ও রাসায়নিক বন্ধন",
            questions: [
                { q: "১. পর্যায় সারণির জনক কে?", options: ["ল্যাভয়েসিয়্যে", "ম্যান্ডেলিফ", "মোজলে", "ডাল্টন"], correct: 1 },
                { q: "২. আধুনিক পর্যায় সারণিতে পর্যায় সংখ্যা কয়টি?", options: ["৭টি", "১৮টি", "৮টি", "১০টি"], correct: 0 },
                { q: "৩. হ্যালোজেন মৌলগুলো কোন গ্রুপে অবস্থিত?", options: ["গ্রুপ ১", "গ্রুপ ২", "গ্রুপ ১৭", "গ্রুপ ১৮"], correct: 2 },
                { q: "৪. সবচেয়ে তড়িৎ-ঋণাত্মক মৌল কোনটি?", options: ["ক্লোরিন", "ফ্লুরিন", "অক্সিজেন", "নাইট্রোজেন"], correct: 1 },
                { q: "৫. নিষ্ক্রিয় গ্যাস নয় কোনটি?", options: ["হিলিয়াম", "আর্গন", "অক্সিজেন", "রেডন"], correct: 2 },
                { q: "৬. সমযোজী যৌগের সাধারণ বৈশিষ্ট্য কোনটি?", options: ["উচ্চ গলনাঙ্ক", "নিম্ন গলনাঙ্ক", "বিদ্যুৎ পরিবাহী", "পানিতে দ্রবণীয়"], correct: 1 },
                { q: "৭. আয়নিক যৌগের ক্ষেত্রে কোনটি সত্য?", options: ["গলনাঙ্ক কম", "পানিতে অদ্রবণীয়", "গলিত অবস্থায় বিদ্যুৎ পরিবাহী", "অধাতু-অধাতু বন্ধন"], correct: 2 },
                { q: "৮. নিষ্ক্রিয় গ্যাসের যোজ্যতা কত?", options: ["১", "২", "৮", "০"], correct: 3 },
                { q: "৯. বায়ুমণ্ডলে সবচেয়ে বেশি প্রাপ্ত নিষ্ক্রিয় গ্যাস কোনটি?", options: ["হিলিয়াম", "নেয়ন", "আর্গন", "ক্রিপ্টন"], correct: 2 },
                { q: "১০. পানির (H₂O) অণুতে কোন ধরনের বন্ধন বিদ্যমান?", options: ["আয়নিক", "সমযোজী", "ধাতব", "হাইড্রোজেন বন্ধন ছাড়া অন্য কিছু"], correct: 1 },

            card.id = `setCard-${sIdx}`;

            let questionsHTML = set.questions.map((q, qIdx) => `
                <div class="question-item">
                    <div class="question-text">${q.q}</div>
                    <div class="options-grid">
                        ${q.options.map((opt, oIdx) => `
                            <label class="option-item">
                                <input type="radio" name="set${sIdx}_q${qIdx}" value="${oIdx}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            card.innerHTML = `
                <div class="set-title">
                    <span>${set.setName}</span>
                    <span class="badge">২৫ টি প্রশ্ন</span>
                </div>
                ${questionsHTML}
                <button class="submit-btn" onclick="submitCurrentSet(${sIdx})">সেট সাবমিট করুন</button>
            `;

            container.appendChild(card);
        });

        updateProgressBar();
    }

    function updateProgressBar() {
        const progressFill = document.getElementById('progressBar');
        const setText = document.getElementById('progressSetText');
        const percentText = document.getElementById('progressPercentText');

        const currentNum = currentSetIndex + 1;
        const percent = Math.round((currentNum / totalSets) * 100);

        setText.innerText = `সেট ${currentNum} / ${totalSets}`;
        percentText.innerText = `${percent}% সম্পন্ন`;
        progressFill.style.width = `${percent}%`;
    }

    function submitCurrentSet(sIdx) {
        const setQuestions = examSets[sIdx].questions;
        let score = 0;

        setQuestions.forEach((q, qIdx) => {
            const selected = document.querySelector(`input[name="set${sIdx}_q${qIdx}"]:checked`);
            if (selected && parseInt(selected.value) === q.correct) {
                score++;
            }
        });

        showResultModal(score, setQuestions.length);
    }

    function showResultModal(score, total) {
        const modal = document.getElementById('resultModal');
        const icon = document.getElementById('modalIcon');
        const title = document.getElementById('modalTitle');
        const scoreText = document.getElementById('scoreText');
        const desc = document.getElementById('modalDesc');
        const actionBtn = document.getElementById('modalActionBtn');

        scoreText.innerText = `${score} / ${total}`;

        if (score >= PASS_MARK) {
            // PASS
            icon.innerText = "🎉";
            title.innerText = "দারুণ! পাস করেছেন!";
            title.className = "modal-title pass";
            desc.innerText = `অভিনন্দন! আপনি পাসিং মার্কস (${PASS_MARK}) অতিক্রম করেছেন।`;
            
            if (currentSetIndex < totalSets - 1) {
                actionBtn.innerText = "পরবর্তী সেটে যান →";
                actionBtn.className = "modal-btn pass-btn";
                actionBtn.onclick = goToNextSet;
            } else {
                actionBtn.innerText = "লেভেল ২ আনলক করুন 🔓";
                actionBtn.className = "modal-btn pass-btn";
                actionBtn.onclick = finishLevelOne;
            }
        } else {
            // FAIL
            icon.innerText = "❌";
            title.innerText = "আরেকটু চেষ্টা করুন!";
            title.className = "modal-title fail";
            desc.innerText = `পরবর্তী সেটে আনলক করতে কমপক্ষে ${PASS_MARK}টি সঠিক উত্তর প্রয়োজন।`;
            actionBtn.innerText = "আবার চেষ্টা করুন 🔄";
            actionBtn.className = "modal-btn fail-btn";
            actionBtn.onclick = retryCurrentSet;
        }

        modal.style.display = 'flex';
    }

    function goToNextSet() {
        document.getElementById('resultModal').style.display = 'none';
        
        // Hide current
        document.getElementById(`setCard-${currentSetIndex}`).classList.remove('active');
        
        // Increment
        currentSetIndex++;
        
        // Show next
        document.getElementById(`setCard-${currentSetIndex}`).classList.add('active');
        
        updateProgressBar();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function retryCurrentSet() {
        document.getElementById('resultModal').style.display = 'none';
        // Reset radio buttons for current set
        const radios = document.querySelectorAll(`#setCard-${currentSetIndex} input[type="radio"]`);
        radios.forEach(r => r.checked = false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function finishLevelOne() {
        // Unlock Level 2 in LocalStorage
        localStorage.setItem('chroma_unlocked_level', 2);
        
        // Redirect to main exam page
        window.location.href = 'exam.html';
    }

    // Initialize on load
    window.onload = initExam;
</script>
</body>
</html>
