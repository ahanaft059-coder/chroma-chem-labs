<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pH ক্যালকুলেটর | রসায়ন ল্যাব</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 40px; margin: 0; display: flex; justify-content: center; }
        
        .back-btn { position: fixed; top: 20px; left: 20px; background: #334155; color: white; padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        .back-btn:hover { background: #475569; }

        .card { background: var(--card); padding: 40px; border-radius: 25px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 600px; }
        
        /* ব্যবহারের নিয়ম বক্স */
        .instruction { background: #1e3a8a; padding: 15px; border-radius: 12px; border-left: 5px solid #3b82f6; color: #dbeafe; font-size: 0.95rem; margin-bottom: 25px; }

        input { width: 100%; padding: 18px; margin: 20px 0; border: 2px solid #334155; border-radius: 12px; font-size: 1.1rem; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 18px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        
        #phScaleContainer { position: relative; margin: 60px 0 40px 0; height: 40px; background: linear-gradient(to right, #ef4444, #f97316, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7); border-radius: 8px; }
        #marker { width: 6px; height: 60px; background: white; position: absolute; top: -10px; left: 0%; transition: 0.5s; border-radius: 3px; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .tick-marks { display: flex; justify-content: space-between; position: absolute; width: 100%; top: 45px; font-size: 12px; }
        
        .note { margin-top: 30px; padding: 20px; background: #334155; border-radius: 15px; font-size: 0.95rem; }
        .formula-box { background: #0f172a; padding: 15px; border-radius: 10px; border-left: 4px solid var(--accent); font-family: monospace; font-size: 1.1rem; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

<a href="calculators.html" class="back-btn">⬅ ফিরে যান</a>

<div class="card">
    <h2>🧪 pH ক্যালকুলেটর</h2>
    
    <div class="instruction">
        <strong>⚠️ ব্যবহারের নিয়ম:</strong><br>
        ইনপুট বক্সে শুধুমাত্র H+ আয়ন ঘনমাত্রা (যেমন: 0.001) লিখুন। দশমিকের পর সঠিক সংখ্যা প্রদান করুন।
    </div>

    <input type="number" id="hConc" step="any" placeholder="H+ আয়ন ঘনমাত্রা লিখুন (যেমন: 0.001)">
    <button onclick="calculatePH()">pH নির্ণয় করুন</button>
    
    <div id="phScaleContainer">
        <div id="marker"></div>
        <div class="tick-marks">
            <span>0</span><span>2</span><span>4</span><span>6</span><span>7</span><span>8</span><span>10</span><span>12</span><span>14</span>
        </div>
    </div>
    
    <h3 id="result" style="text-align: center; color: var(--accent);">pH মান: -</h3>
    <p id="nature" style="text-align: center; font-weight: bold;"></p>

    <div class="note">
        <strong>গাণিতিক সূত্র:</strong>
        <div class="formula-box">pH = -log₁₀[H⁺]</div>
        <ul>
            <li><strong>pH < 7:</strong> অম্লীয় (Acidic)</li>
            <li><strong>pH = 7:</strong> নিরপেক্ষ (Neutral)</li>
            <li><strong>pH > 7:</strong> ক্ষারীয় (Basic)</li>
        </ul>
    </div>
</div>

<script>
    function calculatePH() {
        let h = parseFloat(document.getElementById('hConc').value);
        let resultText = document.getElementById('result');
        let natureText = document.getElementById('nature');
        let marker = document.getElementById('marker');

        if (isNaN(h) || h <= 0) {
            alert("সতর্কতা: অনুগ্রহ করে একটি বৈধ ধনাত্মক সংখ্যা লিখুন!");
            return;
        }

        let ph = -Math.log10(h);
        ph = Math.max(0, Math.min(14, ph)); 

        resultText.innerText = "pH মান: " + ph.toFixed(2);
        
        if (ph < 7) natureText.innerText = "প্রকৃতি: অম্লীয় (Acidic)";
        else if (ph > 7) natureText.innerText = "প্রকৃতি: ক্ষারীয় (Basic)";
        else natureText.innerText = "প্রকৃতি: নিরপেক্ষ (Neutral)";

        let pos = (ph / 14) * 100;
        marker.style.left = pos + "%";
    }
</script>

</body>
</html>
