<style>
:root{--bg-color:#eef2f9;--card-bg:rgba(255,255,255,.74);--card-solid:#fff;--text-color:#0f172a;--text-muted:#5b6b82;--border-color:rgba(15,23,42,.12);--shadow:0 10px 30px -5px rgba(15,23,42,.08);--section-border:rgba(168,85,247,.28);--gradient-primary:linear-gradient(135deg,#9333ea,#3b82f6);--gradient-glow:rgba(147,51,234,.18);--grid-line:rgba(15,23,42,.05);--blob-opacity:.22;--gold:#d97706;--accent:#7c3aed}
[data-theme="dark"]{--bg-color:#05060f;--card-bg:rgba(16,20,36,.62);--card-solid:#0b0f1c;--text-color:#f8fafc;--text-muted:#94a3b8;--border-color:rgba(255,255,255,.1);--shadow:0 20px 40px -15px rgba(0,0,0,.7);--section-border:rgba(168,85,247,.35);--gradient-primary:linear-gradient(135deg,#a855f7,#60a5fa);--gradient-glow:rgba(168,85,247,.28);--grid-line:rgba(255,255,255,.035);--blob-opacity:.42;--gold:#fbbf24;--accent:#a78bfa}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;padding:18px 18px 64px;font-family:'Plus Jakarta Sans','Hind Siliguri','Segoe UI',system-ui,sans-serif;background:var(--bg-color);color:var(--text-color);transition:background .4s,color .4s;animation:pageIn .6s ease both}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(95px);opacity:var(--blob-opacity);animation:drift 26s ease-in-out infinite alternate}
.b1{width:520px;height:520px;background:#0891b2;top:-150px;left:-120px}
.b2{width:620px;height:620px;background:#7e22ce;bottom:-230px;right:-170px;animation-duration:32s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto}
.top{position:sticky;top:10px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;margin-bottom:30px;border-radius:24px;background:var(--card-bg);border:1.5px solid var(--border-color);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-color)}
.orb{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 35% 30%,#fff,#22d3ee 55%,#a855f7);box-shadow:0 0 18px #22d3ee,0 0 34px rgba(168,85,247,.7)}
.brand b{display:block;font-size:18px;font-weight:800;line-height:1.2}
.brand small{display:block;font-size:12px;font-weight:700;color:#a855f7}
.top-right{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:14px;cursor:pointer;font-size:16px;color:var(--text-color);background:var(--card-solid);border:1px solid var(--border-color);display:inline-flex;align-items:center;justify-content:center;transition:transform .3s,box-shadow .3s}
.icon-btn:hover{transform:rotate(180deg);box-shadow:0 8px 22px var(--gradient-glow)}
.back-btn{display:inline-flex;align-items:center;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:700;text-decoration:none;color:var(--text-color);background:var(--card-solid);border:1px solid var(--border-color);transition:transform .25s,border-color .25s}
.back-btn:hover{transform:translateX(-3px);border-color:rgba(168,85,247,.6)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
.hero{text-align:center;margin-bottom:26px}
.pill{display:inline-block;padding:6px 16px;border-radius:30px;font-size:13px;font-weight:700;color:#a855f7;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.3)}
.hero h1{margin:14px 0 10px;font-size:clamp(2rem,5vw,3.1rem);font-weight:800;letter-spacing:-.5px;line-height:1.25;background:var(--gradient-primary);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:200% center}}
.hero p{margin:0 auto;max-width:560px;font-size:16px;line-height:1.7;font-weight:500;color:var(--text-muted)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:8px}
.search{flex:1 1 260px;font-family:inherit;font-size:15px;font-weight:600;padding:13px 18px;border-radius:16px;color:var(--text-color);background:var(--card-bg);border:1.5px solid var(--border-color);outline:none;backdrop-filter:blur(12px);transition:border-color .25s,box-shadow .25s}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:inherit;font-size:13.5px;font-weight:700;padding:10px 16px;border-radius:30px;cursor:pointer;color:var(--text-muted);background:var(--card-solid);border:1.5px solid var(--border-color);transition:transform .2s,color .2s,border-color .2s}
.chip:hover{color:var(--text-color);border-color:rgba(168,85,247,.55);transform:translateY(-2px)}
.chip.on{color:#fff;border-color:transparent;background:var(--gradient-primary);box-shadow:0 8px 20px var(--gradient-glow)}
.count{margin:10px 4px 0;font-size:13px;font-weight:600;color:var(--text-muted)}
.section-title{display:flex;align-items:center;gap:10px;margin:34px 0 18px;padding-bottom:12px;font-size:22px;font-weight:800;border-bottom:2px dashed var(--section-border)}
.section-title.soon{border-bottom-color:rgba(251,191,36,.55);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.back-btn .long{display:none}}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:24px;border-radius:24px;background:var(--card-bg);border:1.5px solid var(--section-border);box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .3s,border-color .3s,box-shadow .3s;animation:rise .5s ease both}

.card::before{content:'';position:absolute;top:-80px;right:-60px;width:200px;height:200px;pointer-events:none;background:radial-gradient(circle,var(--gradient-glow),transparent 70%)}
.card>*{position:relative}
.card:hover{transform:translateY(-6px);border-color:rgba(168,85,247,.7);box-shadow:0 24px 44px -16px var(--gradient-glow)}
.card.soon{border-color:rgba(251,191,36,.4);opacity:.8}
.card.soon:hover{transform:none;box-shadow:var(--shadow);border-color:rgba(251,191,36,.7)}
.no{position:absolute;top:16px;right:18px;font-size:12px;font-weight:800;color:var(--text-muted)}
.icon{width:56px;height:56px;margin-bottom:14px;border-radius:18px;font-size:28px;display:flex;align-items:center;justify-content:center;background:var(--card-solid);border:1px solid var(--border-color)}
.card h3{margin:0 0 8px;font-size:20px;font-weight:800;line-height:1.35}
.card p{margin:0;font-size:14.5px;line-height:1.7;font-weight:500;color:var(--text-muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{padding:2px 11px;border-radius:20px;font-size:12px;font-weight:800;color:var(--accent);background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.3)}
.tag.new{color:var(--gold);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4)}
.play{display:block;text-align:center;padding:13px;border-radius:14px;font-size:15px;font-weight:800;text-decoration:none;color:#fff;background:var(--gradient-primary);transition:transform .25s,box-shadow .25s}
.play:hover{transform:translateY(-2px);box-shadow:0 10px 22px var(--gradient-glow)}
.card.soon .play{color:var(--text-muted);background:var(--card-solid);border:1px dashed var(--border-color);cursor:not-allowed}
.card.soon .play:hover{transform:none;box-shadow:none}
.empty{display:none;margin:40px 0;padding:30px;text-align:center;border-radius:20px;font-weight:600;color:var(--text-muted);background:var(--card-bg);border:1px dashed var(--border-color)}
.empty.show{display:block}
.credit-bar{position:fixed;bottom:0;left:0;width:100%;height:34px;z-index:2500;display:flex;align-items:center;justify-content:center;font-size:.78rem;letter-spacing:.6px;color:#64748b;background:rgba(5,6,15,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.06)}
[data-theme="light"] .credit-bar{background:rgba(255,255,255,.88);color:#475569;border-top-color:rgba(15,23,42,.1)}
.credit-bar span{margin-left:5px;font-weight:700;background:linear-gradient(90deg,#22d3ee,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

    ['🥧', 'শতকরা সংযুতি ক্যালকুলেটর', 'যৌগের সংকেত থেকে প্রতিটি মৌলের শতকরা ভর জানো।', null, 'মৌল ও সংকেত', true],

const $ = id => document.getElementById(id);
const bn = n => Number(n).toLocaleString('bn-BD', { useGrouping: false });
$('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', next); } catch (e) {}
    document.documentElement.setAttribute('data-theme', next);
});
let filter = 'all';
CALCS.forEach((c, i) => c.n = i + 1);

function card(c, i) {
    const locked = !c.href;
    const el = document.createElement('article'); el.className = 'card' + (locked ? ' soon' : ''); el.style.animationDelay = Math.min(i, 8) * 50 + 'ms';
    const no = document.createElement('span'); no.className = 'no'; no.textContent = 'ক্যালক ' + bn(c.n);
    const top = document.createElement('div');
    const ic = document.createElement('div'); ic.className = 'icon'; ic.textContent = c.icon; ic.setAttribute('aria-hidden', 'true');
    const h = document.createElement('h3'); h.textContent = c.t; const p = document.createElement('p'); p.textContent = c.d;
    const tg = document.createElement('div'); tg.className = 'tags';
    const t1 = document.createElement('span'); t1.className = 'tag'; t1.textContent = c.cat; tg.appendChild(t1);
    if (c.isNew) { const t2 = document.createElement('span'); t2.className = 'tag new'; t2.textContent = '✨ নতুন আইডিয়া'; tg.appendChild(t2); }
    top.append(ic, h, p, tg);
    const a = document.createElement('a'); a.className = 'play';
    if (locked) { a.textContent = 'শীঘ্রই আসছে 🔒'; a.href = '#'; a.tabIndex = -1; a.setAttribute('aria-disabled', 'true'); a.addEventListener('click', e => e.preventDefault()); }
    else { a.href = c.href; a.textContent = 'হিসাব করুন ⚡'; a.setAttribute('aria-label', c.t + ' হিসাব করুন'); }
    el.append(no, top, a); return el;
}
function section(title, cls, list) {
    const w = document.createElement('div'); const h = document.createElement('h2'); h.className = 'section-title ' + cls; h.textContent = title;
    const g = document.createElement('div'); g.className = 'grid'; list.forEach((c, i) => g.appendChild(card(c, i))); w.append(h, g); return w;
}
function render() {
    const q = $('q').value.trim().toLowerCase();
    const list = CALCS.filter(c => (filter === 'all' || (filter === 'open' && c.href) || (filter === 'soon' && !c.href)) && (!q || (c.t + ' ' + c.d + ' ' + c.cat).toLowerCase().includes(q)));
    const root = $('sections'); root.replaceChildren();
    const open = list.filter(c => c.href), soon = list.filter(c => !c.href);
    if (open.length) root.appendChild(section('⚡ চালু ক্যালকুলেটর', '', open));
    if (soon.length) root.appendChild(section('🚧 শীঘ্রই আসছে', 'soon', soon));
    $('empty').classList.toggle('show', !list.length);
    $('count').textContent = bn(list.length) + 'টি ক্যালকুলেটর দেখানো হচ্ছে · ' + bn(open.length) + 'টি চালু';
}
$('q').addEventListener('input', render);
document.querySelectorAll('#chips .chip').forEach(b => b.addEventListener('click', () => { filter = b.dataset.f; document.querySelectorAll('#chips .chip').forEach(x => x.classList.toggle('on', x === b)); render(); }));
render();
</script>
</body>
</html>
