    <script>
        (function () { try { var v = localStorage.getItem('redox-bg'); if (v === 'alt') v = '2'; if (v === '2' || v === '3') document.documentElement.setAttribute('data-bg', v); } catch (e) {} })();
/* ===== NB SOUND: শূন্য-নির্ভরতার WebAudio সাউন্ড ইফেক্ট =====
           ব্যবহার: const sfx = NBSound('গেমের-কী'); sfx.ok(); sfx.bad(); sfx.win(); sfx.lose(); sfx.tap(); sfx.pop();
           বাটন: #soundBtn থাকলে সেটি নিজে নিজে 🔔/🔕 টগল করে (localStorage '<কী>-sound') */
        function NBSound(key) {
            let on = true, ac = null;
            try { on = localStorage.getItem(key + '-sound') !== '0'; } catch (e) {}
            function tone(f, t0, dur, type, vol) {
                if (!on) return;
                try {
                    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
                    if (ac.state === 'suspended') ac.resume();
                    const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
                    const t = ac.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .03);
                } catch (e) {}
            }
            const api = {
                ok() { tone(660, 0, .12); tone(880, .1, .16); },
                bad() { tone(220, 0, .2, 'sawtooth', .1); tone(160, .14, .26, 'sawtooth', .1); },
                tap() { tone(520, 0, .06, 'triangle', .1); },
                pop() { tone(440, 0, .08, 'square', .06); tone(740, .06, .1, 'square', .06); },
                win() { tone(523, 0, .12); tone(659, .12, .12); tone(784, .24, .12); tone(1047, .36, .3); },
                lose() { tone(392, 0, .2); tone(330, .2, .2); tone(262, .4, .4); },
                get on() { return on; },
                toggle() { on = !on; try { localStorage.setItem(key + '-sound', on ? '1' : '0'); } catch (e) {} paint(); if (on) api.ok(); }
            };
            function paint() { const b = document.getElementById('soundBtn'); if (b) b.textContent = on ? '🔔' : '🔕'; }
            document.addEventListener('DOMContentLoaded', () => { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } });
            if (document.readyState !== 'loading') { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } }
            return api;
        }
        
    </script>
    <style>
/* ===== NB KIT: sticker / neo-brutalist দৃশ্যরূপ =====
   প্রতিটি গেম নিজের :root-এ এই টোকেনগুলো বদলে নিজস্ব রং পায়:
   --o1 --o2 --o3 (বাইরের ব্যাকগ্রাউন্ড), --paper (বোর্ড), --paper2, --ink, --a1 --a2 --a3 (অ্যাকসেন্ট)  */
:root {
    color-scheme: light;
    --o1: #ff6b4a; --o2: #ffd23f; --o3: #5ad1c4;
    --paper: #fff8ec; --paper2: #ffffff; --ink: #1d1030; --mute: #6a5f80;
    --a1: #ff6b4a; --a2: #2ec4b6; --a3: #ffd23f; --good: #12a36b; --bad: #e5384d;
    --bw: 3px; --rad: 16px; --sh: 5px;
    --display: 'Bricolage Grotesque','Hind Siliguri',system-ui,sans-serif;
    --body: 'Hind Siliguri','Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
    --pat: radial-gradient(rgba(29,16,48,.20) 1.4px, transparent 1.6px);
    --pat-size: 22px 22px;
}
:root[data-bg="2"] { --o1: #2ec4b6; --o2: #c9f2ee; --o3: #ff6b4a; }
:root[data-bg="3"] { --o1: #a78bfa; --o2: #ffd6f0; --o3: #ffd23f; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--body); font-weight: 500; line-height: 1.55;
    padding: 18px max(14px, env(safe-area-inset-right, 0px)) 30px max(14px, env(safe-area-inset-left, 0px));
    background-color: var(--o1);
    background-image: var(--pat), radial-gradient(circle at 12% 6%, var(--o2) 0, transparent 46%), radial-gradient(circle at 94% 96%, var(--o3) 0, transparent 50%);
    background-size: var(--pat-size), 100% 100%, 100% 100%;
    background-attachment: fixed; transition: background-color .4s; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

.stage { max-width: 860px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 24px; box-shadow: 9px 9px 0 var(--ink); }
.credit { width: fit-content; max-width: 100%; margin: 18px auto 0; padding: 6px 14px; text-align: center; font-size: 12.5px; font-weight: 700; letter-spacing: .3px; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--ink); }

/* উপরের বার */
.top { display: flex; align-items: center; gap: 10px; }
.titlebox { margin-right: auto; min-width: 0; }
.titlebox b { display: inline-block; padding: 3px 12px; font: 800 clamp(1.05rem, 3.6vw, 1.35rem)/1.3 var(--display); color: var(--ink); background: var(--a3); border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-1.2deg); }
.titlebox small { display: block; margin: 5px 0 0 4px; font-size: 12px; font-weight: 700; color: var(--mute); }
.btn, .back-btn, .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 14px;
    font: 800 14px/1 var(--body); text-decoration: none; cursor: pointer; color: var(--ink); background: var(--paper2);
    border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s, background .12s;
}
.btn:hover:not(:disabled), .back-btn:hover, .icon-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:active:not(:disabled), .back-btn:active, .icon-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: 2px 2px 0 var(--ink); }
.btn.primary { background: var(--a1); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
.btn.alt { background: var(--a2); }
.btn.big { min-height: 54px; padding: 0 26px; font-size: 17px; border-radius: 14px; }
.icon-btn { width: 42px; padding: 0; font-size: 17px; }

/* পিল, ক্যাপসুল, কার্ড */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; font-size: 13px; font-weight: 800; color: var(--ink); background: var(--paper2); border: 2.5px solid var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--ink); }
.pill b { font-variant-numeric: tabular-nums; }
.box { padding: 14px; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: var(--rad); box-shadow: 5px 5px 0 var(--ink); }
.sticker { display: inline-block; padding: 3px 11px; font-size: 12px; font-weight: 800; color: var(--ink); background: var(--a3); border: 2.5px solid var(--ink); border-radius: 8px; transform: rotate(-2deg); }
.meter { height: 16px; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 100%; background: var(--a1); border-right: 2.5px solid var(--ink); transition: width .25s ease; }
.hazard { height: 12px; border: 2.5px solid var(--ink); border-radius: 6px; background: repeating-linear-gradient(-45deg, var(--a3) 0 10px, var(--ink) 10px 20px); }

/* মডাল */
.modal { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; padding: 16px; background: rgba(29,16,48,.58); }
.sheet { width: min(500px, 100%); max-height: 92%; overflow: auto; padding: 22px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 22px; box-shadow: 9px 9px 0 var(--ink); }
.sheet h2 { margin: 6px 0 10px; font: 800 22px/1.35 var(--display); }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 18px); transform: translateX(-50%); z-index: 3500; padding: 8px 16px; font-size: 15px; font-weight: 800; color: var(--ink); background: var(--a3); border: var(--bw) solid var(--ink); border-radius: 99px; box-shadow: 4px 4px 0 var(--ink); opacity: 0; pointer-events: none; }
.toast.on { animation: nbtoast 1.7s ease forwards; }
@keyframes nbtoast { 0% { opacity: 0; transform: translate(-50%, -10px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@keyframes nbshake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes nbpop { from { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
@media (max-width: 520px) { .stage { padding: 12px; border-radius: 20px; gap: 12px; box-shadow: 6px 6px 0 var(--ink); } .back-btn .long { display: none; } .titlebox small { display: none; } }

/* ===== Redox Race: নিজস্ব ওভাররাইড ===== */
:root {
    --o1: #3b6cff; --o2: #79a0ff; --o3: #4cc9f0;
    --paper: #fff6e3; --paper2: #ffffff; --ink: #14122b; --mute: #5d5a7a;
    --a1: #ff6a1f; --a2: #4cc9f0; --a3: #ffd93d; --good: #0e9f6e; --bad: #e5304a;
    --asphalt: #34363f; --display: 'Rubik','Hind Siliguri',system-ui,sans-serif;
    --stripe: rgba(255,255,255,.13);
}
:root[data-bg="2"] { --o1: #ff7a3d; --o2: #ffc371; --o3: #ff4f5e; --stripe: rgba(255,255,255,.18); }
:root[data-bg="3"] { --o1: #5ee0b8; --o2: #bdf0ff; --o3: #4cc9f0; --stripe: rgba(255,255,255,.35); }
body {
    background-image:
        radial-gradient(rgba(20,18,43,.22) 1.4px, transparent 1.7px),
        repeating-linear-gradient(135deg, var(--stripe) 0 38px, transparent 38px 76px),
        conic-gradient(rgba(20,18,43,.07) 25%, transparent 0 50%, rgba(20,18,43,.07) 0 75%, transparent 0),
        radial-gradient(circle at 12% 6%, var(--o2) 0, transparent 46%),
        radial-gradient(circle at 94% 96%, var(--o3) 0, transparent 50%);
    background-size: 22px 22px, 100% 100%, 96px 96px, 100% 100%, 100% 100%;
}
.stage { max-width: 800px; }
.icon-btn { flex: none; width: 44px; min-height: 44px; }
.back-btn { min-height: 44px; }
.titlebox b { background: var(--a3); }
.titlebox small { display: inline-block; margin: 6px 0 0 4px; padding: 1px 9px; font-size: 11.5px; color: #fff; background: var(--ink); border-radius: 6px; transform: rotate(1.5deg); }

.stack { display: grid; gap: 16px; }
.hud { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
/* স্পিডোমিটার-স্টিকার */
.stat { flex: 1 1 78px; max-width: 150px; display: block; text-align: center; padding: 4px 8px 6px; min-height: 62px; font-size: 12px; font-weight: 800; line-height: 1.25; color: var(--ink); background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 18px 18px 12px 12px; box-shadow: 3px 3px 0 var(--ink); }
#sStreak, #sTime { display: block; }
.stat b { font: 900 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat:nth-of-type(1) { background: #ffe9a8; transform: rotate(-1.5deg); }
.stat:nth-of-type(3) { background: #c8f1ff; transform: rotate(1deg); }
.stat:nth-of-type(4) { background: #ffd6c2; transform: rotate(-1deg); }
.stat.nitro { position: relative; flex-basis: 100%; max-width: none; display: flex; justify-content: center; align-items: center; flex-direction: row; gap: 8px; min-height: 46px; overflow: hidden; padding-bottom: 14px; font: 900 16px/1.2 var(--display); color: #fff; text-shadow: 1.5px 1.5px 0 var(--ink); background: var(--a1); border-radius: 12px; transform: none; animation: nbflame .5s steps(2) infinite; }
.stat.nitro::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; border-top: 2.5px solid var(--ink); background: repeating-linear-gradient(-45deg, var(--a3) 0 10px, var(--ink) 10px 20px); }
@keyframes nbflame { 50% { transform: translateY(-2px) rotate(-.6deg); } }
.btn.sp { flex: 0 0 auto; margin-left: auto; align-self: center; }
@media (max-width: 520px) { .btn.sp { flex: 1 1 100%; } .stat { max-width: none; } }

/* রেস ট্র্যাক */
.lane { display: grid; grid-template-columns: 64px 1fr 48px; align-items: center; gap: 10px; }
.lane + .lane { margin-top: 12px; }
.lane-name { justify-self: start; padding: 2px 9px; font-size: 13px; font-weight: 800; background: var(--a2); border: 2.5px solid var(--ink); border-radius: 8px; transform: rotate(-3deg); }
.lane.ai .lane-name { background: var(--a3); transform: rotate(2deg); }
.pct { font: 900 14px var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.road { position: relative; height: 60px; overflow: hidden; background: var(--asphalt); border: var(--bw) solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink);
    background-image: linear-gradient(#fff 0 3px, transparent 3px calc(100% - 3px), #fff calc(100% - 3px)); background-size: 100% 100%; }
.road::before { content: ""; position: absolute; left: 0; right: 28px; top: 50%; height: 4px; transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, #fff 0 20px, transparent 20px 40px); background-size: 40px 4px; }
.racing .road::before { animation: dash .5s linear infinite; }
@keyframes dash { to { background-position: -40px 0; } }
.road::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 24px; border-left: 3px solid var(--ink);
    background: conic-gradient(var(--ink) 25%, #fff 0 50%, var(--ink) 0 75%, #fff 0) 0 0/12px 12px; }
.car { position: absolute; top: 50%; left: calc(var(--p,0) * 1%); font-size: 30px; line-height: 1; z-index: 2;
    transform: translate(calc(var(--p,0) * -1%), -50%) scaleX(-1); transition: left .55s cubic-bezier(.3,1.2,.5,1), transform .55s cubic-bezier(.3,1.2,.5,1), filter .3s; }
.car.boost { filter: drop-shadow(0 0 0 #ff6a1f) drop-shadow(-4px 0 0 #ffd93d) drop-shadow(-8px 0 0 #ff6a1f); }
.lane .road { padding-left: 4px; }

.panel { min-height: 340px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.center { text-align: center; }
.center h2 { margin: 0 0 6px; font: 900 clamp(1.4rem, 5vw, 1.9rem)/1.35 var(--display); }
.center p { margin: 0 auto 6px; max-width: 520px; color: var(--mute); font-weight: 600; line-height: 1.7; }
.seg { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px 0 16px; }
.seg button { min-height: 44px; padding: 0 18px; font: 800 14.5px var(--body); cursor: pointer; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
.seg button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.seg button[aria-pressed="true"] { background: var(--a1); color: #fff; text-shadow: 1px 1px 0 var(--ink); transform: rotate(-1.5deg); }
.best { margin-top: 14px; font-size: 13px; font-weight: 800; color: var(--mute); }
.count { font: 900 clamp(90px, 24vw, 150px)/1 var(--display); color: var(--a3); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--ink); animation: nbpop .6s ease both; }

.qhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.qtag { display: inline-block; padding: 5px 13px; font-size: 13px; font-weight: 800; background: var(--a2); border: 2.5px solid var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--ink); }
.qcount { display: inline-block; padding: 3px 13px; font: 900 14px var(--display); letter-spacing: .6px; color: var(--ink); background: var(--a3); border: 2.5px solid var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(3deg); }
.qtext { font-size: clamp(1.15rem, 3.4vw, 1.5rem); font-weight: 800; line-height: 1.6; }
.qbar { height: 16px; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: 99px; overflow: hidden; }
.qbar i { display: block; height: 100%; width: 100%; background: var(--a2); border-right: 2.5px solid var(--ink); transition: width .12s linear; }
.qbar i.low { background: repeating-linear-gradient(-45deg, var(--a1) 0 10px, var(--ink) 10px 20px); }

/* সর্ট বাটন: জারণ ← | → বিজারণ */
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.opt { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 84px; padding: 10px 12px; text-align: left; cursor: pointer; font: 900 20px/1.2 var(--body); color: var(--ink); background: var(--a1); border: var(--bw) solid var(--ink); border-radius: 18px; box-shadow: 0 7px 0 var(--ink); transition: transform .1s, box-shadow .1s; }
.opt:nth-child(2) { background: var(--a2); flex-direction: row-reverse; text-align: right; }
.opt:first-child { color: #fff; text-shadow: 1.5px 1.5px 0 var(--ink); }
.opt:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 9px 0 var(--ink); }
.opt:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 1px 0 var(--ink); }
.opt .k { flex: none; display: grid; place-items: center; width: 40px; height: 40px; font: 900 22px var(--display); color: var(--ink); text-shadow: none; background: var(--paper2); border: 2.5px solid var(--ink); border-radius: 50%; }
.opt.right { background: #7ee8b4; color: var(--ink); text-shadow: none; }
.opt.wrong { background: #ff8c9a; color: var(--ink); text-shadow: none; animation: nbshake .35s; }
.opt:disabled { cursor: default; opacity: .9; }
.opt:disabled:not(.right):not(.wrong) { opacity: .6; }
.sm { display: block; font-size: 12px; font-weight: 700; opacity: .9; }
.sm2 { display: block; margin-top: 4px; font-size: 14px; font-weight: 600; color: var(--mute); }
.why { min-height: 52px; padding: 10px 14px; font-size: 14px; line-height: 1.6; font-weight: 600; color: var(--mute); background: var(--paper2); border: 2.5px dashed var(--ink); border-radius: 12px; }
.why b { font-weight: 800; }
.why.good { background: #d5f7e6; color: var(--ink); border-style: solid; } .why.good b { color: var(--good); }
.why.bad { background: #ffe0e4; color: var(--ink); border-style: solid; } .why.bad b { color: var(--bad); }

.cardtxt { padding: 20px 12px; text-align: center; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--ink); font-family: var(--display); font-weight: 800; transform: rotate(-.6deg); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.chip { display: flex; align-items: baseline; gap: 6px; padding: 8px 14px; font-weight: 800; background: var(--paper2); border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); }
.chip b { font: 900 20px var(--display); } .chip span { font-size: 12.5px; color: var(--mute); } .chip em { font-style: normal; font-weight: 900; color: var(--a1); }
.chip.unk { background: var(--a3); transform: rotate(-2deg); } .chip.unk em { color: var(--ink); }
/* ডায়াল */
.dial { display: flex; align-items: center; justify-content: center; gap: 14px; }
.dial .btn { width: 64px; height: 60px; font: 900 30px/1 var(--display); padding: 0; border-radius: 50%; box-shadow: 0 6px 0 var(--ink); }
.dial .btn:first-child { background: var(--a2); } .dial .btn:last-child { background: var(--a1); color: #fff; text-shadow: 1.5px 1.5px 0 var(--ink); }
.dial .btn:hover:not(:disabled) { box-shadow: 0 8px 0 var(--ink); transform: translateY(-2px); }
.dial .btn:active:not(:disabled) { box-shadow: 0 1px 0 var(--ink); transform: translateY(5px); }
.dv { min-width: 124px; text-align: center; padding: 6px 12px 8px; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: 22px 22px 10px 10px; box-shadow: inset 0 -8px 0 var(--a3), 4px 4px 0 var(--ink); }
.dv b { font: 900 34px/1.15 var(--display); font-variant-numeric: tabular-nums; } .dv small { display: block; font-size: 12px; font-weight: 800; color: var(--mute); }
.balance { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; font-size: 12.5px; font-weight: 800; color: var(--mute); background: var(--paper2); border: 2.5px dashed var(--ink); border-radius: 12px; }
.balance b { font: 900 20px var(--display); color: var(--ink); } .balance b.eq { color: var(--good); }
.btn[data-a="lock"] { min-height: 58px; padding: 0 34px; font-size: 18px; border-radius: 16px; box-shadow: 0 7px 0 var(--ink); background: var(--a1); }
.btn[data-a="lock"]:hover:not(:disabled) { box-shadow: 0 9px 0 var(--ink); transform: translateY(-2px); }
.btn[data-a="lock"]:active:not(:disabled) { box-shadow: 0 1px 0 var(--ink); transform: translateY(6px); }

.rules { display: grid; gap: 10px; margin: 0 0 16px; padding: 0; list-style: none; }
.rules li { display: grid; grid-template-columns: 112px 1fr; gap: 10px; font-size: 14px; line-height: 1.6; color: var(--mute); font-weight: 600; }
.rules li > b { align-self: start; justify-self: start; padding: 1px 9px; color: var(--ink); font-weight: 800; background: var(--a3); border: 2px solid var(--ink); border-radius: 7px; }
.rules li:nth-child(even) > b { background: var(--a2); }
.rules li span b { color: var(--ink); font-weight: 800; }
.score { display: grid; gap: 6px; margin: 0 0 16px; font-size: 14px; font-weight: 700; }
.score div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 2px dashed var(--ink); padding-bottom: 6px; }
.sheet .row { justify-content: flex-end; }
.sheet .btn { min-height: 44px; }
@media (max-width: 480px) {
    .box { padding: 12px; }
    .lane { grid-template-columns: 50px 1fr 40px; gap: 6px; }
    .lane-name { font-size: 12px; padding: 1px 6px; }
    .car { font-size: 26px; }
    .opt { font-size: 17px; min-height: 92px; flex-direction: column !important; text-align: center !important; gap: 6px; }
    .rules li { grid-template-columns: 1fr; gap: 3px; }
    .stat b { font-size: 21px; }
    .dial .btn { width: 60px; }
}

    </style>

<body>
    <div class="stage">
        <header class="top">
            <a class="back-btn" href="games.html#adv" aria-label="গেম হাবে ফিরে যাও">←<span class="long">গেম হাব</span></a>
            <div class="titlebox"><b>🏎️ রেডক্স রিয়্যাকশন রেস</b><br><small>Advanced Game</small></div>
            <button class="icon-btn" id="soundBtn" type="button" title="সাউন্ড চালু/বন্ধ" aria-label="সাউন্ড চালু/বন্ধ">🔔</button>
            <button class="icon-btn" id="bgBtn" type="button" title="বাইরের ব্যাকগ্রাউন্ডের রং বদলাও" aria-label="বাইরের ব্যাকগ্রাউন্ডের রং বদলাও">🌓</button>
        </header>

        <main class="stack" id="game">
            <section class="box" id="trackBox">
                <div class="hud">
                    <span class="stat">🔥 স্ট্রিক <b id="sStreak">০</b></span>
                    <span class="stat nitro" id="sNitro" hidden>🔥 নাইট্রো ×১.৫ 🔥</span>
                    <span class="stat">✅ ঠিক<br><b id="sOk">০</b>/<b id="sTotal">০</b></span>
                    <span class="stat">⏱️ <b id="sTime">০.০</b> সে.</span>
                    <button class="btn sp" id="btnRules" type="button">📖 নিয়ম</button>
                </div>
                <div id="lanes">
                    <div class="lane you">
                        <span class="lane-name">তুমি</span>
                        <div class="road"><span class="car" id="carYou" style="--p:0">🏎️</span></div>
                        <span class="pct" id="pctYou">০%</span>
                    </div>
                    <div class="lane ai">
                        <span class="lane-name">রোবট</span>
                        <div class="road"><span class="car" id="carAi" style="--p:0">🚙</span></div>
                        <span class="pct" id="pctAi">০%</span>
                    </div>
                </div>
            </section>

            <section class="box panel" id="panel" aria-live="polite"></section>
        </main>
    </div>
    <p class="credit">Developed &amp; Designed by Ahanaf Abid Omlan</p>

    <div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

    <script>
    (function () {
        'use strict';
        const $ = s => document.querySelector(s);
        const bn = n => Number(n).toLocaleString('bn-BD', { useGrouping: false });
        const bn1 = n => Number(n).toLocaleString('bn-BD', { useGrouping: false, minimumFractionDigits: 1, maximumFractionDigits: 1 });

        let sfx = {};
        try { sfx = NBSound('redox'); } catch (e) { sfx = {}; }
        const snd = n => { try { if (sfx && sfx[n]) sfx[n](); } catch (e) {} };

        $('#bgBtn').addEventListener('click', () => {
            snd('tap');
            const cur = document.documentElement.getAttribute('data-bg');
            const next = cur === '2' ? '3' : cur === '3' ? null : '2';
            if (next) document.documentElement.setAttribute('data-bg', next); else document.documentElement.removeAttribute('data-bg');
            try { localStorage.setItem('redox-bg', next || 'main'); } catch (e) {}
        });

        /* ---------- রেসের টাস্ক (MCQ নয়) ---------- */
        const TYPES = { sort: 'জারণ না বিজারণ? (সর্ট)', oxn: 'জারণ সংখ্যা মেলাও (ব্যালান্স)', elec: 'ইলেকট্রন ব্যালান্স' };
        /* সর্ট: [অর্ধ-বিক্রিয়া, জারণ কি না] */
        const SORTS = [
            ['Zn → Zn²⁺ + 2e⁻', true], ['Cu²⁺ + 2e⁻ → Cu', false], ['Fe²⁺ → Fe³⁺ + e⁻', true], ['Fe³⁺ + e⁻ → Fe²⁺', false],
            ['Cl₂ + 2e⁻ → 2Cl⁻', false], ['2Br⁻ → Br₂ + 2e⁻', true], ['Na → Na⁺ + e⁻', true], ['O₂ + 4e⁻ → 2O²⁻', false],
            ['Mg → Mg²⁺ + 2e⁻', true], ['Ag⁺ + e⁻ → Ag', false], ['Sn²⁺ → Sn⁴⁺ + 2e⁻', true], ['Al → Al³⁺ + 3e⁻', true],
            ['H₂ → 2H⁺ + 2e⁻', true], ['MnO₄⁻ → Mn²⁺\n(Mn: +7 → +2)', false], ['Fe₂O₃ → Fe\n(Fe: +3 → 0)', false],
            ['CO → CO₂\n(C: +2 → +4)', true], ['SO₂ → SO₃\n(S: +4 → +6)', true], ['NO₃⁻ → NO₂\n(N: +5 → +4)', false],
            ['Cl₂ → Cl⁻\n(Cl: 0 → −1)', false], ['Zn → ZnO\n(Zn: 0 → +2)', true]
        ];
        /* জারণ সংখ্যা ব্যালান্স: [সংকেত, চার্জ, [[মৌল, সংখ্যা, জারণ সংখ্যা | null (অজানা)]]] */
        const OXN = [
            ['KMnO₄', 0, [['K', 1, 1], ['Mn', 1, null], ['O', 4, -2]]], ['K₂Cr₂O₇', 0, [['K', 2, 1], ['Cr', 2, null], ['O', 7, -2]]],
            ['H₂SO₄', 0, [['H', 2, 1], ['S', 1, null], ['O', 4, -2]]], ['HNO₃', 0, [['H', 1, 1], ['N', 1, null], ['O', 3, -2]]],
            ['HClO₄', 0, [['H', 1, 1], ['Cl', 1, null], ['O', 4, -2]]], ['Fe₂O₃', 0, [['Fe', 2, null], ['O', 3, -2]]],
            ['CO₂', 0, [['C', 1, null], ['O', 2, -2]]], ['CH₄', 0, [['C', 1, null], ['H', 4, 1]]],
            ['NH₃', 0, [['N', 1, null], ['H', 3, 1]]], ['SO₂', 0, [['S', 1, null], ['O', 2, -2]]],
            ['H₃PO₄', 0, [['H', 3, 1], ['P', 1, null], ['O', 4, -2]]], ['H₂O₂', 0, [['H', 2, 1], ['O', 2, null]]],
            ['MnO₄⁻', -1, [['Mn', 1, null], ['O', 4, -2]]], ['Cr₂O₇²⁻', -2, [['Cr', 2, null], ['O', 7, -2]]],
            ['SO₄²⁻', -2, [['S', 1, null], ['O', 4, -2]]], ['NO₃⁻', -1, [['N', 1, null], ['O', 3, -2]]],
            ['NH₄⁺', 1, [['N', 1, null], ['H', 4, 1]]], ['NaClO₃', 0, [['Na', 1, 1], ['Cl', 1, null], ['O', 3, -2]]],
            ['MnO₂', 0, [['Mn', 1, null], ['O', 2, -2]]], ['CaH₂', 0, [['Ca', 1, 2], ['H', 2, null]]]
        ];
        /* ইলেকট্রন ব্যালান্স: [সমীকরণ (? = ইলেকট্রন সংখ্যা), বাম চার্জ, ডান চার্জ (e⁻ ছাড়া), e⁻ কোন পাশে] */
        const ELEC = [
            ['Zn → Zn²⁺ + ?e⁻', 0, 2, 'R'], ['Fe³⁺ + ?e⁻ → Fe²⁺', 3, 2, 'L'], ['Cu²⁺ + ?e⁻ → Cu', 2, 0, 'L'],
            ['2Cl⁻ → Cl₂ + ?e⁻', -2, 0, 'R'], ['Al → Al³⁺ + ?e⁻', 0, 3, 'R'], ['Na → Na⁺ + ?e⁻', 0, 1, 'R'],
            ['Sn²⁺ → Sn⁴⁺ + ?e⁻', 2, 4, 'R'], ['Ag⁺ + ?e⁻ → Ag', 1, 0, 'L'], ['2H⁺ + ?e⁻ → H₂', 2, 0, 'L'],
            ['MnO₄⁻ + 8H⁺ + ?e⁻ → Mn²⁺ + 4H₂O', 7, 2, 'L'], ['Cr₂O₇²⁻ + 14H⁺ + ?e⁻ → 2Cr³⁺ + 7H₂O', 12, 6, 'L'],
            ['O₂ + 4H⁺ + ?e⁻ → 2H₂O', 4, 0, 'L'], ['Fe → Fe³⁺ + ?e⁻', 0, 3, 'R'], ['Mg → Mg²⁺ + ?e⁻', 0, 2, 'R'],
            ['Fe²⁺ → Fe³⁺ + ?e⁻', 2, 3, 'R']
        ];
        const oxnAns = it => { const fixed = it[2].reduce((s, p) => s + (p[2] === null ? 0 : p[1] * p[2]), 0); const u = it[2].find(p => p[2] === null); return (it[1] - fixed) / u[1]; };
        const elecAns = e => e[3] === 'L' ? e[1] - e[2] : e[2] - e[1];
        const sg = n => (n > 0 ? '+' : n < 0 ? '−' : '') + bn(Math.abs(n));

        const DIFF = {
            easy:   { label: 'সহজ',   speed: 1.3, time: 15 },
            normal: { label: 'মাঝারি', speed: 1.7, time: 12 },
            hard:   { label: 'কঠিন',   speed: 2.2, time: 9 }
        };
        const esc = x => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        /* ---------- অবস্থা ---------- */
        let diff = 'normal';
        try { const d = localStorage.getItem('redox-diff'); if (DIFF[d]) diff = d; } catch (e) {}
        let S = { phase: 'idle' };
        let raceId = 0, ticker = null, queue = [], paused = false, lastT = 0, aiTimer = 0, nextTimeout = null;

        function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
        function bestKey() { return 'redox-best-' + diff; }
        function getBest() { try { const v = parseFloat(localStorage.getItem(bestKey())); return isFinite(v) && v > 0 ? v : null; } catch (e) { return null; } }

        /* ---------- রেন্ডার ---------- */
        function setCars() {
            $('#carYou').style.setProperty('--p', S.you || 0);
            $('#carAi').style.setProperty('--p', S.ai || 0);
            $('#pctYou').textContent = bn(Math.floor(S.you || 0)) + '%';
            $('#pctAi').textContent = bn(Math.floor(S.ai || 0)) + '%';
            const nit = S.phase === 'race' && S.streak >= 3;
            $('#sNitro').hidden = !nit;
            $('#carYou').classList.toggle('boost', nit);
            $('#sStreak').textContent = bn(S.streak || 0);
            $('#sOk').textContent = bn(S.ok || 0);
            $('#sTotal').textContent = bn(S.total || 0);
            $('#sTime').textContent = bn1(S.elapsed || 0);
            $('#lanes').classList.toggle('racing', S.phase === 'race' && !paused);
        }

        function showIdle() {
            const b = getBest();
            const panel = $('#panel');
            panel.innerHTML = '';
            const wrap = document.createElement('div'); wrap.className = 'center';
            wrap.innerHTML = '<h2>🏁 রেস শুরুর জন্য প্রস্তুত?</h2><p>প্রতি রাউন্ডে ছোট একটা টাস্ক: সর্ট করো বা ব্যালান্স মেলাও। ঠিক হলে গাড়ি এগোবে, দ্রুত হলে বেশি। টানা ৩টি ঠিক হলে নাইট্রো বুস্ট!</p>';
            const seg = document.createElement('div'); seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'কঠিনতা');
            Object.keys(DIFF).forEach(k => {
                const bt = document.createElement('button'); bt.type = 'button'; bt.textContent = DIFF[k].label;
                bt.setAttribute('aria-pressed', String(k === diff));
                bt.addEventListener('click', () => { snd('tap'); diff = k; try { localStorage.setItem('redox-diff', k); } catch (e) {} showIdle(); });
                seg.appendChild(bt);
            });
            const row = document.createElement('div'); row.className = 'row';
            const go = document.createElement('button'); go.type = 'button'; go.className = 'btn primary big'; go.id = 'btnStart'; go.textContent = '🚦 রেস শুরু করো';
            go.addEventListener('click', () => { snd('tap'); startRace(); });
            row.appendChild(go);
            const info = document.createElement('div'); info.className = 'best';
            info.textContent = 'প্রতি টাস্কে সর্বোচ্চ ' + bn(DIFF[diff].time) + ' সেকেন্ড' + (b ? ' · সেরা সময় ' + bn1(b) + ' সে.' : '');
            wrap.append(seg, row, info);
            panel.appendChild(wrap);
            S = { phase: 'idle', you: 0, ai: 0, streak: 0, ok: 0, total: 0, elapsed: 0 };
            setCars();
        }

        function showCount(n) {
            const panel = $('#panel');
            panel.innerHTML = '<div class="center"><div class="count">' + (n > 0 ? bn(n) : 'GO!') + '</div></div>';
        }

        function renderQuestion() {
            const q = S.q, panel = $('#panel');
            let h = '<div class="qhead"><span class="qtag">' + TYPES[q.type] + '</span><span class="qcount">TASK ' + bn(S.total + 1) + '</span></div><div class="qbar"><i id="qfill"></i></div>';
            if (q.type === 'sort') {
                h += '<div class="qtext cardtxt" style="white-space:pre-line">' + esc(q.text) + '</div><div class="opts" id="opts">' +
                    '<button type="button" class="opt" data-a="sort:1"><span class="k">←</span><span>জারণ<small class="sm">ইলেকট্রন ত্যাগ</small></span></button>' +
                    '<button type="button" class="opt" data-a="sort:0"><span class="k">→</span><span>বিজারণ<small class="sm">ইলেকট্রন গ্রহণ</small></span></button></div>';
            } else if (q.type === 'oxn') {
                h += '<div class="qtext">' + q.f + '<small class="sm2"> -এ <b>' + esc(q.un) + '</b>-এর জারণ সংখ্যা বসাও যেন যোগফল ঠিক হয়</small></div><div class="chips">';
                q.parts.forEach(p => { h += p[2] === null ? '<div class="chip unk"><b>' + esc(p[0]) + '</b><span>× ' + bn(p[1]) + '</span><em>?</em></div>' : '<div class="chip"><b>' + esc(p[0]) + '</b><span>× ' + bn(p[1]) + '</span><em>' + sg(p[2]) + '</em></div>'; });
                h += '</div>' + dialHtml(q) + '<div class="balance" id="bal">' + balHtml(q) + '</div><div class="row"><button type="button" class="btn primary" data-a="lock">🔒 লক করো</button></div>';
            } else {
                h += '<div class="qtext cardtxt">' + esc(q.text) + '</div>' + dialHtml(q) + '<div class="balance" id="bal">' + balHtml(q) + '</div><div class="row"><button type="button" class="btn primary" data-a="lock">🔒 লক করো</button></div>';
            }
            h += '<div class="why" id="why">' + (q.type === 'sort' ? 'জারণ = ইলেকট্রন ছাড়া। বিজারণ = ইলেকট্রন নেওয়া।' : 'বাটন চেপে মান বদলাও, মিটার সমান হলেই লক করো।') + '</div>';
            panel.innerHTML = h;
        }
        function dialHtml(q) { return '<div class="dial"><button type="button" class="btn" data-a="dial:-1">−</button><div class="dv"><b id="dval">' + sg(q.val) + '</b><small>' + (q.type === 'oxn' ? 'জারণ সংখ্যা' : 'ইলেকট্রন') + '</small></div><button type="button" class="btn" data-a="dial:1">+</button></div>'; }
        function balHtml(q) {
            if (q.type === 'oxn') { const t = q.fixed + q.ucount * q.val; return '<span>মোট জারণ সংখ্যা</span><b class="' + (t === q.charge ? 'eq' : '') + '">' + sg(t) + '</b><span>লক্ষ্য (চার্জ) ' + sg(q.charge) + '</span>'; }
            const L = q.lc - (q.side === 'L' ? q.val : 0), R = q.rc - (q.side === 'R' ? q.val : 0);
            return '<span>বাম পাশের চার্জ</span><b class="' + (L === R ? 'eq' : '') + '">' + sg(L) + ' ' + (L === R ? '=' : '≠') + ' ' + sg(R) + '</b><span>ডান পাশের চার্জ</span>';
        }
        function dialMove(d) {
            if (S.phase !== 'race' || S.locked || paused || !S.q || S.q.type === 'sort') return;
            const q = S.q; q.val = Math.max(q.type === 'oxn' ? -8 : 0, Math.min(q.type === 'oxn' ? 8 : 12, q.val + d));
            const dv = $('#dval'); if (dv) dv.textContent = sg(q.val);
            const bal = $('#bal'); if (bal) bal.innerHTML = balHtml(q);
        }
        function lockIn() {
            if (S.phase !== 'race' || S.locked || paused || !S.q || S.q.type === 'sort') return;
            const q = S.q; resolve(q.val === q.ans, q.why);
        }
        function sortPick(ox) {
            if (S.phase !== 'race' || S.locked || paused || !S.q || S.q.type !== 'sort') return;
            const q = S.q; resolve(!!ox === q.ox, q.why);
        }
        $('#panel').addEventListener('click', e => {
            const t = e.target && e.target.closest ? e.target.closest('[data-a]') : null; if (!t) return;
            const a = t.getAttribute('data-a');
            if (a.indexOf('sort:') === 0) sortPick(a.slice(5) === '1');
            else if (a.indexOf('dial:') === 0) { snd('tap'); dialMove(parseInt(a.slice(5), 10)); }
            else if (a === 'lock') { snd('tap'); lockIn(); }
        });

        /* ---------- রেসের প্রবাহ ---------- */
        function startRace() {
            raceId++;
            const id = raceId;
            clearInterval(ticker); clearTimeout(nextTimeout);
            S = { phase: 'count', you: 0, ai: 0, streak: 0, best: 0, ok: 0, total: 0, elapsed: 0, q: null, locked: true, qLeft: 0 };
            paused = false; aiTimer = 0;
            setCars();
            const seq = [3, 2, 1, 0];
            let i = 0;
            (function step() {
                if (id !== raceId) return;
                showCount(seq[i]); snd(seq[i] === 0 ? 'pop' : 'tap');
                if (seq[i] === 0) {
                    nextTimeout = setTimeout(() => { if (id !== raceId) return; S.phase = 'race'; lastT = performance.now(); ticker = setInterval(tick, 100); askNext(); }, 600);
                    return;
                }
                i++;
                nextTimeout = setTimeout(step, 750);
            })();
        }

        function askNext() {
            if (S.phase !== 'race') return;
            const r = Math.random(), kind = r < 0.4 ? 'sort' : r < 0.7 ? 'oxn' : 'elec';
            let q;
            if (kind === 'sort') {
                const it = pickFrom('sort', SORTS);
                q = { type: 'sort', text: it[0], ox: it[1], mult: 0.6,
                    why: it[1] ? 'ইলেকট্রন ছাড়ে বা জারণ সংখ্যা বাড়ে, তাই জারণ।' : 'ইলেকট্রন নেয় বা জারণ সংখ্যা কমে, তাই বিজারণ।' };
            } else if (kind === 'oxn') {
                const it = pickFrom('oxn', OXN), u = it[2].find(p => p[2] === null), ans = oxnAns(it);
                const fixed = it[2].reduce((s, p) => s + (p[2] === null ? 0 : p[1] * p[2]), 0);
                q = { type: 'oxn', f: it[0], un: u[0], parts: it[2], charge: it[1], fixed, ucount: u[1], ans, val: 0, mult: 1,
                    why: u[0] + '-এর জারণ সংখ্যা ' + sg(ans) + ' (' + bn(fixed) + ' + ' + bn(u[1]) + ' × x = ' + bn(it[1]) + ' থেকে)।' };
            } else {
                const it = pickFrom('elec', ELEC), ans = elecAns(it);
                q = { type: 'elec', text: it[0], lc: it[1], rc: it[2], side: it[3], ans, val: 0, mult: 1,
                    why: (it[3] === 'R' ? 'ইলেকট্রন ছাড়ছে, এটি জারণ' : 'ইলেকট্রন নিচ্ছে, এটি বিজারণ') + '। ' + bn(ans) + 'টি ইলেকট্রনে দুই পাশের চার্জ সমান হয়।' };
            }
            S.q = q; S.locked = false;
            S.qMax = DIFF[diff].time * q.mult; S.qLeft = S.qMax;
            renderQuestion();
            setCars();
        }
        const pools = {};
        function pickFrom(k, arr) { if (!pools[k] || !pools[k].length) pools[k] = shuffle(arr.map((_, i) => i)); return arr[pools[k].pop()]; }

        function tick() {
            if (S.phase !== 'race') return;
            const now = performance.now();
            let dt = (now - lastT) / 1000; lastT = now;
            if (paused) return;
            if (dt > 0.25) dt = 0.25;
            S.elapsed += dt;
            aiTimer -= dt;
            if (aiTimer <= 0) { S.aiMul = 0.8 + Math.random() * 0.4; aiTimer = 1; }
            S.ai = Math.min(100, S.ai + DIFF[diff].speed * (S.aiMul || 1) * dt);
            if (!S.locked) {
                S.qLeft -= dt;
                const f = $('#qfill');
                if (f) { f.style.width = Math.max(0, S.qLeft / S.qMax * 100) + '%'; f.classList.toggle('low', S.qLeft / S.qMax < 0.3); }
                if (S.qLeft <= 0) timeUp();
            }
            setCars();
            if (S.ai >= 100 && S.phase === 'race') finish(false);
        }

        function timeUp() { resolve(false, S.q ? S.q.why : '', true); }
        function resolve(ok, whyText, timeout) {
            if (S.phase !== 'race' || S.locked) return;
            S.locked = true;
            const q = S.q;
            S.total++;
            const why = $('#why');
            const id = raceId;
            if (ok) {
                snd('ok'); S.ok++; S.streak++; if (S.streak > S.best) S.best = S.streak;
                const bonus = (q.type === 'sort' ? 3 : 4) * Math.max(0, S.qLeft) / S.qMax;
                let gain = (q.type === 'sort' ? 6 : 11) + bonus;
                const nit = S.streak >= 3;
                if (nit) gain *= 1.5;
                S.you = Math.min(100, S.you + gain);
                if (why) { why.className = 'why good'; why.innerHTML = '<b>✅ সঠিক! +' + bn(Math.round(gain)) + '%' + (nit ? ' (নাইট্রো)' : '') + '</b> '; why.appendChild(document.createTextNode(whyText)); }
            } else {
                snd('bad'); S.streak = 0;
                if (why) { why.className = 'why bad'; why.innerHTML = '<b>' + (timeout ? '⏰ সময় শেষ!' : '❌ ভুল!') + '</b> '; why.appendChild(document.createTextNode(whyText)); }
            }
            document.querySelectorAll('#opts .opt').forEach(b => { b.disabled = true; });
            setCars();
            if (S.you >= 100) { nextTimeout = setTimeout(() => { if (id === raceId) finish(true); }, 700); return; }
            nextTimeout = setTimeout(() => { if (id === raceId) askNext(); }, ok ? 1000 : 2200);
        }

        function finish(won) {
            if (S.phase === 'over') return;
            S.phase = 'over';
            clearInterval(ticker); clearTimeout(nextTimeout);
            const t = S.elapsed;
            let newBest = false;
            if (won) { const b = getBest(); if (!b || t < b) { newBest = true; try { localStorage.setItem(bestKey(), String(t)); } catch (e) {} } }
            const acc = S.total ? Math.round(S.ok / S.total * 100) : 0;
            setCars();
            snd(won ? 'win' : 'lose');
            $('#panel').innerHTML = '<div class="center"><h2>' + (won ? '🏆 তুমি জিতেছ!' : '🤖 রোবট আগে পৌঁছে গেছে') + '</h2><p>' + (won ? 'দারুণ! জারণ-বিজারণে তোমার দখল পাকা।' : 'আরেকটু দ্রুত আর নির্ভুল হও, পরের বার জিতবে!') + '</p></div>';
            openModal('<h2>' + (won ? '🏆 জয়!' : '🏁 রেস শেষ') + '</h2><div class="score">' +
                '<div><span>ফলাফল</span><span>' + (won ? 'তুমি জিতেছ' : 'রোবট জিতেছে') + '</span></div>' +
                '<div><span>সময়</span><span>' + bn1(t) + ' সে.' + (newBest ? ' · নতুন সেরা! 🎉' : '') + '</span></div>' +
                '<div><span>সঠিক উত্তর</span><span>' + bn(S.ok) + '/' + bn(S.total) + ' (' + bn(acc) + '%)</span></div>' +
                '<div><span>সর্বোচ্চ স্ট্রিক</span><span>' + bn(S.best) + '</span></div>' +
                '<div><span>কঠিনতা</span><span>' + DIFF[diff].label + '</span></div></div>' +
                '<div class="row"><button class="btn" id="mHome" type="button">মেনু</button><button class="btn primary" id="mAgain">🔄 আবার খেলো</button></div>');
            $('#mAgain').onclick = () => { closeModal(); startRace(); };
            $('#mHome').onclick = () => { closeModal(); showIdle(); };
        }

        /* ---------- মডাল ও বিরতি ---------- */
        function openModal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; }
        function closeModal() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; }
        function setPaused(p) { paused = p; if (!p) lastT = performance.now(); setCars(); }

        function rulesModal() {
            const racing = S.phase === 'race';
            if (racing) setPaused(true);
            openModal('<h2>📖 নিয়ম ও চিটশিট</h2><ul class="rules">' +
                '<li><b>লক্ষ্য</b><span>রোবটের আগে ফিনিশ লাইনে (১০০%) পৌঁছাও।</span></li>' +
                '<li><b>সর্ট</b><span>অর্ধ-বিক্রিয়াটি জারণ (ইলেকট্রন ছাড়া) না বিজারণ (ইলেকট্রন নেওয়া), ← বা → দিয়ে বেছে নাও।</span></li>' +
                '<li><b>জারণ সংখ্যা</b><span>অজানা মৌলের মান + / − দিয়ে বদলাও যেন মোট জারণ সংখ্যা যৌগের চার্জের সমান হয়, তারপর লক করো।</span></li>' +
                '<li><b>ইলেকট্রন</b><span>? এর জায়গায় ইলেকট্রন সংখ্যা বসাও যেন দুই পাশের চার্জ সমান হয়।</span></li>' +
                '<li><b>এগোনো</b><span>ঠিক হলে গাড়ি এগোয়, দ্রুত হলে বেশি। ভুল বা সময় শেষ হলে এগোয় না।</span></li>' +
                '<li><b>নাইট্রো</b><span>টানা ৩টি ঠিক উত্তরে এগোনো ×১.৫ হয়ে যায়। ভুল হলেই নাইট্রো শেষ।</span></li>' +
                '<li><b>OIL RIG</b><span><b>O</b>xidation <b>I</b>s <b>L</b>oss, <b>R</b>eduction <b>I</b>s <b>G</b>ain। জারণ মানে ইলেকট্রন ত্যাগ, বিজারণ মানে ইলেকট্রন গ্রহণ।</span></li>' +
                '<li><b>জারক</b><span>যে ইলেকট্রন নেয়, নিজে বিজারিত হয়, জারণ সংখ্যা কমে।</span></li>' +
                '<li><b>বিজারক</b><span>যে ইলেকট্রন ছাড়ে, নিজে জারিত হয়, জারণ সংখ্যা বাড়ে।</span></li>' +
                '<li><b>জারণ সংখ্যার নিয়ম</b><span>মুক্ত মৌল = 0। H সাধারণত +1। O সাধারণত −2 (পারক্সাইডে −1)। যৌগে সব জারণ সংখ্যার যোগফল = 0, আয়নে = আয়নের চার্জ।</span></li>' +
                '</ul><div class="row"><button class="btn primary" id="rClose">বুঝেছি' + (racing ? ', রেস চালাও' : '') + '</button></div>');
            $('#rClose').onclick = () => { closeModal(); if (racing) setPaused(false); };
        }
        $('#btnRules').addEventListener('click', () => { snd('tap'); rulesModal(); });

        /* কীবোর্ড: সর্ট — ← / → ; ব্যালান্স — ↑ ↓ বা + − , Enter = লক */
        document.addEventListener('keydown', e => {
            if (!$('#modal').hidden) return;
            if (S.phase === 'race' && !S.locked && S.q) {
                const k = e.key;
                if (S.q.type === 'sort') {
                    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); sortPick(true); }
                    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); sortPick(false); }
                } else if (k === 'ArrowUp' || k === '+' || k === '=') { e.preventDefault(); dialMove(1); }
                else if (k === 'ArrowDown' || k === '-') { e.preventDefault(); dialMove(-1); }
                else if (k === 'Enter') { e.preventDefault(); lockIn(); }
            } else if (S.phase === 'idle' && e.key === 'Enter' && document.activeElement && document.activeElement.tagName !== 'BUTTON') {
                startRace();
            }
        });
        document.addEventListener('visibilitychange', () => { if (document.hidden && S.phase === 'race' && $('#modal').hidden) { rulesModalPause(); } });
        function rulesModalPause() { setPaused(true); openModal('<h2>⏸️ রেস থেমে আছে</h2><div class="row"><button class="btn primary" id="rResume">▶️ চালিয়ে যাও</button></div>'); $('#rResume').onclick = () => { closeModal(); setPaused(false); }; }

        showIdle();
    })();
    </script>
</body>
</html>
