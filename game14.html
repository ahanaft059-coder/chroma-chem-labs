    <style>
/* ===== NB KIT: sticker / neo-brutalist দৃশ্যরূপ =====
   প্রতিটি গেম নিজের :root-এ এই টোকেনগুলো বদলে নিজস্ব রং পায়:
   --o1 --o2 --o3 (বাইরের ব্যাকগ্রাউন্ড), --paper (বোর্ড), --paper2, --ink, --a1 --a2 --a3 (অ্যাকসেন্ট)  */
:root {
    color-scheme: light;
    --o1: #ff6b4a; --o2: #ffd23f; --o3: #5ad1c4;
    --paper: #fff8ec; --paper2: #ffffff; --ink: #1d1030; --mute: #6a5f80;
    --a1: #ff6b4a; --a2: #2ec4b6; --a3: #ffd23f; --good: #12a36b; --bad: #e5384d;
    --bw: 3px; --rad: 16px; --sh: 5px;
    --display: 'Bricolage Grotesque','Hind Siliguri',system-ui,sans-serif;
    --body: 'Hind Siliguri','Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
    --pat: radial-gradient(rgba(29,16,48,.20) 1.4px, transparent 1.6px);
    --pat-size: 22px 22px;
}
:root[data-bg="2"] { --o1: #2ec4b6; --o2: #c9f2ee; --o3: #ff6b4a; }
:root[data-bg="3"] { --o1: #a78bfa; --o2: #ffd6f0; --o3: #ffd23f; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--body); font-weight: 500; line-height: 1.55;
    padding: 18px max(14px, env(safe-area-inset-right, 0px)) 30px max(14px, env(safe-area-inset-left, 0px));
    background-color: var(--o1);
    background-image: var(--pat), radial-gradient(circle at 12% 6%, var(--o2) 0, transparent 46%), radial-gradient(circle at 94% 96%, var(--o3) 0, transparent 50%);
    background-size: var(--pat-size), 100% 100%, 100% 100%;
    background-attachment: fixed; transition: background-color .4s; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

.stage { max-width: 860px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 24px; box-shadow: 9px 9px 0 var(--ink); }
.credit { width: fit-content; max-width: 100%; margin: 18px auto 0; padding: 6px 14px; text-align: center; font-size: 12.5px; font-weight: 700; letter-spacing: .3px; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--ink); }

/* উপরের বার */
.top { display: flex; align-items: center; gap: 10px; }
.titlebox { margin-right: auto; min-width: 0; }
.titlebox b { display: inline-block; padding: 3px 12px; font: 800 clamp(1.05rem, 3.6vw, 1.35rem)/1.3 var(--display); color: var(--ink); background: var(--a3); border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-1.2deg); }
.titlebox small { display: block; margin: 5px 0 0 4px; font-size: 12px; font-weight: 700; color: var(--mute); }
.btn, .back-btn, .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 14px;
    font: 800 14px/1 var(--body); text-decoration: none; cursor: pointer; color: var(--ink); background: var(--paper2);
    border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s, background .12s;
}
.btn:hover:not(:disabled), .back-btn:hover, .icon-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:active:not(:disabled), .back-btn:active, .icon-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: 2px 2px 0 var(--ink); }
.btn.primary { background: var(--a1); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
.btn.alt { background: var(--a2); }
.btn.big { min-height: 54px; padding: 0 26px; font-size: 17px; border-radius: 14px; }
.icon-btn { width: 42px; padding: 0; font-size: 17px; }

/* পিল, ক্যাপসুল, কার্ড */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; font-size: 13px; font-weight: 800; color: var(--ink); background: var(--paper2); border: 2.5px solid var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--ink); }
.pill b { font-variant-numeric: tabular-nums; }
.box { padding: 14px; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: var(--rad); box-shadow: 5px 5px 0 var(--ink); }
.sticker { display: inline-block; padding: 3px 11px; font-size: 12px; font-weight: 800; color: var(--ink); background: var(--a3); border: 2.5px solid var(--ink); border-radius: 8px; transform: rotate(-2deg); }
.meter { height: 16px; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 100%; background: var(--a1); border-right: 2.5px solid var(--ink); transition: width .25s ease; }
.hazard { height: 12px; border: 2.5px solid var(--ink); border-radius: 6px; background: repeating-linear-gradient(-45deg, var(--a3) 0 10px, var(--ink) 10px 20px); }

/* মডাল */
.modal { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; padding: 16px; background: rgba(29,16,48,.58); }
.sheet { width: min(500px, 100%); max-height: 92%; overflow: auto; padding: 22px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 22px; box-shadow: 9px 9px 0 var(--ink); }
.sheet h2 { margin: 6px 0 10px; font: 800 22px/1.35 var(--display); }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 18px); transform: translateX(-50%); z-index: 3500; padding: 8px 16px; font-size: 15px; font-weight: 800; color: var(--ink); background: var(--a3); border: var(--bw) solid var(--ink); border-radius: 99px; box-shadow: 4px 4px 0 var(--ink); opacity: 0; pointer-events: none; }
.toast.on { animation: nbtoast 1.7s ease forwards; }
@keyframes nbtoast { 0% { opacity: 0; transform: translate(-50%, -10px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@keyframes nbshake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes nbpop { from { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }

    <script>
/* ===== NB SOUND: শূন্য-নির্ভরতার WebAudio সাউন্ড ইফেক্ট =====
   ব্যবহার: const sfx = NBSound('গেমের-কী'); sfx.ok(); sfx.bad(); sfx.win(); sfx.lose(); sfx.tap(); sfx.pop();
   বাটন: #soundBtn থাকলে সেটি নিজে নিজে 🔔/🔕 টগল করে (localStorage '<কী>-sound') */
function NBSound(key) {
    let on = true, ac = null;
    try { on = localStorage.getItem(key + '-sound') !== '0'; } catch (e) {}
    function tone(f, t0, dur, type, vol) {
        if (!on) return;
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
            const t = ac.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .03);
        } catch (e) {}
    }
    const api = {
        ok() { tone(660, 0, .12); tone(880, .1, .16); },
        bad() { tone(220, 0, .2, 'sawtooth', .1); tone(160, .14, .26, 'sawtooth', .1); },
        tap() { tone(520, 0, .06, 'triangle', .1); },
        pop() { tone(440, 0, .08, 'square', .06); tone(740, .06, .1, 'square', .06); },
        win() { tone(523, 0, .12); tone(659, .12, .12); tone(784, .24, .12); tone(1047, .36, .3); },
        lose() { tone(392, 0, .2); tone(330, .2, .2); tone(262, .4, .4); },
        get on() { return on; },
        toggle() { on = !on; try { localStorage.setItem(key + '-sound', on ? '1' : '0'); } catch (e) {} paint(); if (on) api.ok(); }
    };
    function paint() { const b = document.getElementById('soundBtn'); if (b) b.textContent = on ? '🔔' : '🔕'; }
    document.addEventListener('DOMContentLoaded', () => { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } });
    if (document.readyState !== 'loading') { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } }
    return api;
}

(function () {
'use strict';
let sfx; try { sfx = NBSound('solu'); } catch (e) { sfx = { ok() {}, bad() {}, tap() {}, pop() {}, win() {}, lose() {}, toggle() {} }; }
const $ = s => document.querySelector(s);
const bn = n => Number(n).toLocaleString('bn-BD', { useGrouping: false });
const fx = (n, d) => Number(n).toLocaleString('bn-BD', { useGrouping: false, minimumFractionDigits: d, maximumFractionDigits: d });
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

   knob: { n: '🧴 NaOH এর আয়তন', u: ' mL', min: 0, max: 300, step: 0.1, v: 100 }, M: x => Math.max(0, (0.5 * x - 60) / (100 + x)), target: 0.05, given: 'H₂SO₄: ১০০ mL × ০.৩০ M, NaOH ০.৫০ M',
   cell3: x => ['মোট আয়তন', bn(100 + x) + ' mL'],
   hint: '',
   learn: 'H⁺ মোল = ২ × ০.৩০ × ১০০ = ৬০ mmol। NaOH = ০.৫x mmol। বাড়তি OH⁻ = (০.৫x − ৬০) ÷ (১০০ + x) = ০.০৫ ⇒ x ≈ ১৪৪.৪ mL। দুই-প্রোটিক অ্যাসিড ও অতিরিক্ত ক্ষার একসাথে!' }
];
const CAS = [0.084, 0.072, 0.096, 0.112, 0.068];
const dd = () => L().d != null ? L().d : 2; const un = () => L().un || 'M';
const S = { lv: 0, h0: 2, v: 0, hints: 2, tries: 0, miss: 0, done: false, fired: false, vol: 0, ca: 0.084, phase: 0, roughs: 0, rough: null, over: false };
let stars = {}; try { stars = JSON.parse(lsGet('solu-stars') || '{}') || {}; } catch (e) { stars = {}; }
const unlocked = i => i === 0 || stars[i - 1] > 0;
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const L = () => LEVELS[S.lv];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function ph() { const nA = 25 * S.ca * (L().k || 1) / 1000, nB = S.vol * 0.1 / 1000, vt = (25 + S.vol) / 1000, d = (nA - nB) / vt; return d > 1e-9 ? -Math.log10(d) : d < -1e-9 ? 14 + Math.log10(-d) : 7; }
const pink = () => clamp((ph() - 8.2) / 1.6, 0, 1);
const ve = () => 25 * S.ca * (L().k || 1) / 0.1;
const okCalc = () => { const l = L(); return Math.abs(l.M(S.v) - l.target) <= l.tol * l.target; };

function renderTabs() { $('#lv').innerHTML = LEVELS.map((l, i) => '<button class="lvb' + (i === S.lv ? ' on' : '') + '" data-lv="' + i + '"' + (unlocked(i) ? '' : ' disabled') + '><b>' + (unlocked(i) ? l.icon : '🔒') + ' ' + l.name + '</b><small>' + l.sub + '</small>' + (stars[i] ? '<i>' + starStr(stars[i]) + '</i>' : '') + '</button>').join(''); const on = $('#lv .on'); if (on) { const c = $('#lv'); c.scrollLeft = Math.max(0, on.offsetLeft - c.clientWidth / 2 + on.offsetWidth / 2); } }
function start(i) {
    S.lv = i; const l = L(); S.h0 = l.h != null ? l.h : 2; S.hints = S.h0; S.tries = 0; S.miss = 0; S.done = false; S.fired = false; S.vol = 0; S.phase = 0; S.roughs = 0; S.rough = null; S.over = false;
    if (l.titr) { const cl = l.cas || CAS; S.ca = cl[Math.floor(Math.random() * cl.length)]; S.v = l.sl ? (l.sl[0] + l.sl[1]) / 2 : 0.1; } else S.v = l.knob.v;
    renderTabs(); $('#job').innerHTML = '<span class="sticker">লেভেল ' + bn(i + 1) + ' / ' + bn(LEVELS.length) + '</span><h2>' + l.icon + ' ' + l.name + ' — ' + l.sub + '</h2><p>' + l.intro + '</p>';
    $('#shift').innerHTML = l.titr ? '🧫 ব্যুরেটের বাটন চেপে NaOH ঢালো। রং দেখো!' : (l.blind ? '🧮 আগে খাতায় হিসাব করো, তারপর স্লাইডার সেট করে পরীক্ষা চালাও।' : 'স্লাইডার নাড়িয়ে মোলারিটির পরিবর্তন দেখো।');
    render();
}
function bench() {
    const l = L();
    if (l.titr) {
        const a = pink();
        $('#bench').innerHTML = '<div class="glass"><div class="bur"><i style="height:' + (S.vol / 50 * 100) + '%"></i><em></em></div><div class="cap">ব্যুরেট (০.১০০ M NaOH)<br><b>' + fx(S.vol, 2) + ' mL</b> ব্যবহৃত</div></div>' +
            '<div class="glass"><div class="bk"><i style="height:62%;background:' + (a > 0 ? 'rgba(255,60,150,' + (0.15 + 0.8 * a).toFixed(2) + ')' : '#e8f4ff') + '"></i></div><div class="cap">কনিক্যাল ফ্লাস্ক: ২৫ mL ' + (l.acid || 'HCl') + ' + ফেনলফথ্যালিন<br>' + (a > 0.05 ? '🌸 গোলাপি!' : 'বর্ণহীন') + '</div></div>';
        $('#ro').innerHTML = '<div><small>ব্যুরেট (mL)</small><b>' + fx(S.vol, 2) + '</b></div><div><small>রাফ রিডিং</small><b>' + (S.rough == null ? '—' : fx(S.rough, 1)) + '</b></div><div><small>চেষ্টা</small><b>' + bn(S.roughs + (S.phase ? 0 : 0)) + '</b></div>';
        return;
    }
    const m = l.M(S.v), hide = l.blind && !S.fired;
    const fill = l.vol ? 70 : clamp((200 + S.v) / 600 * 100, 30, 90);
    const dens = clamp(m / (l.dmax || 2), 0.05, 1); const c3 = l.cell3 ? l.cell3(S.v) : [l.vol ? 'আয়তন' : 'মোট আয়তন', (l.vol ? bn(l.vol) : bn(200 + S.v)) + ' mL'];
    $('#bench').innerHTML = '<div class="glass"><div class="bk"><i style="height:' + fill + '%;background:' + l.color + ';opacity:' + (0.35 + 0.65 * dens).toFixed(2) + '"></i><em></em></div><div class="cap">' + (l.vol ? 'ফ্লাস্ক ' + bn(l.vol) + ' mL' : 'মিশ্রণ পাত্র') + '</div></div>' +
        '<div class="glass" style="justify-content:center"><div style="font-size:52px">' + l.icon + '</div><div class="cap">' + l.knob.n + '<br><b style="font-size:20px">' + fx(S.v, l.knob.step < 0.1 ? 2 : (l.knob.step < 1 ? 1 : 0)) + l.knob.u + '</b></div></div>';
    $('#ro').innerHTML = '<div class="' + (hide ? 'hid' : '') + '"><small>' + (l.lab || 'মোলারিটি (M)') + '</small><b>' + (hide ? '???' : fx(m, dd() + 1)) + '</b></div><div><small>লক্ষ্য</small><b>' + fx(l.target, dd()) + '</b></div><div><small>' + c3[0] + '</small><b>' + c3[1] + '</b></div>';
}
function render() {
    const l = L();
    $('#sTry').textContent = bn(S.tries); $('#sHint').textContent = bn(S.hints); $('#btnHint').disabled = S.hints <= 0 || S.done; $('#btnHint').hidden = S.h0 === 0;
    bench();
    if (l.titr) {
        $('#pMode').textContent = S.phase ? '🧮 হিসাব' : '🧫 টাইট্রেশন';
        if (!S.phase) {
            $('#panel').innerHTML = '<div class="ctl" style="grid-column:1/-1"><label><span>💧 ব্যুরেট নিয়ন্ত্রণ</span></label><div class="drops"><button class="btn" data-add="5">+৫ mL</button><button class="btn" data-add="1">+১ mL</button><button class="btn" data-add="0.1">+০.১ mL</button><button class="btn" data-add="0.05">১ ফোঁটা</button></div></div>';
            $('#btnGo').textContent = '🛑 এন্ডপয়েন্ট পেয়েছি'; $('#info').innerHTML = '🎯 লক্ষ্য: প্রথম স্থায়ী ফিকে গোলাপি রঙে থামো (অতিরিক্ত > ০.১ mL হলে ফেল)।';
        } else {
            $('#panel').innerHTML = '<div class="ctl" style="grid-column:1/-1"><label for="kn"><span>🧮 ' + (l.acid || 'HCl') + ' এর মোলারিটি</span><output id="ko">' + fx(S.v, 3) + ' M</output></label><input type="range" id="kn" min="' + (l.sl ? l.sl[0] : 0.05) + '" max="' + (l.sl ? l.sl[1] : 0.15) + '" step="0.001" value="' + S.v + '"></div>';
            $('#btnGo').textContent = '✅ মোলারিটি জমা দাও'; $('#info').innerHTML = 'এন্ডপয়েন্ট রিডিং: <b>' + fx(S.vol, 2) + ' mL</b> NaOH (০.১০০ M) · ' + (l.acid || 'HCl') + ' = ২৫.০ mL';
        }
        return;
    }
    $('#pMode').textContent = l.blind ? '🙈 অন্ধ (হিসাব করো)' : '👀 লাইভ';
    $('#btnGo').textContent = l.blind ? '🔥 পরীক্ষা চালাও' : '✅ যাচাই করো';
    const k = l.knob;
    $('#panel').innerHTML = '<div class="ctl" style="grid-column:1/-1"><label for="kn"><span>' + k.n + '</span><output id="ko">' + fx(S.v, k.step < 0.1 ? 2 : (k.step < 1 ? 1 : 0)) + k.u + '</output></label><input type="range" id="kn" min="' + k.min + '" max="' + k.max + '" step="' + k.step + '" value="' + S.v + '"></div>';
    $('#info').innerHTML = '🎯 লক্ষ্য: <b>' + fx(l.target, dd()) + ' ' + un() + '</b> (±' + bn(Math.round(l.tol * 100)) + '%) · দেওয়া আছে: ' + l.given + (!l.blind ? ' · এখন: <b>' + fx(l.M(S.v), dd() + 1) + ' ' + un() + '</b>' + (okCalc() ? ' ✔' : '') : (S.fired ? ' · শেষ পরীক্ষায়: <b>' + fx(l.M(S.v), dd() + 1) + ' ' + un() + '</b>' : ''));
}
function finish() {
    S.done = true; sfx.win(); const l = L(); const score = S.miss + 2 * (S.h0 - S.hints); const st = score <= 1 ? 3 : score <= 3 ? 2 : 1;
    if (!stars[S.lv] || st > stars[S.lv]) { stars[S.lv] = st; lsSet('solu-stars', JSON.stringify(stars)); }
    renderTabs(); render(); const last = S.lv === LEVELS.length - 1;
    $('#sheet').innerHTML = '<div class="stars">' + starStr(st) + '</div><h2>' + l.icon + ' ' + l.name + ' — সফল!</h2><p>পরীক্ষা: <b>' + bn(S.tries) + '</b> · সূত্র দেখেছ: <b>' + bn(S.h0 - S.hints) + '</b></p><div class="learn">🧠 ' + l.learn + '</div><div class="row">' +
        (last ? '' : '<button class="btn primary big" data-act="next">পরের লেভেল ▶</button>') + '<button class="btn" data-act="again">↺ আবার</button><button class="btn" data-act="close">বন্ধ করো</button></div>';
    $('#modal').hidden = false;
}
function add(dv) {
    if (S.done || S.phase || S.over) return; const l = L();
    S.vol = Math.min(50, +(S.vol + dv).toFixed(2)); sfx.tap();
    if (pink() > 0.05 && !S.phase) {
        /* গোলাপি এসে গেছে: রাফ ভুল না এন্ডপয়েন্ট নিজে বেছে নিতে হবে — অতিরিক্ত বেশি হলে স্বয়ংক্রিয় ফেল */
        if (S.vol - ve() > 0.12) {
            S.roughs++; S.rough = S.vol; if (S.roughs > 1) S.miss++; sfx.bad(); S.tries++;
            $('#shift').innerHTML = '🌸 অতিরিক্ত NaOH! রাফ রিডিং ≈ <b>' + fx(S.rough, 1) + ' mL</b>। নতুন নমুনা নাও — এবার ' + fx(Math.max(0, S.rough - 3), 0) + ' mL পর্যন্ত দ্রুত, তারপর ফোঁটায় ফোঁটায় দাও।';
            S.vol = 0; render(); return;
        }
    }
    render();
}
function go() {
    if (S.done) return; const l = L();
    if (l.titr) {
        if (!S.phase) {
            S.tries++;
            if (pink() > 0.05 && S.vol - ve() <= 0.12) { S.phase = 1; S.v = 0.1; sfx.ok(); $('#shift').innerHTML = '✔ নিখুঁত এন্ডপয়েন্ট! এবার হিসাব করো।'; }
            else { S.roughs++; if (S.roughs > 1) S.miss++; sfx.bad(); S.rough = S.vol; $('#shift').innerHTML = pink() > 0.05 ? '🌸 অনেক বেশি ঢেলেছ — রাফ রিডিং ≈ ' + fx(S.vol, 1) + ' mL। নতুন নমুনায় ফোঁটায় ফোঁটায় দাও।' : '⚪ এখনো গোলাপি হয়নি, আরও NaOH দাও।'; if (pink() > 0.05) S.vol = 0; }
            render(); return;
        }
        S.tries++; if (Math.abs(S.v - S.ca) <= L().tol * S.ca) { finish(); return; }
        S.miss++; sfx.bad(); $('#shift').innerHTML = '❌ হিসাব মেলেনি। সূত্র: M(NaOH)×V(NaOH) = ' + (L().k || 1) + '×M(অ্যাসিড)×২৫ — এন্ডপয়েন্টের রিডিংটা ঠিকভাবে বসাও।'; render(); return;
    }
    S.tries++; S.fired = true;
    if (okCalc()) { finish(); return; }
    S.miss++; sfx.bad(); const m = l.M(S.v);
    $('#shift').innerHTML = '❌ ফলাফল <b>' + fx(m, dd() + 1) + ' ' + un() + '</b> — লক্ষ্য ' + fx(l.target, dd()) + ' ' + un() + '। ' + (m > l.target ? 'বেশি ঘন হয়েছে, ' : 'পাতলা হয়েছে, ') + 'আবার হিসাব মেলাও।'; render();
}
document.addEventListener('input', e => { if (e.target.id === 'kn') { S.v = +e.target.value; if (L().blind) S.fired = false; render(); sfx.tap(); } });
document.addEventListener('click', e => {
    const t = e.target.closest('[data-lv],[data-act],[data-add],#btnHint,#btnReset,#btnGo,#btnRules'); if (!t) return;
    if (t.dataset.lv != null) { sfx.tap(); start(+t.dataset.lv); return; }
    if (t.dataset.add != null) { add(+t.dataset.add); return; }
    if (t.id === 'btnGo') { go(); return; }
    if (t.id === 'btnReset') { sfx.tap(); start(S.lv); return; }
    if (t.id === 'btnHint') { if (S.hints > 0 && !S.done) { S.hints--; sfx.pop(); $('#shift').innerHTML = '💡 ' + L().hint; render(); } return; }
    if (t.id === 'btnRules') { $('#sheet').innerHTML = '<h2>📖 নিয়ম</h2><ul><li>স্লাইডার সরিয়ে দ্রবণের মোলারিটি লক্ষ্যে (±২%) আনো।</li><li><b>অন্ধ লেভেলে</b> মোলারিটি ঢাকা — হিসাব করে মান বসাও।</li><li>টাইট্রেশনে প্রথমে রাফ রিডিং, তারপর ফোঁটায় ফোঁটায় নির্ভুল এন্ডপয়েন্ট, শেষে হিসাব।</li><li>কম ভুল ও কম সূত্রে বেশি তারা।</li></ul><div class="row"><button class="btn primary" data-act="close">বুঝেছি</button></div>'; $('#modal').hidden = false; return; }
    if (t.dataset.act === 'close') { $('#modal').hidden = true; return; }
    if (t.dataset.act === 'again') { $('#modal').hidden = true; start(S.lv); return; }
    if (t.dataset.act === 'next') { $('#modal').hidden = true; start(Math.min(S.lv + 1, LEVELS.length - 1)); return; }
});
window.__t = { S, LEVELS, start, go, add, ve, pink, okCalc, render };
start(0);
})();
