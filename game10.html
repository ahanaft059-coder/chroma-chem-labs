<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোলারিটি ক্যালকুলেটর গেম - Extended Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            position: relative;
        }
        .back-btn { 
            position: fixed; 
            top: 15px; 
            left: 15px; 
            padding: 6px 12px; 
            background: #fff; 
            color: #2c3e50; 
            border-radius: 5px; 
            text-decoration: none; 
            border: 1px solid #ccc; 
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .back-btn:hover { background: #eee; }

        .game-container {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            margin-top: 20px;
        }
        h1 { font-size: 20px; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { font-size: 12px; color: #7f8c8d; margin-bottom: 15px; }
        
        .score-board {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid #e9ecef;
        }

        .problem-box {
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            line-height: 1.5;
            text-align: left;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .submit-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .submit-btn:hover { background: #2980b9; }

        .feedback {
            margin-top: 12px;
            font-size: 13px;
            font-weight: bold;
            min-height: 20px;
        }

        .game-over-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 2000;
            padding: 20px;
            text-align: center;
        }
        .game-over-screen h2 { margin-bottom: 10px; font-size: 22px; }
        .game-over-screen p { margin-bottom: 15px; font-size: 14px; color: #ddd; }
        .restart-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <a href="games.html" class="back-btn">← ফিরে যান</a>

    <div class="game-over-screen" id="gameOverScreen">
        <h2>অভিনন্দন! মিশন সম্পন্ন</h2>
        <p id="finalScoreText">আপনার মোট স্কোর: ০</p>
        <button class="restart-btn" onclick="startGame()">আবার খেলুন 🔄</button>
    </div>

    <div class="game-container">
        <h1>🧪 মোলারিটি মাস্টার</h1>
        <p class="subtitle">মোলারিটি ($S = \frac{1000W}{MV}$) হিসাব করো</p>

        <div class="score-board">
            <span>স্কোর: <span id="scoreVal">0</span></span>
            <span>প্রশ্ন: <span id="qNum">1</span>/200</span>
        </div>

        <div class="problem-box" id="problemText">
            সমস্যা লোড হচ্ছে...
        </div>

        <div class="input-group">
            <label for="userAnswer">আপনার উত্তর (দুই দশমিক ঘর পর্যন্ত):</label>
            <input type="number" step="0.01" id="userAnswer" placeholder="যেমন: 0.5">
        </div>

        <button class="submit-btn" onclick="checkAnswer()">উত্তর জমা দিন</button>
        <div class="feedback" id="feedbackText"></div>
    </div>

    <script>
        // বেসিক প্রশ্ন ডাটাবেজ এবং স্বয়ংক্রয় রূপান্তর মিলিয়ে ২০০+ প্রশ্ন তৈরির লজিক
        const baseProblems = [
            { w: 4, m: 40, v: 250, name: "NaOH", molM: 40 },
            { w: 5.3, m: 106, v: 500, name: "Na₂CO₃", molM: 106 },
            { w: 9.8, m: 98, v: 2000, name: "H₂SO₄", molM: 98 },
            { w: 10, m: 126, v: 200, name: "H₂C₂O₄·2H₂O", molM: 126 },
            { w: 58.5, m: 58.5, v: 1000, name: "NaCl", molM: 58.5 },
            { w: 2, m: 40, v: 500, name: "NaOH", molM: 40 },
            { w: 49, m: 98, v: 500, name: "H₂SO₄", molM: 98 },
            { w: 36.5, m: 36.5, v: 2000, name: "HCl", molM: 36.5 },
            { w: 20, m: 40, v: 250, name: "NaOH", molM: 40 },
            { w: 3.645, m: 36.5, v: 100, name: "HCl", molM: 36.5 },
            { w: 10.6, m: 106, v: 250, name: "Na₂CO₃", molM: 106 },
            { w: 8, m: 40, v: 500, name: "NaOH", molM: 40 },
            { w: 14.2, m: 142, v: 500, name: "Na₂SO₄", molM: 142 },
            { w: 6.0, m: 60, v: 250, name: "CH₃COOH", molM: 60 },
            { w: 4.9, m: 98, v: 250, name: "H₂SO₄", molM: 98 }
        ];

        let problems = [];

        // ২০০টি প্রশ্ন ডাইনামিক্যালি জেনারেট করার লজিক যাতে কোড ভারী না হয় এবং ইউনিক প্রশ্ন পাওয়া যায়
        function generate200Problems() {
            let list = [];
            let id = 1;
            
            // বেসিক গুলো আগে যুক্ত করা হলো
            baseProblems.forEach(item => {
                let ans = Number(((item.w * 1000) / (item.molM * item.v)).toFixed(2));
                list.index = id++;
                list.push({
                    text: `${item.w} গ্রাম ${item.name} কে পানিতে দ্রবীভূত করে মোট ${item.v} mL দ্রবণ তৈরি করা হলো। দ্রবণটির মোলারিটি ($S$) কত?<br><small style='color:#555;'>(মোলার ভর = ${item.molM} g/mol)</small>`,
                    answer: ans
                });
            });

            // বাকি প্রশ্নগুলো সংখ্যা পরিবর্তন করে ডাইনামিক্যালি ২০০ পর্যন্ত পূরণ করা হলো
            while (list.length < 200) {
                let randBase = baseProblems[Math.floor(Math.random() * baseProblems.length)];
                let multiplier = (Math.floor(Math.random() * 4) + 1) * 0.5; // 0.5, 1, 1.5, 2
                let newW = Number((randBase.w * multiplier).toFixed(1));
                let newV = randBase.v;
                let ans = Number(((newW * 1000) / (randBase.molM * newV)).toFixed(2));

                // যেন ডুপ্লিকেট বা অবাস্তব না হয়
                if (ans > 0) {
                    list.push({
                        text: `${newW} গ্রাম ${randBase.name} কে দ্রবীভূত করে ${newV} mL দ্রবণ প্রস্তুত করা হলো। এর মোলার ঘনমাত্রা কত?<br><small style='color:#555;'>(মোলার ভর = ${randBase.molM} g/mol)</small>`,
                        answer: ans
                    });
                }
            }
            return list;
        }

        let currentIdx = 0;
        let score = 0;
        let gameProblems = [];

        const problemText = document.getElementById("problemText");
        const userAnswer = document.getElementById("userAnswer");
        const feedbackText = document.getElementById("feedbackText");
        const scoreVal = document.getElementById("scoreVal");
        const qNum = document.getElementById("qNum");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const finalScoreText = document.getElementById("finalScoreText");

        function startGame() {
            gameOverScreen.style.display = "none";
            currentIdx = 0;
            score = 0;
            scoreVal.textContent = score;
            gameProblems = generate200Problems().sort(() => Math.random() - 0.5);
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIdx >= gameProblems.length) {
                endGame();
                return;
            }
            userAnswer.value = "";
            feedbackText.textContent = "";
            qNum.textContent = currentIdx + 1;
            problemText.innerHTML = gameProblems[currentIdx].text;
        }

        function checkAnswer() {
            let val = parseFloat(userAnswer.value);
            if (isNaN(val)) {
                feedbackText.style.color = "#e74c3c";
                feedbackText.textContent = "দয়া করে একটি সঠিক সংখ্যা লিখুন!";
                return;
            }

            let correctAns = gameProblems[currentIdx].answer;
            
            if (Math.abs(val - correctAns) <= 0.02) {
                score += 5; // মোট ২০০টি প্রশ্ন তাই প্রতিটিতে ৫ পয়েন্ট
                scoreVal.textContent = score;
                feedbackText.style.color = "#27ae60";
                feedbackText.textContent = "সঠিক উত্তর! চমৎকার হয়েছে।";
            } else {
                feedbackText.style.color = "#e74c3c";
                feedbackText.textContent = `ভুল হয়েছে! সঠিক উত্তর হবে: ${correctAns}`;
            }

            currentIdx++;
            setTimeout(() => {
                loadQuestion();
            }, 1200);
        }

        function endGame() {
            finalScoreText.textContent = `আপনার মোট স্কোর: ${score} (২০০টি প্রশ্নের মধ্যে)`;
            gameOverScreen.style.display = "flex";
        }

        startGame();
    </script>
</body>
</html>
