<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জৈব যৌগের নামকরণ ও সংকেত ক্যালকুলেটর</title>
    
    <!-- ডার্ক মোড সিনক্রোনাইজেশন -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
            --shadow: rgba(15, 23, 42, 0.05);
        }
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 25px 40px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .top-action-bar {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 10px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            background: #10b981;
            color: white !important;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
            transition: background 0.2s, transform 0.1s;
        }

        .back-home-btn:hover {
            background: #059669;
            transform: scale(1.02);
        }

        .hub-header-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .hub-main-title {
            font-size: 36px;
            font-weight: 800;
            color: #d97706;
            margin: 0 0 12px 0;
        }
        [data-theme="dark"] .hub-main-title { color: #f59e0b; }

        .hub-subtitle {
            font-size: 16px;
            color: #475569;
            margin: 0;
        }
        [data-theme="dark"] .hub-subtitle { color: #94a3b8; }

        .calculator-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px var(--shadow);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-color);
        }

        .custom-select, .custom-input {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .custom-select:focus, .custom-input:focus {
            border-color: #10b981;
        }

        .result-panel {
            background: var(--card-bg);
            border: 2px solid #10b981;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 30px var(--shadow);
            display: none; 
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            color: #10b981;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            font-size: 24px;
        }

        .result-row {
            margin: 15px 0;
            font-size: 18px;
            line-height: 1.6;
        }

        .formula-box {
            font-family: 'Courier New', Courier, monospace;
            background: rgba(16, 185, 129, 0.08);
            color: #10b981;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
            letter-spacing: 1px;
        }
        [data-theme="dark"] .formula-box {
            background: #334155;
            color: #f8fafc;
        }

        .structural-box {
            font-family: 'Consolas', monospace;
            background: var(--bg-color);
            border: 1px dashed var(--border-color);
            padding: 15px;
            border-radius: 12px;
            word-break: break-all;
            margin-top: 10px;
            font-size: 16px;
            letter-spacing: 0.5px;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            body { padding: 20px; }
            .hub-main-title { font-size: 26px; }
            .calculator-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-action-bar">
            <a href="organic.html" class="back-home-btn">← ফিরে যান</a>
        </div>

        <div class="hub-header-section">
            <h1 class="hub-main-title">🏷️ ডাইনামিক IUPAC নামকরণ ক্যালকুলেটর</h1>
            <p class="hub-subtitle">যৌগের শ্রেণী এবং কার্বন সংখ্যা (১-২০) দিলেই অটোমেটিক লাইভ নাম ও সংকেত তৈরি হয়ে যাবে।</p>
        </div>

        <!-- ইনপুট প্যানেল -->
        <div class="calculator-panel">
            <div class="input-group">
                <label for="compound-type">🧪 যৌগের শ্রেণী সিলেক্ট করো:</label>
                <select id="compound-type" class="custom-select" onchange="calculateNaming()">
                    <option value="alkane">⛽ অ্যালকেন (Alkane)</option>
                    <option value="alkene">🧪 অ্যালকিন (Alkene)</option>
                    <option value="alkyne">🔥 অ্যালকাইন (Alkyne)</option>
                    <option value="alcohol">💧 অ্যালকোহল (Alcohol)</option>
                    <option value="acid">🍋 ফ্যাটি এসিড (Fatty Acid / Organic Acid)</option>
                    <option value="ketone">🍭 কিটোন (Ketone)</option>
                    <option value="ether">☁️ ইথার (Ether)</option>
                    <option value="ester">🌸 এস্টার (Ester)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="carbon-n">🔢 কার্বন সংখ্যা (n এর মান):</label>
                <input type="number" id="carbon-n" class="custom-input" min="1" max="20" value="1" oninput="calculateNaming()">
            </div>
        </div>

        <!-- লাইভ ফলাফল বক্স -->
        <div class="result-panel" id="result-box">
            <h2 class="result-title">🎯 গণনা সম্পন্ন ফলাফল:</h2>
            
            <div class="result-row">
                <strong>📝 IUPAC নাম:</strong> <span id="res-name" style="font-weight: bold; color: #d97706; font-size: 20px;">-</span>
            </div>
            
            <div class="result-row">
                <strong>🧬 আণবিক সংকেত:</strong> <br>
                <span id="res-molecular" class="formula-box">-</span>
            </div>
            
            <div class="result-row">
                <strong>📐 গাঠনিক সংকেত (Structural Formula):</strong>
                <div id="res-structural" class="structural-box">-</div>
            </div>
        </div>
    </div>

    <script>
        const prefixes = {
            1: "মিথ", 2: "ইথ", 3: "প্রোপ", 4: "বিউট", 5: "পেন্ট",
            6: "হেক্স", 7: "হেপ্ট", 8: "অক্ট", 9: "নন", 10: "ডেক",
            11: "আনডেক", 12: "ডৈতক", 13: "ট্রাইডেক", 14: "টেট্রাডেক", 15: "পেন্টাডেক",
            16: "হেক্সাডেক", 17: "হেপ্টাডেক", 18: "অক্টাডেক", 19: "নোনাডেক", 20: "আইকোস"
        };

        function calculateNaming() {
            const type = document.getElementById('compound-type').value;
            let n = parseInt(document.getElementById('carbon-n').value);
            const resultBox = document.getElementById('result-box');

            if (isNaN(n) || n < 1) {
                resultBox.style.display = "none";
                return;
            }
            if (n > 20) {
                n = 20;
                document.getElementById('carbon-n').value = 20;
            }

            // কিটোন শ্রেণীর জন্য কার্বন সংখ্যা কমপক্ষে ৩ হতে হবে
            if (type === 'ketone' && n < 3) {
                document.getElementById('res-name').innerText = "সম্ভব নয় (ন্যূনতম ৩টি কার্বন লাগবে)";
                document.getElementById('res-molecular').innerText = "N/A";
                document.getElementById('res-structural').innerText = "কিটোন মূলক (>C=O) মাঝখানে বসার জন্য দুই পাশে দুটি কার্বন পরমাণুর উপস্থিতি বাধ্যতামূলক। তাই এর প্রথম সদস্য প্রোপানন (n=৩)।";
                resultBox.style.display = "block";
                return;
            }

            // অ্যালকিন, অ্যালকাইন এবং এস্টারের জন্য ন্যূনতম কার্বন সংখ্যা ২ হতে হবে
            if ((type === 'alkene' || type === 'alkyne' || type === 'ester') && n === 1) {
                document.getElementById('res-name').innerText = "সম্ভব নয় (ন্যূনতম কার্বন ২টি লাগবে)";
                document.getElementById('res-molecular').innerText = "N/A";
                if(type === 'ester') {
                    document.getElementById('res-structural').innerText = "এস্টার মূলকের (-COO-R) সাথে অবশ্যই অন্তত ১টি কার্বনযুক্ত অ্যালকাইল গ্রুপ থাকতে হবে।";
                } else {
                    document.getElementById('res-structural').innerText = "কার্বন-কার্বন দ্বিবন্ধন বা ত্রিবন্ধন তৈরি করতে সর্বনিম্ন ২টি কার্বন পরমাণু প্রয়োজন।";
                }
                resultBox.style.display = "block";
                return;
            }

            let iupacName = "";
            let molecularFormula = "";
            let structuralFormula = "";
            const prefix = prefixes[n];

            // ১. অ্যালকেন
            if (type === 'alkane') {
                iupacName = (n === 1) ? "মিথেন" : (n === 20 ? "আইকোসেন" : prefix + "েন"); 
                let h = 2 * n + 2;
                molecularFormula = `C${n}H${h}`;
                
                let parts = [];
                for(let i = 1; i <= n; i++) {
                    if (n === 1) { parts.push("CH₄"); break; }
                    parts.push((i === 1 || i === n) ? "CH₃" : "CH₂");
                }
                structuralFormula = parts.join(" — ");
            }

            // ২. অ্যালকিন
            else if (type === 'alkene') {
                iupacName = (n === 20) ? "আইকোসিন" : prefix + "িন";
                let h = 2 * n;
                molecularFormula = `C${n}H${h}`;
                
                if (n === 2) structuralFormula = "CH₂ = CH₂";
                else {
                    let parts = ["CH₂ = CH"];
                    for(let i = 3; i <= n; i++) parts.push((i === n) ? "CH₃" : "CH₂");
                    structuralFormula = parts.join(" — ");
                }
            }

            // ৩. অ্যালকাইন
            else if (type === 'alkyne') {
                iupacName = (n === 20) ? "আইকোসাইন" : prefix + "াইন";
                let h = 2 * n - 2;
                molecularFormula = `C${n}H${h}`;
                
                if (n === 2) structuralFormula = "CH ≡ CH";
                else {
                    let parts = ["CH ≡ C"];
                    for(let i = 3; i <= n; i++) parts.push((i === n) ? "CH₃" : "CH₂");
                    structuralFormula = parts.join(" — ");
                }
            }

            // ৪. অ্যালকোহল
            else if (type === 'alcohol') {
                iupacName = (n === 1) ? "মিথানল" : (n === 20 ? "আইকোসানল" : prefix + "ানল");
                let h = 2 * n + 1;
                molecularFormula = `C${n}H${h}OH`;
                
                let parts = [];
                for(let i = 1; i <= n; i++) {
                    if (n === 1) { parts.push("CH₃ — OH"); break; }
                    if (i === 1) parts.push("CH₃");
                    else if (i === n) parts.push("CH₂ — OH");
                    else parts.push("CH₂");
                }
                structuralFormula = parts.join(" — ");
            }

            // ৫. ফ্যাটি এসিড (কার্বক্সিলিক মূলকের কার্বন গণনাভুক্ত)
            else if (type === 'acid') {
                iupacName = (n === 1) ? "মিথানয়িক এসিড" : (n === 20 ? "আইকোসানয়িক এসিড" : prefix + "ানয়িক এসিড");
                let h = 2 * n - 1;
                molecularFormula = `C${n-1 > 0 ? 'C'+(n-1) : ''}H${h}COOH`;
                if(n === 1) molecularFormula = "HCOOH";
                
                let parts = [];
                for(let i = 1; i < n; i++) parts.push((i === 1) ? "CH₃" : "CH₂");
                parts.push("COOH");
                structuralFormula = (n === 1) ? "H — COOH" : parts.join(" — ");
            }

            // ৬. কিটোন (CO মূলকের কার্বন গণনাভুক্ত)
            else if (type === 'ketone') {
                iupacName = (n === 20) ? "আইকোসানন" : prefix + "ানন";
                let h = 2 * n;
                molecularFormula = `C${n}H${h}O`;
                
                let parts = ["CH₃", "CO"];
                for(let i = 3; i <= n; i++) parts.push((i === n) ? "CH₃" : "CH₂");
                structuralFormula = parts.join(" — ");
            }

            // ৭. ইথার (সহজ প্রতিসম ডাই-অ্যালকাইল চেইন)
            else if (type === 'ether') {
                iupacName = (n === 1) ? "ডাই-মিথাইল ইথার" : "ডাই-" + prefix + "িল ইথার";
                let h = 2 * n + 1;
                molecularFormula = `C${n}H${h} — O — C${n}H${h}`;
                
                let rGroup = [];
                for(let i = 1; i <= n; i++) rGroup.push((i === 1) ? "CH₃" : "CH₂");
                let rString = rGroup.join(" — ");
                let rReverse = rGroup.reverse().join(" — ");
                structuralFormula = `${rString} — O — ${rReverse}`;
            }

            // ৮. এস্টার (মিথাইল এস্টার রুপ ধরে গণনা)
            else if (type === 'ester') {
                iupacName = (n === 2) ? "মিথাইল মিথানয়েট" : "মিথাইল " + prefixes[n-1] + "ানয়েট";
                let h = 2 * (n - 1) - 1;
                molecularFormula = `C${n-2 > 0 ? 'C'+(n-2) : ''}H${2*n-3}COOCH₃`;
                if(n === 2) molecularFormula = "HCOOCH₃";
                
                let parts = [];
                for(let i = 1; i < n - 1; i++) parts.push((i === 1) ? "CH₃" : "CH₂");
                if(n > 2) parts.push("COO — CH₃");
                else parts.push("H — COO — CH₃");
                structuralFormula = parts.join(" — ");
            }

            // লাইভ ভিউ আপডেট
            document.getElementById('res-name').innerText = iupacName;
            document.getElementById('res-molecular').innerText = molecularFormula;
            document.getElementById('res-structural').innerText = structuralFormula;
            
            resultBox.style.display = "block";
        }

        window.onload = function() {
            calculateNaming();
        };
    </script>
</body>
</html>
