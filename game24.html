<script>
/* ===== NB SOUND: শূন্য-নির্ভরতার WebAudio সাউন্ড ইফেক্ট =====
   ব্যবহার: const sfx = NBSound('গেমের-কী'); sfx.ok(); sfx.bad(); sfx.win(); sfx.lose(); sfx.tap(); sfx.pop();
   বাটন: #soundBtn থাকলে সেটি নিজে নিজে 🔔/🔕 টগল করে (localStorage '<কী>-sound') */
function NBSound(key) {
    let on = true, ac = null;
    try { on = localStorage.getItem(key + '-sound') !== '0'; } catch (e) {}
    function tone(f, t0, dur, type, vol) {
        if (!on) return;
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
            const t = ac.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .03);
        } catch (e) {}
    }
    const api = {
        ok() { tone(660, 0, .12); tone(880, .1, .16); },
        bad() { tone(220, 0, .2, 'sawtooth', .1); tone(160, .14, .26, 'sawtooth', .1); },
        tap() { tone(520, 0, .06, 'triangle', .1); },
        pop() { tone(440, 0, .08, 'square', .06); tone(740, .06, .1, 'square', .06); },
        win() { tone(523, 0, .12); tone(659, .12, .12); tone(784, .24, .12); tone(1047, .36, .3); },

const BNL = 'ঀ-৥ৰ-৿', HAS_BN = /[ঀ-৿]/;
const EN_RE = new RegExp('(?:' + Object.keys(EN_DICT).sort((a, b) => b.length - a.length).map(k => (new RegExp('^[' + BNL + ']').test(k) ? '(?<![' + BNL + '])' : '') + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![' + BNL + '])', 'g');
function trEn(s) {
    if (!HAS_BN.test(s)) return s;
    let o = s.replace(EN_RE, m => EN_DICT[m]);
    o = o.replace(/[০-৯]/g, d => String(d.charCodeAt(0) - 0x09E6)).replace(/।/g, '.').replace(/ {2,}/g, ' ').replace(/ +([.,!?:;)])/g, '$1').replace(/You wins!/g, 'You win!').replace(/([^\s]) '(s )/g, "$1'$2");

}
function trTree(root) {

function stopAll() { tok++; if (clock) clock.stop(); clock = null; botTimers.forEach(clearTimeout); botTimers = []; }
function newGame() {

/* ---------- রেন্ডার ---------- */
const boardEl = $('#board');

(function () { for (let i = 0; i < W; i++) { const d = document.createElement('div'); d.className = 'cell'; d.dataset.i = i; boardEl.appendChild(d); cells.push(d); } })();
function paint(arr, popSet, clrSet) {

}
function renderBoard() { paint(G.board); }
function render() {

    const goal = GOALS[CFG.limit];

}
function recHTML(c) { return '<span class="rec">' + c.rec.map(t => '<i class="t' + t + '">' + EL[t].sym + '</i>').join('') + '</span>'; }
function newOrder() { const prev = G.order ? G.order.ci : -1; let ci; do { ci = rnd(COMP.length < 6 ? COMP.length : 5 + (Math.random() < .25 ? 2 : 0)); } while (ci === prev); G.order = { ci: ci, need: COMP[ci].rec.length === 3 ? 2 : 1, got: 0 }; }
function renderOrder() { const o = G.order, c = COMP[o.ci]; $('#order').innerHTML = '<span>📋 ' + L('অর্ডার:', 'Order:') + '</span><b class="fm">' + c.f + '</b><span>(' + c.bn + ')</span>' + recHTML(c) + '<span>' + bn(o.got) + '/' + bn(o.need) + ' · +' + bn(120) + '</span>'; }
function showComp(ci) { const c = COMP[ci]; $('#lab').innerHTML = '<span class="lsym" style="background:linear-gradient(155deg,#ffe08a,#ff9f43);color:#241a00;font-size:14px">' + c.f + '</span><div><b>' + c.f + ' · ' + c.bn + '</b><span class="meta">' + c.fact + '</span></div>'; }
function showFact(t) {

    $('#lab').innerHTML = e ? '<span class="lsym t' + col(t) + ' cell" style="position:relative;display:grid">' + e.sym + '</span><div><b>' + e.bn + '</b><span class="meta">' + e.fact + '</span></div>' : '<div><b>⚛ এলিমেন্ট ম্যাচ</b><span class="meta">একই মৌল মেলাও বা মৌল সাজিয়ে যৌগ বানাও (H+H+O = H₂O) — প্রতিটিতে নতুন কিছু শিখবে।</span></div>';
}
/* ---------- মানুষের চাল ---------- */
const adj = (a, b) => { const d = Math.abs(a - b); return (d === 1 && ((a / N) | 0) === ((b / N) | 0)) || d === N; };
async function trySwap(a, b) {

            if (ci === G.order.ci) { G.order.got++; if (G.order.got >= G.order.need) { G.score += 120; PREM.toast(L('📋 অর্ডার সম্পূর্ণ! +১২০', '📋 Order complete! +120')); newOrder(); } } });
        render(); await sleep(190);

    const mx = Math.max.apply(null, rec.map(f => f.chain).concat([0])); if (!rec.some(f => f.comps.length)) showFact(rec.length ? nb[rec[0].clear[0]] : nb[a]);
    if (mx >= 3) { sfx.ok(); PREM.toast(L('🔥 চেইন ×' + bn(mx) + '!', '🔥 Chain ×' + mx + '!')); }

function hint() { if (busy || !G || G.over) return; const m = bestMove(G.board, 'normal'); if (!m) return; clearHint(); cells[m.a].classList.add('hint'); cells[m.b].classList.add('hint'); hintT = setTimeout(clearHint, 2500); }
function clearHint() { clearTimeout(hintT); cells.forEach(c => c.classList.remove('hint')); }
let pd = null;
boardEl.addEventListener('pointerdown', e => { const c = e.target.closest('.cell'); if (!c) return; pd = { i: +c.dataset.i, x: e.clientX, y: e.clientY }; });
window.addEventListener('pointerup', e => {
    if (!pd) return; const p = pd; pd = null; if (!G || busy || G.over) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 16) { let j; if (Math.abs(dx) > Math.abs(dy)) j = p.i + (dx > 0 ? 1 : -1); else j = p.i + (dy > 0 ? N : -N); if (j >= 0 && j < W && adj(p.i, j)) { trySwap(p.i, j); } return; }

    else if (sel === p.i) { sel = -1; renderBoard(); }

});
/* ---------- রোবট ---------- */
function scheduleBot(i, fast) { const B = G.bots[i]; const d = SK[CFG.skill].ms * (.75 + Math.random() * .5); botTimers.push(setTimeout(() => botStep(i, fast), d)); }
function botStep(i, fast) {

function checkEnd() { if (G.mode === 'm' && G.hmDone && G.bots.every(b => b.done)) finish('moves'); }
/* ---------- শেষ ---------- */

$('#btnFin').addEventListener('click', () => finish('manual'));
$('#btnHint').addEventListener('click', hint);
$('#btnBook').addEventListener('click', () => { const n = COMP.filter(c => known[c.id]).length; $('#sheet').innerHTML = '<span class="mtag">📖 ' + L('যৌগের বই', 'Compound book') + '</span><h2>' + L('আবিষ্কৃত যৌগ ', 'Compounds found ') + bn(n) + '/' + bn(COMP.length) + '</h2><p>' + L('সারিতে (লাইনে) এই মৌলগুলো যেকোনো ক্রমে পাশাপাশি আনলেই যৌগ তৈরি হয়!', 'Line these elements up side by side in any order to form the compound!') + '</p><div class="cbk">' + COMP.map(c => '<div class="' + (known[c.id] ? 'got' : '') + '"><h5><span>' + c.f + '</span>' + c.bn + (known[c.id] ? ' ✔' : '') + '</h5>' + recHTML(c) + '<small>' + (known[c.id] ? c.fact : L('এখনো আবিষ্কার হয়নি', 'Not discovered yet')) + ' · +' + c.pts + '</small></div>').join('') + '</div><div class="row"><button class="pbtn gold" id="bOk">বুঝেছি</button></div>'; $('#modal').hidden = false; $('#bOk').onclick = () => { $('#modal').hidden = true; }; });
