<script>
/* ===== NB SOUND: শূন্য-নির্ভরতার WebAudio সাউন্ড ইফেক্ট =====
   ব্যবহার: const sfx = NBSound('গেমের-কী'); sfx.ok(); sfx.bad(); sfx.win(); sfx.lose(); sfx.tap(); sfx.pop();
   বাটন: #soundBtn থাকলে সেটি নিজে নিজে 🔔/🔕 টগল করে (localStorage '<কী>-sound') */
function NBSound(key) {
    let on = true, ac = null;
    try { on = localStorage.getItem(key + '-sound') !== '0'; } catch (e) {}
    function tone(f, t0, dur, type, vol) {
        if (!on) return;
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
            const t = ac.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .03);
        } catch (e) {}
    }
    const api = {
        ok() { tone(660, 0, .12); tone(880, .1, .16); },
        bad() { tone(220, 0, .2, 'sawtooth', .1); tone(160, .14, .26, 'sawtooth', .1); },
        tap() { tone(520, 0, .06, 'triangle', .1); },
        pop() { tone(440, 0, .08, 'square', .06); tone(740, .06, .1, 'square', .06); },
        win() { tone(523, 0, .12); tone(659, .12, .12); tone(784, .24, .12); tone(1047, .36, .3); },
        lose() { tone(392, 0, .2); tone(330, .2, .2); tone(262, .4, .4); },
        get on() { return on; },
        toggle() { on = !on; try { localStorage.setItem(key + '-sound', on ? '1' : '0'); } catch (e) {} paint(); if (on) api.ok(); }
    };
    function paint() { const b = document.getElementById('soundBtn'); if (b) b.textContent = on ? '🔔' : '🔕'; }

const BNL = 'ঀ-৥ৰ-৿', HAS_BN = /[ঀ-৿]/;
const EN_RE = new RegExp('(?:' + Object.keys(EN_DICT).sort((a, b) => b.length - a.length).map(k => (new RegExp('^[' + BNL + ']').test(k) ? '(?<![' + BNL + '])' : '') + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![' + BNL + '])', 'g');
function trEn(s) {
    if (!HAS_BN.test(s)) return s;
    let o = s.replace(EN_RE, m => EN_DICT[m]);
    o = o.replace(/[০-৯]/g, d => String(d.charCodeAt(0) - 0x09E6)).replace(/।/g, '.').replace(/ {2,}/g, ' ').replace(/ +([.,!?:;)])/g, '$1').replace(/You wins!/g, 'You win!').replace(/([^\s]) '(s )/g, "$1'$2");

}
function trTree(root) {

    $('#sheet').innerHTML = '<span class="mtag">' + L('খেলা শেষ', 'Game over') + '</span><h2>' + (win ? (L('রোবট জিতল', 'The robot wins')) : L('খেলা ড্র', 'A draw')) + '</h2><p>' + (win ? how + ' ' + L('কৌশল বদলে আবার চেষ্টা করলেই হারানো যাবে!', 'Change your tactics and try again — you can win!') : draws[r.type]) + '</p><div class="row"><button class="pbtn gold big" id="mAgain">▶ আবার খেলো</button><button class="pbtn" id="mSet">⚙ সেটিংস</button><button class="pbtn" id="mClose">বন্ধ করো</button></div>';
    $('#modal').hidden = false; $('#mAgain').onclick = again; $('#mSet').onclick = setup; $('#mClose').onclick = () => { $('#modal').hidden = true; };
}
$('#btnRes').addEventListener('click', () => { if (!G || G.over) return; const col = G.human === 'both' ? G.S.turn : G.human; endGame({ type: 'res', winner: col === 'w' ? 'b' : 'w' }); });
$('#btnUndo').addEventListener('click', () => {
    if (!G || G.over || thinking > 0) return; const n = G.human === 'both' ? 1 : (isHumanTurn() && G.hist.length >= 2 ? 2 : 0); if (!n || G.hist.length < n) return;
    for (let k = 0; k < n; k++) { G.hist.pop(); G.states.pop(); G.keys.pop(); } G.S = G.states[G.states.length - 1]; G.last = null; sel = -1; hintMv = null;
    G.caps = { w: [], b: [] }; renderAll();
});
$('#btnHint').addEventListener('click', () => { if (!isHumanTurn() || thinking) return; const m = pickMove(G.S, 'normal'); if (m) { hintMv = m; renderBoard(); setTimeout(() => { hintMv = null; if (G) renderBoard(); }, 2200); } });
$('#btnNew').addEventListener('click', () => openSetup(false));
$('#btnRules').addEventListener('click', () => { $('#sheet').innerHTML = '<span class="mtag">কীভাবে খেলবে</span><h2>দাবার নিয়মে মৌলের লড়াই</h2><ul class="rules"><li><b>লক্ষ্য</b><span>প্রতিপক্ষের রাজা (U) কে চেকমেট করো।</span></li><li><b>চালনা</b><span>ঘুঁটিতে ট্যাপ করলে সোনালি বিন্দুতে যাওয়া যায়; লাল বৃত্ত মানে ঘুঁটি ধরা যাবে।</span></li><li><b>ঘুঁটি-মৌল</b><span>সৈনিক = H, ঘোড়া = Ne, গজ = Si, নৌকা = Fe, রানি = Au, রাজা = U।</span></li><li><b>কুইজ-ক্যাপচার</b><span>ঘুঁটি ধরতে সেই মৌল নিয়ে ২০ সেকেন্ডে কুইজের সঠিক উত্তর দাও; ভুল হলে ওই ধরা এই দানে বন্ধ। সেটিংসে বন্ধ করা যায়।</span></li><li><b>বিশেষ চাল</b><span>ক্যাসলিং, এন-প্যাসান ও প্রমোশন — সবই আছে।</span></li><li><b>ইঙ্গিত</b><span>আটকে গেলে 💡 চাপো; ভুল করলে ↶ পূর্বাবস্থা।</span></li></ul><div class="row"><button class="pbtn gold" id="rOk">বুঝেছি</button></div>'; $('#modal').hidden = false; $('#rOk').onclick = () => { $('#modal').hidden = true; }; });
window.__t = { get G() { return G; }, perft: (f, d) => perft(fromFEN(f), d), fromFEN, legal, humanMove, pickMove, CFG: () => CFG, newGame, setCfg: c => { CFG = Object.assign(CFG, c); }, endGame, doMove };
PREM.bg('chess'); showInfo(null); openSetup(true);
})();

</script>
