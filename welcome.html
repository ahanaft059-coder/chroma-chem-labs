<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to ChromaChem Labs</title>
    <style>
        :root {
            --bg-black: #000000;
            --neon-cyan: #06b6d4;
            --neon-purple: #a855f7;
            --text-white: #f8fafc;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: var(--text-white);
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .welcome-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .left-panel {
            width: 45%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            padding-left: 80px; 
            box-sizing: border-box;
        }

        .left-panel h1 {
            font-size: 3.8rem;
            font-weight: 900;
            margin: 0 0 15px 0;
            line-height: 1.1;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .typewriter {
            color: #94a3b8;
            font-size: 1.25rem;
            margin: 0 0 40px 0;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid var(--neon-cyan);
            width: 0;
            animation: typing 3.5s steps(40) forwards, blink 0.75s step-end infinite;
        }

        .enter-btn {
            width: fit-content;
            padding: 18px 45px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(168, 85, 247, 0.15));
            border: 2px solid var(--neon-cyan);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }

        .enter-btn:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.7);
            transform: translateY(-4px) scale(1.02);
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.3), rgba(168, 85, 247, 0.3));
        }

        .enter-btn span {
            transition: transform 0.3s ease;
        }

        .enter-btn:hover span {
            transform: translateX(8px);
        }

        .right-panel {
            width: 55%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chemistry-art {
            position: relative;
            width: 420px;
            height: 420px;
        }

        .nucleus {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #ffffff, var(--neon-cyan));
            border-radius: 50%;
            box-shadow: 0 0 35px var(--neon-cyan), 0 0 70px var(--neon-purple);
            animation: pulse 3s infinite alternate;
        }

        .orbit-one {
            position: absolute;
            top: 5%; left: 5%; right: 5%; bottom: 5%;
            border: 2px dashed rgba(6, 182, 212, 0.35);
            border-radius: 50%;
            animation: rotateOrbit 15s linear infinite;
        }
        .orbit-one::after {
            content: '';
            position: absolute;
            top: -6px; left: 50%;
            width: 14px; height: 14px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .orbit-two {
            position: absolute;
            top: -10%; left: 15%; right: 15%; bottom: -10%;
            border: 1.5px solid rgba(168, 85, 247, 0.25);
            border-radius: 50%;
            transform: rotate(45deg);
            animation: rotateOrbitTwo 25s linear infinite;
        }
        .orbit-two::after {
            content: '';
            position: absolute;
            bottom: -6px; left: 30%;
            width: 14px; height: 14px;
            background: var(--neon-purple);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-purple);
        }

        .molecule-dot {
            position: absolute;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 50%;
            backdrop-filter: blur(4px);
        }
        .m1 { width: 70px; height: 70px; top: 10%; right: 10%; animation: float 6s infinite ease-in-out; }
        .m2 { width: 50px; height: 50px; bottom: 10%; left: 5%; animation: float 8s infinite ease-in-out 1s; }
        .m3 { width: 90px; height: 90px; bottom: 20%; right: 15%; border-color: rgba(168, 85, 247, 0.2); animation: float 7s infinite ease-in-out 2s; }

        @keyframes rotateOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotateOrbitTwo { from { transform: rotate(45deg); } to { transform: rotate(405deg); } }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; box-shadow: 0 0 45px var(--neon-cyan), 0 0 90px var(--neon-purple); } }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(15deg); } }
        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { from, to { border-color: transparent; } 50% { border-color: var(--neon-cyan); } }

        @media (max-width: 768px) {
            .welcome-wrapper { flex-direction: column; justify-content: center; }
            .left-panel { width: 100%; height: auto; padding-left: 40px; padding-top: 60px; }
            .right-panel { width: 100%; height: 50%; }
            .left-panel h1 { font-size: 2.8rem; }
            .typewriter { font-size: 1rem; white-space: normal; border: none; animation: none; width: auto; }
            .chemistry-art { width: 300px; height: 300px; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>
    
    <div class="welcome-wrapper">
        <div class="left-panel">
            <h1>ChromaChem<br>Labs</h1>
            <p class="typewriter">রসায়নের এক ইন্টারেক্টিভ ও আধুনিক ডিজিটাল ল্যাব</p>
            
            <a href="login.html" class="enter-btn">
                ল্যাবে প্রবেশ করুন <span>&rarr;</span>
            </a>
        </div>

        <div class="right-panel">
            <div class="chemistry-art">
                <div class="molecule-dot m1"></div>
                <div class="molecule-dot m2"></div>
                <div class="molecule-dot m3"></div>
                <div class="orbit-one"></div>
                <div class="orbit-two"></div>
                <div class="nucleus"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 40;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * -0.4 - 0.1;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = Math.random() > 0.5 ? '#06b6d4' : '#a855f7';
                ctx.shadowBlur = 10;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fill();
                ctx.restore();
            }
        }

        function init() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
