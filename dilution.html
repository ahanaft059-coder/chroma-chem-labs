<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dilution Calculator</title>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        /* ছোট ব্যাক বাটন - একদম কোণায় */
        .back-btn { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: #64748b; 
            padding: 4px 10px; 
            font-size: 12px; 
            cursor: pointer; 
            border-radius: 4px; 
            transition: 0.2s;
        }
        .back-btn:hover { background: #3b82f6; color: white; border-color: #3b82f6; }
        
        .box { background: #1e293b; padding: 30px; border-radius: 20px; width: 350px; border: 1px solid #334155; text-align: center; }
        h3 { margin-bottom: 20px; color: #3b82f6; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #res { margin-top: 20px; font-size: 1.2rem; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='calculators.html'">Back</button>

<div class="box">
    <h3>Dilution Calculator</h3>
    <input type="number" id="m1" placeholder="M1 (Initial Molarity)">
    <input type="number" id="v1" placeholder="V1 (Initial Volume)">
    <input type="number" id="m2" placeholder="M2 (Final Molarity)">
    <input type="number" id="v2" placeholder="V2 (Final Volume)">
    <button onclick="calc()">Calculate</button>
    <div id="res">---</div>
</div>

<script>
    function calc() {
        let m1 = parseFloat(document.getElementById('m1').value);
        let v1 = parseFloat(document.getElementById('v1').value);
        let m2 = parseFloat(document.getElementById('m2').value);
        let v2 = parseFloat(document.getElementById('v2').value);
        let res = document.getElementById('res');

        if (isNaN(m1)) {
            res.innerText = "M1 = " + ((m2 * v2) / v1).toFixed(4);
        } else if (isNaN(v1)) {
            res.innerText = "V1 = " + ((m2 * v2) / m1).toFixed(4);
        } else if (isNaN(m2)) {
            res.innerText = "M2 = " + ((m1 * v1) / v2).toFixed(4);
        } else if (isNaN(v2)) {
            res.innerText = "V2 = " + ((m1 * v1) / m2).toFixed(4);
        } else {
            res.innerText = "Leave one field empty!";
        }
    }
</script>
</body>
</html>
