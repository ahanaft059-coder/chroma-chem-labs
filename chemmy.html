<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chemmy AI - রসায়ন সহকারী | Lab Alchemy</title>

<script>
(function () {
    let t = 'light';
    try { t = localStorage.getItem('theme') || 'light'; } catch (e) {}
    if (t === 'auto') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{--bg:#eef2f9;--card:rgba(255,255,255,.8);--solid:#fff;--text:#0f172a;--muted:#5b6b82;--line:rgba(15,23,42,.12);--shadow:0 10px 30px -5px rgba(15,23,42,.1);--sec:rgba(168,85,247,.3);--grad:linear-gradient(135deg,#9333ea,#3b82f6);--glow:rgba(147,51,234,.2);--gl:rgba(15,23,42,.05);--blob:.22;--accent:#7c3aed;--good:#059669;--bad:#e11d48;--gold:#d97706}
[data-theme="dark"]{--bg:#05060f;--card:rgba(16,20,36,.7);--solid:#0b0f1c;--text:#f8fafc;--muted:#94a3b8;--line:rgba(255,255,255,.1);--shadow:0 20px 40px -15px rgba(0,0,0,.7);--sec:rgba(168,85,247,.38);--grad:linear-gradient(135deg,#a855f7,#60a5fa);--glow:rgba(168,85,247,.3);--gl:rgba(255,255,255,.035);--blob:.42;--accent:#a78bfa;--good:#34d399;--bad:#fb7185;--gold:#fbbf24}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;padding:12px 14px 40px;font-family:'Plus Jakarta Sans','Hind Siliguri','Segoe UI',system-ui,sans-serif;color:var(--text);background:var(--bg);transition:background .3s,color .3s}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(95px);opacity:var(--blob);animation:drift 26s ease-in-out infinite alternate}
.b1{width:480px;height:480px;background:#0891b2;top:-150px;left:-120px}.b2{width:560px;height:560px;background:#7e22ce;bottom:-220px;right:-160px;animation-duration:32s}
@keyframes drift{to{transform:translate(60px,50px) scale(1.15)}}
.gridbg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}
.wrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;width:100%;max-width:860px;margin:0 auto;min-height:0}
[hidden]{display:none!important}
a:focus-visible,button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
.glass{background:var(--card);border:1.5px solid var(--sec);box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.head{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:12px;border-radius:20px}
.orb{position:relative;flex:0 0 42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;background:radial-gradient(circle at 35% 30%,#fff,#22d3ee 55%,#a855f7);box-shadow:0 0 16px #22d3ee,0 0 30px rgba(168,85,247,.6)}
.orb i{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--good);border:2px solid var(--solid)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;font-weight:800;line-height:1.2}
.ttl small{display:block;font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 12px;font:inherit;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;color:var(--text);background:var(--solid);border:1px solid var(--line);border-radius:12px;transition:transform .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:rgba(168,85,247,.6)}
.btn.sq{width:40px;padding:0;font-size:16px}
.btn.grad{color:#fff;border:0;background:var(--grad)}
.chat{flex:1;display:flex;flex-direction:column;min-height:0;border-radius:24px;overflow:hidden}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.row{display:flex;gap:10px;align-items:flex-end;animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.row.user{flex-direction:row-reverse}
.av{flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;background:var(--grad)}
.row.ai .av{background:radial-gradient(circle at 35% 30%,#fff,#22d3ee 55%,#a855f7)}
.bub{position:relative;max-width:min(78%,640px);padding:11px 15px;border-radius:18px;font-size:15px;line-height:1.7;word-wrap:break-word}
.row.ai .bub{background:rgba(168,85,247,.1);border:1px solid var(--sec);border-bottom-left-radius:4px}
.row.user .bub{color:#fff;background:var(--grad);border-bottom-right-radius:4px;white-space:pre-wrap}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub h4{margin:6px 0 6px;font-size:15.5px;color:var(--accent)}
.bub ul,.bub ol{margin:4px 0 8px;padding-left:22px}.bub li{margin:2px 0}
.bub code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;padding:1px 6px;border-radius:6px;background:var(--solid);border:1px solid var(--line)}
.bub pre{margin:6px 0;padding:10px 12px;overflow-x:auto;border-radius:10px;background:var(--solid);border:1px solid var(--line)}
.bub pre code{padding:0;border:0;background:none}
.acts{display:flex;gap:6px;margin-top:8px}
.acts button{padding:2px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px}
.acts button:hover{color:var(--text);border-color:var(--accent)}
.tm{margin-top:4px;font-size:11px;color:var(--muted)}
.row.user .tm{text-align:right;color:rgba(255,255,255,.75)}
.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--accent);animation:bl 1.2s infinite both}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.err{color:var(--bad);font-weight:600}
.dock{padding:10px 14px 12px;border-top:1.5px solid var(--line);background:var(--card)}
.modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.mode{flex:0 0 auto;padding:6px 14px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted);background:var(--solid);border:1.5px solid var(--line);border-radius:999px;white-space:nowrap}
.mode.on{color:#fff;border-color:transparent;background:var(--grad)}
.sugs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.sug{flex:0 0 auto;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--accent);background:rgba(168,85,247,.08);border:1px dashed var(--sec);border-radius:999px;white-space:nowrap}
.sug:hover{background:rgba(168,85,247,.18)}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inp{flex:1;min-height:46px;max-height:140px;resize:none;padding:12px 16px;font:inherit;font-size:15px;line-height:1.5;color:var(--text);background:var(--solid);border:1.5px solid var(--line);border-radius:16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:#a855f7}
.send{flex:0 0 auto;min-width:78px;height:46px;padding:0 18px;font:inherit;font-size:15px;font-weight:800;cursor:pointer;color:#fff;background:var(--grad);border:0;border-radius:16px;transition:opacity .2s}
.send:disabled{opacity:.45;cursor:default}
.send.stop{background:linear-gradient(135deg,#e11d48,#f59e0b)}
.meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.en{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.en i{display:block;height:100%;width:100%;background:var(--grad);transition:width .4s}
.en.low i{background:linear-gradient(90deg,#fb7185,#f59e0b)}
#eTxt{color:var(--accent)}
.credit{position:fixed;left:0;bottom:0;width:100%;height:30px;z-index:5;display:flex;align-items:center;justify-content:center;font-size:.76rem;letter-spacing:.6px;color:#64748b;background:rgba(5,6,15,.8);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.06)}
[data-theme="light"] .credit{background:rgba(255,255,255,.88);color:#475569;border-top-color:rgba(15,23,42,.1)}
.credit span{margin-left:5px;font-weight:700;background:linear-gradient(90deg,#22d3ee,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@media(max-width:560px){.bub{max-width:88%}.head .lg{display:none}.btn .t{display:none}.send{min-width:56px;padding:0 12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div></div><div class="gridbg"></div>
<div class="wrap">
    <header class="head glass">
        <div class="orb">🧪<i></i></div>
        <div class="ttl"><b>Chemmy AI Assistant</b><small>তোমার পার্সোনাল কেমিস্ট্রি স্টাডি পার্টনার</small></div>
        <button type="button" class="btn sq" id="newBtn" title="নতুন চ্যাট" aria-label="নতুন চ্যাট">🗑️</button>
        <button type="button" class="btn sq" id="themeBtn" title="থিম" aria-label="থিম পরিবর্তন">🌓</button>
        <a class="btn grad" href="index.html">← <span class="t">ড্যাশবোর্ড</span></a>
    </header>
    <main class="chat glass">
        <div class="msgs" id="msgs" role="log" aria-live="polite" aria-label="চ্যাট"></div>

            <div class="modes" id="modes" role="group" aria-label="মোড"></div>

                <textarea class="inp" id="inp" rows="1" maxlength="800" placeholder="তোমার প্রশ্নটা এখানে লিখো..." aria-label="প্রশ্ন লেখো"></textarea>
                <button type="button" class="btn sq" id="mic" style="height:46px;width:46px" title="কথা বলে লেখো" aria-label="মাইক" hidden>🎤</button>
                <button type="button" class="send" id="send">পাঠাও ➤</button>
            </div>
            <div class="meta"><span id="cnt">0/800</span><div class="en" id="en"><i id="eBar"></i></div><span id="eTxt">⚡ CHENERGY 20</span></div>
        </div>
    </main>
</div>

<div class="credit">Developed &amp; Designed by <span>Ahanaf Abid Omlan</span></div>

<script>
/* ===== কনফিগ =====
   PROXY_URL: নিজের এআই সার্ভারের ঠিকানা (chemmy-worker.js ডিপ্লয় করার পর পাওয়া লিংকটি এখানে বসাও)।
   API key সার্ভারে লুকোনো থাকে, এই পেজে কোনো key নেই। */
const PROXY_URL = 'https://chemmy-api.kcasnsc.workers.dev/';
const DAILY_ENERGY = 20, MAXLEN = 800, KEEP = 40, CTX = 12;

const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const bn = n => Number(n).toLocaleString('bn-BD', { useGrouping: false });
const fmtTime = t => new Date(t).toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });

$('themeBtn').addEventListener('click', () => { const nx = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; store.set('theme', nx); document.documentElement.setAttribute('data-theme', nx); });

/* ===== নিরাপদ মার্কডাউন + রাসায়নিক সংকেত ===== */
const SUB = '₀₁₂₃₄₅₆₇₈₉';
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function chem(l) {
    l = l.replace(/&lt;=&gt;|&lt;-&gt;/g, '⇌').replace(/-&gt;/g, '→');
    return l.replace(/(?<![A-Za-z0-9])\d*(?:[A-Z][a-z]?\d*|\((?:[A-Z][a-z]?\d*)+\)\d*)+(?![A-Za-z])/g, m => /\d/.test(m) ? m.replace(/(?<=[A-Za-z)])\d+/g, d => [...d].map(c => SUB[c]).join('')) : m);
}
function md(src) {
    let out = '', inCode = false, list = null; const close = () => { if (list) { out += '</' + list + '>'; list = null; } };
    for (const raw of src.split('\n')) {
        if (/^\s*```/.test(raw)) { close(); out += inCode ? '</code></pre>' : '<pre><code>'; inCode = !inCode; continue; }
        if (inCode) { out += esc(raw) + '\n'; continue; }
        let l = esc(raw); const codes = []; l = l.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
        l = chem(l).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>').replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
        let m;
        if ((m = l.match(/^\s*#{1,4}\s+(.*)/))) { close(); out += '<h4>' + m[1] + '</h4>'; }
        else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += '<li>' + m[1] + '</li>'; }
        else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += '<li>' + m[1] + '</li>'; }
        else { close(); if (l.trim()) out += '<p>' + l + '</p>'; }
    }
    close(); if (inCode) out += '</code></pre>'; return out;
}

/* ===== এনার্জি (প্রতিদিন ২০) ===== */
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
let energy = DAILY_ENERGY;
function loadEnergy() { try { const e = JSON.parse(store.get('chemmy_energy', 'null')); energy = e && e.d === today() ? e.n : DAILY_ENERGY; } catch (e) { energy = DAILY_ENERGY; } paintEnergy(); }
function paintEnergy() { store.set('chemmy_energy', JSON.stringify({ d: today(), n: energy })); $('eBar').style.width = energy / DAILY_ENERGY * 100 + '%'; $('en').classList.toggle('low', energy <= 4); $('eTxt').textContent = '⚡ CHENERGY ' + bn(energy) + '/' + bn(DAILY_ENERGY); }

/* ===== মোড, সাজেশন, সিস্টেম প্রম্পট ===== */
const MODES = {
    explain: { n: '💬 ব্যাখ্যা', s: ['মোলারিটি কী সহজে বুঝিয়ে দাও', 'আইসোটোপ ও আইসোবারের পার্থক্য', 'অ্যাসিড-ক্ষার কীভাবে চেনা যায়', 'লে শাটেলিয়ারের নীতি কী'] },
    calc: { n: '🧮 অঙ্ক', s: ['4g NaOH দিয়ে 250 mL দ্রবণের মোলারিটি বের করো', '27°C এ 2 L গ্যাসের চাপ 1 atm হলে 4 atm এ আয়তন কত', '0.5 mol H2SO4 এর ভর কত', 'pH 3 দ্রবণে [H+] কত'] },
    quiz: { n: '🎯 কুইজ', s: ['পর্যায় সারণি নিয়ে কুইজ নাও', 'IUPAC নামকরণ নিয়ে কুইজ', 'গ্যাসের সূত্র নিয়ে কুইজ', 'অম্ল-ক্ষারক নিয়ে কুইজ'] },
    note: { n: '📝 নোট', s: ['বয়েল ও চার্লসের সূত্রের নোট', 'ক্ষারধাতুর ধর্মের নোট', 'জারণ-বিজারণের নোট', 'অ্যালকোহলের বিক্রিয়ার নোট'] }
};
let mode = store.get('chemmy_mode', 'explain'); if (!MODES[mode]) mode = 'explain';
function renderModes() {
    const m = $('modes'); m.replaceChildren();
    Object.entries(MODES).forEach(([k, d]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'mode' + (k === mode ? ' on' : ''); b.textContent = d.n; b.setAttribute('aria-pressed', String(k === mode)); b.addEventListener('click', () => { mode = k; store.set('chemmy_mode', k); renderModes(); }); m.appendChild(b); });
    const s = $('sugs'); s.replaceChildren();
    MODES[mode].s.forEach(t => { const b = document.createElement('button'); b.type = 'button'; b.className = 'sug'; b.textContent = t; b.addEventListener('click', () => { $('inp').value = t; send(); }); s.appendChild(b); });
}

/* ===== চ্যাট ইন্টারফেস ===== */
let hist = []; try { hist = JSON.parse(store.get('chemmy_hist', '[]')) || []; } catch (e) { hist = []; }
let busy = false, ctrl = null;
const GREET = 'হায়! আমি Chemmy। আমি কেবল তোমার কেমিস্ট্রি ও পড়াশোনা বিষয়ক স্টাডি পার্টনার। সাধারণ আড্ডা বা গল্প এখানে করা যাবে না। বলো, আজ রসায়নের কোন বিষয়টি নিয়ে পড়াশোনা করবে? 🧪✨\n\nউপরের মোড থেকে **ব্যাখ্যা, অঙ্ক, কুইজ বা নোট** বেছে নিতে পারো।';
const saveHist = () => store.set('chemmy_hist', JSON.stringify(hist.slice(-KEEP)));
function addRow(role, text, t, opts) {
    const row = document.createElement('div'); row.className = 'row ' + role; const av = document.createElement('div'); av.className = 'av'; av.textContent = role === 'ai' ? '' : 'তু';
    const bub = document.createElement('div'); bub.className = 'bub'; if (role === 'ai') bub.innerHTML = md(text); else bub.textContent = text;
    if (t) { const tm = document.createElement('div'); tm.className = 'tm'; tm.textContent = fmtTime(t); bub.appendChild(tm); }
    row.append(av, bub); $('msgs').appendChild(row); scrollDown(); return { row, bub };
}
const scrollDown = () => { const m = $('msgs'); m.scrollTop = m.scrollHeight; };
function addActions(bub, text, isLast) {
    const a = document.createElement('div'); a.className = 'acts'; const c = document.createElement('button'); c.type = 'button'; c.textContent = '📋 কপি';
    c.addEventListener('click', () => { const done = () => { c.textContent = '✔ কপি হয়েছে'; setTimeout(() => c.textContent = '📋 কপি', 1500); }; if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => {}); else done(); }); a.appendChild(c);
    if (isLast) { const r = document.createElement('button'); r.type = 'button'; r.textContent = '🔄 আবার'; r.addEventListener('click', regen); a.appendChild(r); } bub.appendChild(a);
}
function renderAll() {
    $('msgs').replaceChildren(); if (!hist.length) addRow('ai', GREET);
    hist.forEach((m, i) => { const r = addRow(m.role, m.text, m.t); if (m.role === 'ai' && !m.err) addActions(r.bub, m.text, i === hist.length - 1); });
}
function setBusy(b) { busy = b; const s = $('send'); s.textContent = b ? '⏹ থামাও' : 'পাঠাও ➤'; s.classList.toggle('stop', b); $('inp').disabled = b; }

/* ===== মডেল কল (স্ট্রিমিং) ===== */
async function callModel(onText, signal) {
    if (!PROXY_URL) throw { status: 'noserver' };
    const messages = hist.filter(m => !m.err).slice(-CTX).map(m => ({ role: m.role, text: m.text }));
    const r = await fetch(PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode, messages }), signal });
    if (!r.ok) throw { status: r.status };
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '', full = '';
    for (;;) { const { done, value } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true }); const lines = buf.split('\n'); buf = lines.pop();
        for (const ln of lines) { if (!ln.startsWith('data:')) continue; try { const j = JSON.parse(ln.slice(5)); const p = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts; if (p) { full += p.map(x => x.text || '').join(''); onText(full); } } catch (e) {} } }
    return full;
}
const ERR = { noserver: 'এআই সার্ভার এখনো সংযুক্ত হয়নি, একটু পরে আবার চেষ্টা করো।', 400: 'অনুরোধটি গ্রহণ করা যায়নি, প্রশ্নটি একটু ছোট করে আবার লেখো।', 403: 'এই পেজ থেকে এআই ব্যবহারের অনুমতি নেই।', 429: 'অনেক বেশি রিকোয়েস্ট হয়ে গেছে, একটু পরে আবার চেষ্টা করো।', 500: 'সার্ভারে সমস্যা হচ্ছে, কিছুক্ষণ পরে আবার চেষ্টা করো।', 502: 'এআই এই মুহূর্তে ব্যস্ত, কিছুক্ষণ পরে আবার চেষ্টা করো।' };
async function reply() {
    setBusy(true); ctrl = new AbortController(); const { row, bub } = addRow('ai', ''); bub.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>'; let raf = 0, text = '';
    const paint = t => { text = t; if (!raf) raf = requestAnimationFrame(() => { raf = 0; bub.innerHTML = md(text); scrollDown(); }); };
    try {
        const t = await callModel(paint, ctrl.signal); cancelAnimationFrame(raf); text = t || text;
        if (!text.trim()) throw { status: 'empty' };
        hist.push({ role: 'ai', text, t: Date.now() }); bub.innerHTML = md(text); const tm = document.createElement('div'); tm.className = 'tm'; tm.textContent = fmtTime(Date.now()); bub.appendChild(tm); addActions(bub, text, true);
    } catch (e) {
        cancelAnimationFrame(raf);
        if (e && e.name === 'AbortError') { if (text.trim()) { hist.push({ role: 'ai', text: text + '\n\n_(থামানো হয়েছে)_', t: Date.now() }); } else { row.remove(); energy++; paintEnergy(); } renderAll(); }
        else { const m = ERR[e && e.status] || (e && e.status === 'empty' ? 'কোনো উত্তর পাওয়া যায়নি, আবার চেষ্টা করো।' : 'নেটওয়ার্ক সংযোগে সমস্যা হয়েছে! ইন্টারনেট দেখে আবার চেষ্টা করো।'); bub.innerHTML = '<span class="err">⚠️ ' + esc(m) + '</span>'; energy++; paintEnergy(); }
    }
    saveHist(); setBusy(false); ctrl = null; $('inp').focus(); scrollDown();
}
function send() {
    if (busy) { if (ctrl) ctrl.abort(); return; }
    const inp = $('inp'), text = inp.value.trim(); if (!text) return;
    if (energy <= 0) { addRow('ai', '⚡ আজকের CHENERGY শেষ। কাল আবার ২০ এনার্জি পাবে, তখন নতুন করে শুরু করো! ততক্ষণ পুরোনো নোটগুলো রিভিশন দিয়ে ফেলো 📚'); return; }
    energy--; paintEnergy(); hist.push({ role: 'user', text, t: Date.now() }); inp.value = ''; autosize(); cnt(); renderAll(); saveHist(); reply();
}
function regen() {
    if (busy) return; if (energy <= 0) { addRow('ai', '⚡ আজকের CHENERGY শেষ।'); return; }
    while (hist.length && hist[hist.length - 1].role === 'ai') hist.pop(); if (!hist.length) return; energy--; paintEnergy(); renderAll(); reply();
}
$('send').addEventListener('click', send);
$('inp').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
const autosize = () => { const i = $('inp'); i.style.height = 'auto'; i.style.height = Math.min(140, i.scrollHeight) + 'px'; };
const cnt = () => { $('cnt').textContent = $('inp').value.length + '/' + MAXLEN; };
$('inp').addEventListener('input', () => { autosize(); cnt(); });
$('newBtn').addEventListener('click', () => { if (busy && ctrl) ctrl.abort(); if (!hist.length || confirm('চ্যাটের সব মেসেজ মুছে নতুন চ্যাট শুরু করবে?')) { hist = []; saveHist(); renderAll(); } });

/* ===== মাইক ===== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) { $('mic').hidden = false; let rec = null, on = false;
    $('mic').addEventListener('click', () => { if (on && rec) { rec.stop(); return; } rec = new SR(); rec.lang = 'bn-BD'; rec.interimResults = false; on = true; $('mic').textContent = '⏺';
        rec.onresult = e => { $('inp').value = ($('inp').value + ' ' + e.results[0][0].transcript).trim(); autosize(); cnt(); }; rec.onend = () => { on = false; $('mic').textContent = '🎤'; }; rec.onerror = () => { on = false; $('mic').textContent = '🎤'; }; try { rec.start(); } catch (e) { on = false; $('mic').textContent = '🎤'; } }); }


loadEnergy(); renderModes(); renderAll(); cnt();
</script>
