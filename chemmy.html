<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemmy AI - রসায়ন সহকারী</title>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #e2e8f0;
            --shadow: rgba(15, 23, 42, 0.08);
            --section-border: rgba(168, 85, 247, 0.3);
        }
        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f8fafc;
            --border-color: #1f2937;
            --shadow: rgba(0, 0, 0, 0.5);
            --section-border: rgba(168, 85, 247, 0.4);
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Top Navigation/Header */
        .chemmy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 2px solid var(--section-border);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px var(--shadow);
            margin-bottom: 30px;
        }
        .back-btn {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .back-btn:hover { opacity: 0.9; transform: scale(1.02); }

        /* Chat Interface */
        .chat-box {
            background: var(--card-bg);
            border: 2px solid var(--section-border);
            border-radius: 24px;
            box-shadow: 0 10px 25px var(--shadow);
            display: flex;
            flex-direction: column;
            height: 600px;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 75%;
            padding: 15px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.ai {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid var(--section-border);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Loading Animation */
        .message.loading span {
            display: inline-block;
            animation: blinkLoading 1.4s infinite both;
            font-size: 20px;
        }
        .message.loading span:nth-child(2) { animation-delay: .2s; }
        .message.loading span:nth-child(3) { animation-delay: .4s; }
        @keyframes blinkLoading {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }

        /* Chat Input Area */
        .chat-input-area-wrapper {
            background: var(--card-bg);
            border-top: 2px solid var(--border-color);
            padding: 15px 20px;
        }

        .chat-input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input:focus {
            border-color: #a855f7;
        }

        .send-btn {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-btn:hover { opacity: 0.9; }

        /* Energy Bar Footer */
        .energy-status {
            text-align: center;
            font-size: 13px;
            color: #a855f7;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="chemmy-header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div style="font-size: 32px;">🧪</div>
                <div>
                    <h2 style="margin: 0; font-size: 20px;">Chemmy AI Assistant</h2>
                    <span style="font-size: 13px; color: #a855f7; font-weight: 600;">তোমার  পার্সোনাল কেমিস্ট্রি স্টাডি পার্টনার</span>
                </div>
            </div>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> ড্যাশবোর্ডে ফিরুন</a>
        </div>

        <!-- Chat Box -->
        <div class="chat-box">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
  হায়! আমি Chemmy। আমি কেবল তোমার কেমিস্ট্রি ও পড়াশোনা বিষয়ক স্টাডি পার্টনার। সাধারণ আড্ডা বা গল্প এখানে করা যাবে না। বলো, আজ রসায়নের কোন বিষয়টি নিয়ে পড়াশোনা করবে? 🧪✨
                </div>
            </div>

            <div class="chat-input-area-wrapper">
                <div class="chat-input-area">
                    <input type="text" id="userInput" class="chat-input" placeholder="তোমার প্রশ্নটা এখানে লিখো..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">পাঠাও <i class="fas fa-paper-plane"></i></button>
                </div>
                <div class="energy-status">
                    ⚡ CHENERGY 20
                </div>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const messageText = input.value.trim();
            if (messageText === '') return;

            const chatMessages = document.getElementById('chatMessages');

            // ইউজারের মেসেজ যোগ করা
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = messageText;
            chatMessages.appendChild(userMsg);

            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // লোডিং অ্যানিমেশন
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message ai loading';
            loadingMsg.innerHTML = 'Chemmy ভাবছে<span>.</span><span>.</span><span>.</span>';
            chatMessages.appendChild(loadingMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // রিয়েল Gemini API কল (আপনার এপিআই কি এখানে বসান)
                const apiKey = "AQ.Ab8RN6JA_-npgVEDm_aCbleYAEqLdUTSOu7ppFd8L6S5AUXYjw"; 
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "তুমি একজন কেমিস্ট্রি স্টাডি পার্টনার (Chemmy)। শুধুমাত্র রসায়ন ও বিজ্ঞান পড়াশোনা সংক্রান্ত প্রশ্নের উত্তর দেবে। প্রশ্ন: " + messageText }]
                        }]
                    })
                });

                const data = await response.json();
                chatMessages.removeChild(loadingMsg);

                let aiReply = "দুঃখিত, এই মুহূর্তে উত্তর দিতে সমস্যা হচ্ছে। আবার চেষ্টা করো!";
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiReply = data.candidates[0].content.parts[0].text;
                }

                // এআই-এর উত্তর চ্যাটবক্সে দেখানো
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.innerHTML = aiReply;
                chatMessages.appendChild(aiMsg);

            } catch (error) {
                chatMessages.removeChild(loadingMsg);
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message ai';
                errorMsg.innerText = "নেটওয়ার্ক সংযোগে সমস্যা হয়েছে!";
                chatMessages.appendChild(errorMsg);
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
