<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Elementa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one card table. Opponents across the top, draw and discard piles centred over a glow in the active family's colour, your hand fanned along the bottom. */
:root{
  color-scheme: dark;
  --bg:#090d13; --panel:#111923; --panel2:#17212d; --line:#263446;
  --fg:#e8eef6; --mute:#8896a9;
  --f0:#e5533d; --f1:#eba72b; --f2:#25a872; --f3:#4a86e8;
  --sans:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:400 15px/1.45 var(--sans);
  background-image:radial-gradient(color-mix(in srgb,var(--fg) 9%,transparent) 1px,transparent 1.3px);
  background-size:24px 24px;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
#app{
  min-height:100%; max-width:1040px; margin:0 auto;
  display:flex; flex-direction:column; gap:10px;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand svg{width:30px;height:30px;flex:none;color:var(--fg)}
.brand b{font:700 22px/1 var(--sans);letter-spacing:-.02em;font-variation-settings:'opsz' 48}
.brand small{display:block;font:500 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.dirpill{display:flex;align-items:center;gap:6px;font:500 11.5px/1 var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:7px 11px;background:var(--panel)}
.dirpill svg{width:15px;height:15px;transition:transform .35s}
.dirpill.rev svg{transform:scaleX(-1)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13.5px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel2);border-color:color-mix(in srgb,var(--fg) 30%,var(--line))}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{background:#fff}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* opponents */
.opps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opp{position:relative;display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);min-width:0;transition:border-color .2s,box-shadow .2s}
.opp.turn{border-color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 14%,transparent)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--sans);background:var(--panel2);border:1px solid var(--line)}
.oi{min-width:0;display:flex;flex-direction:column}
.oi b{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oi span{font-size:11.5px;color:var(--mute)}
.mini{display:flex;margin-left:auto;padding-left:9px;flex:none}
.mini i{display:block;width:13px;height:19px;border-radius:3px;margin-left:-8px;background:linear-gradient(160deg,#243246,#121b26);border:1px solid #33465c;transform:rotate(calc((var(--j) - 2) * 6deg))}
.mb{position:absolute;right:8px;top:-9px;font:700 10px/1 var(--mono);font-style:normal;letter-spacing:.08em;background:var(--f1);color:#1c1304;padding:4px 6px;border-radius:6px;animation:pulse 1s infinite}
.dots{position:absolute;left:50px;bottom:5px;display:flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

/* table */
.table{
  position:relative; flex:1; min-height:200px;
  display:flex; align-items:center; justify-content:center; gap:clamp(22px,8vw,72px);
  border-radius:22px; border:1px solid var(--line);
  background:
    radial-gradient(ellipse 60% 70% at 66% 50%, color-mix(in srgb,var(--glow,var(--f0)) 30%,transparent), transparent 70%),
    linear-gradient(180deg,#0d141d,#0a1018);
  transition:background .5s; overflow:hidden; padding:14px 8px;
}
.table::before{content:"";position:absolute;inset:0;background:
  repeating-radial-gradient(circle at 66% 50%,transparent 0 46px,color-mix(in srgb,var(--fg) 5%,transparent) 46px 47px);pointer-events:none}
.pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;z-index:1}
.pile .card{--cw:clamp(84px,25vw,128px)}
.draw{cursor:pointer}
.stack{position:relative;width:var(--cwp,clamp(84px,25vw,128px));aspect-ratio:5/7}
.stack .card{position:absolute;inset:0}
.stack .card:nth-child(1){transform:translate(-5px,5px) rotate(-3deg)}
.stack .card:nth-child(2){transform:translate(-2.5px,2.5px) rotate(-1deg)}
.draw.can .stack .card:last-child{box-shadow:0 0 0 2px color-mix(in srgb,var(--fg) 55%,transparent),0 14px 30px -10px #000}
.draw.hint .stack{animation:nudge 1.1s ease-in-out infinite}
.cap{font:500 11.5px/1 var(--mono);letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--mono);padding:6px 9px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.chip i{width:9px;height:9px;border-radius:50%}

/* info */
.info{display:grid;gap:8px}
.status{font-weight:600;font-size:15.5px;min-height:23px}
.status b{font-weight:750}
.event{font-size:13px;color:var(--mute);min-height:19px}
.lab{display:flex;gap:11px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);min-height:58px}
.lsym{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font:700 21px/1 var(--sans);background:var(--panel2);border:1px solid var(--line)}
.lab div{min-width:0;font-size:13px;line-height:1.4}
.lab b{font-weight:700}
.lab .mono{font-size:11.5px;color:var(--mute);margin-left:4px}
.lab p{margin:2px 0 0;color:#b9c4d2}

/* hand */
.handbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.handbar span{font:500 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.hand{--ov:.4;display:flex;overflow-x:auto;overflow-y:hidden;padding:26px 12px 14px;margin:-8px -4px 0;scrollbar-width:thin}
.hand::before,.hand::after{content:"";margin:auto}
.hand .card{--cw:clamp(66px,17.5vw,104px);flex:none;transition:transform .18s,filter .2s,box-shadow .2s}
.hand .card+.card{margin-left:calc(var(--cw) * var(--ov) * -1)}
.hand .card.ok{transform:translateY(-16px);box-shadow:0 0 0 2px color-mix(in srgb,var(--fg) 70%,transparent),0 16px 30px -10px #000}
.hand .card.ok:hover{transform:translateY(-28px) scale(1.05);z-index:6}
.hand .card.no{filter:saturate(.55) brightness(.62)}
.hand .card.fresh{animation:deal .5s cubic-bezier(.2,.9,.3,1.15) both}
.hand .card.shake{animation:shake .35s}
@media (min-width:760px){
  .pile .card,.stack{--cw:132px;--cwp:132px}
  .hand .card{--cw:104px}
  .brand b{font-size:26px}
}

/* cards */
.card{
  --top:#e85a43;--end:#a82b1a;--ink:#fff;
  container-type:inline-size; position:relative; display:block;
  width:var(--cw); aspect-ratio:5/7; border-radius:calc(var(--cw) * .09);
  background:linear-gradient(155deg,var(--top),var(--end));
  color:var(--ink); cursor:default; user-select:none; -webkit-user-select:none;
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 12px 26px -12px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.55);
}
.hand .card{cursor:pointer}
.card.f0{--top:#e85a43;--end:#a82b1a;--ink:#fff}
.card.f1{--top:#f6c254;--end:#d9921a;--ink:#1c1304}
.card.f2{--top:#22a56f;--end:#0c6444;--ink:#fff}
.card.f3{--top:#4a86e8;--end:#1f4ea8;--ink:#fff}
.card::after{content:"";position:absolute;inset:5cqw;border:.6cqw solid color-mix(in srgb,var(--ink) 34%,transparent);border-radius:6cqw;pointer-events:none}
.card .z{position:absolute;left:9cqw;top:8cqw;font:600 12cqw/1 var(--mono)}
.card .z svg{width:13cqw;height:13cqw;display:block}
.card .val{position:absolute;right:8cqw;top:7cqw;width:17cqw;height:17cqw;border-radius:50%;display:grid;place-items:center;font:600 11cqw/1 var(--mono);border:.9cqw solid currentColor;background:rgba(0,0,0,.16)}
.card .sym{position:absolute;left:0;right:0;top:50%;transform:translateY(-56%);text-align:center;font:700 44cqw/1 var(--sans);letter-spacing:-.04em;font-variation-settings:'opsz' 96}
.card .glyph{position:absolute;left:50%;top:48%;width:42cqw;height:42cqw;transform:translate(-50%,-50%)}
.card .glyph svg{width:100%;height:100%;display:block}
.card .nm{position:absolute;left:0;right:0;bottom:9cqw;text-align:center;font:650 10.5cqw/1 var(--sans);letter-spacing:.03em}
.card.wild{--ink:#fff;background:radial-gradient(circle at 28% 18%,#1d2938,#090e14)}
.card .disc{position:absolute;left:50%;top:47%;width:54cqw;height:54cqw;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 45deg,var(--f0) 0 25%,var(--f1) 0 50%,var(--f2) 0 75%,var(--f3) 0);box-shadow:0 0 0 1.4cqw rgba(255,255,255,.92),0 0 0 3cqw rgba(255,255,255,.12)}
.card .disc::after{content:"";position:absolute;left:50%;top:50%;width:15cqw;height:15cqw;transform:translate(-50%,-50%);border-radius:50%;background:#0b1118;box-shadow:0 0 0 1.2cqw #fff}
.card.back{background:linear-gradient(160deg,#1a2535,#0b121a);color:#7f95ad}
.card.back svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.card.back::after{border-color:#2a3b50}
.discard .card.pop{animation:land .4s cubic-bezier(.2,.9,.3,1.1)}
.discard .card{transform:rotate(var(--rot,0deg))}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(4,7,11,.74);backdrop-filter:blur(6px)}
.sheet{width:min(440px,100%);max-height:92%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 30px 80px -20px #000}
.sheet h2{margin:4px 0 14px;font:700 21px/1.25 var(--sans);letter-spacing:-.01em;text-wrap:balance}
.sheet p{margin:0 0 12px;color:#b9c4d2}
.mtag{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;cursor:pointer;font-weight:550}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:600 12px/1 var(--mono);background:var(--bg);color:var(--mute)}
.opt.right{background:color-mix(in srgb,var(--f2) 30%,var(--panel2));border-color:var(--f2)}
.opt.wrong{background:color-mix(in srgb,var(--f0) 30%,var(--panel2));border-color:var(--f0)}
.opt:disabled{cursor:default}
.qbar{height:4px;border-radius:4px;background:var(--panel2);margin:14px 0 4px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--fg);transform-origin:left;animation:bar linear forwards}
.link{display:block;margin:10px auto 0;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:13px;padding:6px}
.fams{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fam{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border-radius:14px;padding:14px 12px;border:1px solid rgba(255,255,255,.14);cursor:pointer;min-height:84px;justify-content:flex-end}
.fam b{font-weight:700;font-size:14px;line-height:1.2}
.fam.f0{background:linear-gradient(155deg,#e85a43,#a82b1a);color:#fff}
.fam.f1{background:linear-gradient(155deg,#f6c254,#d9921a);color:#1c1304}
.fam.f2{background:linear-gradient(155deg,#22a56f,#0c6444);color:#fff}
.fam.f3{background:linear-gradient(155deg,#4a86e8,#1f4ea8);color:#fff}
.fam:hover{transform:translateY(-2px)}
.rules{display:grid;gap:9px;margin:0 0 14px;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:13.5px;color:#c4cedb}
.rules li b{color:var(--fg);font-weight:700}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.score{display:grid;gap:6px;margin:0 0 14px;font:500 12.5px/1.3 var(--mono);color:var(--mute)}
.score div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px}

/* mole + toast */
.mole{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:40;display:grid;gap:10px;justify-items:center}
.molebtn{border:0;cursor:pointer;border-radius:99px;padding:18px 34px;font:800 26px/1 var(--sans);letter-spacing:.04em;background:var(--f1);color:#1c1304;box-shadow:0 0 0 6px color-mix(in srgb,var(--f1) 30%,transparent),0 20px 50px -10px #000;animation:pulse .7s infinite}
.molebar{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.molebar i{display:block;height:100%;background:#fff;transform-origin:left;animation:bar 2.2s linear forwards}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);z-index:45;font:700 15px/1 var(--sans);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none}
.toast.on{animation:toast 1.5s ease forwards}
[hidden]{display:none!important}

@keyframes pulse{50%{transform:scale(1.06)}}
.mole .molebtn{animation-name:molepulse}
@keyframes molepulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--f1) 22%,transparent),0 20px 50px -10px #000}}
@keyframes blink{50%{opacity:.25}}
@keyframes bar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes deal{from{opacity:0;transform:translateY(-90px) rotate(-8deg) scale(.7)}}
@keyframes land{from{opacity:0;transform:rotate(var(--rot,0deg)) scale(1.4) translateY(-30px)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes nudge{50%{transform:translateY(-6px)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){
  .brand small{display:none}
  .opp{padding:8px;gap:7px}
  .av{width:28px;height:28px;font-size:14px}
  .mini{display:none}
  .btn{padding:7px 10px;font-size:13px}
}
</style>

<div id="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><ellipse cx="16" cy="16" rx="13" ry="5.5"/><ellipse cx="16" cy="16" rx="13" ry="5.5" transform="rotate(60 16 16)"/><ellipse cx="16" cy="16" rx="13" ry="5.5" transform="rotate(120 16 16)"/><circle cx="16" cy="16" r="2.6" fill="currentColor" stroke="none"/></svg>
      <div><b>Elementa</b><small>The periodic card game</small></div>
    </div>
    <div class="dirpill" id="dir"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg><span id="dirTxt">Play order</span></div>
    <button class="btn" id="btnRules">Rules</button>
    <button class="btn" id="btnNew">New game</button>
  </header>

  <section class="opps" id="opps" aria-label="Opponents"></section>

  <section class="table" id="table" aria-label="Table">
    <div class="pile draw" id="drawPile" role="button" tabindex="0" aria-label="Draw a card">
      <div class="stack" id="stack"></div>
      <span class="cap" id="drawCap"></span>
    </div>
    <div class="pile discard" id="discard"></div>
  </section>

  <section class="info" aria-live="polite">
    <div class="status" id="status"></div>
    <div class="event" id="event"></div>
    <div class="lab" id="lab"></div>
  </section>

  <section>
    <div class="handbar">
      <span id="handCount"></span>
      <button class="btn primary" id="btnKeep" hidden>Keep the card</button>
    </div>
    <div class="hand" id="hand" aria-label="Your hand"></div>
  </section>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="mole" id="mole" hidden></div>
<div class="toast" id="toast" role="status"></div>

/* ---------- helpers ---------- */
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function label(c){return c.kind==='el'?c.name:ACT[c.kind].name;}
function isWild(c){return c.kind==='wild'||c.kind==='w4';}

var G=null, token=0, humanWait=null, shownTop=-1;

function buildDeck(){
  var id=0,d=[];
  EL.forEach(function(e){d.push({id:'c'+(id++),kind:'el',fam:e[0],z:e[1],sym:e[2],name:e[3],val:e[4],fact:e[5]});});
  for(var f=0;f<4;f++){['skip','rev','d2'].forEach(function(k){for(var i=0;i<2;i++)d.push({id:'c'+(id++),kind:k,fam:f});});}
  for(var i=0;i<4;i++){d.push({id:'c'+(id++),kind:'wild',fam:null});d.push({id:'c'+(id++),kind:'w4',fam:null});}
  return d;
}
function step(from,k){var n=G.players.length;return (((from+G.dir*k)%n)+n)%n;}
function nm(i){return G.players[i].name;}

function canPlay(card,hand){
  var top=G.top;
  if(card.kind==='wild')return true;
  if(card.kind==='w4')return !hand.some(function(c){return c!==card&&c.fam!==null&&c.fam===G.color;});
  if(card.fam===G.color)return true;
  if(card.kind==='el'&&top.kind==='el'&&card.val===top.val)return true;
  if(card.kind!=='el'&&card.kind===top.kind)return true;
  return false;
}
function reshuffle(){
  var top=G.discard.pop();
  G.pile=shuffle(G.discard);
  G.discard=[top];
}
function drawCards(pi,n){
  var got=[];
  for(var i=0;i<n;i++){
    if(!G.pile.length)reshuffle();
    if(!G.pile.length)break;
    var c=G.pile.pop();
    G.players[pi].hand.push(c);
    got.push(c);
    G.newIds.add(c.id);
  }
  return got;
}
function say(t){G.msg=t;renderInfo();}
function flash(t){var e=$('#toast');e.textContent=t;e.classList.remove('on');void e.offsetWidth;e.classList.add('on');}

}
function backHTML(){return '<div class="card back">'+backSVG()+'</div>';}

function cardHTML(c,o){
  o=o||{};
  var cls=['card'];
  cls.push(c.fam!==null?'f'+c.fam:'wild');
  if(o.cls)cls.push(o.cls);
  var lab=c.kind==='el'?(c.name+', valency '+c.val+', '+FAM[c.fam].name):(ACT[c.kind].name+'. '+ACT[c.kind].sub);
  var attrs=o.hand?('data-id="'+c.id+'" role="button" tabindex="0" aria-label="'+lab+'"'):('aria-label="'+lab+'"');
  var inner;
  if(c.kind==='el')inner='<span class="z">'+c.z+'</span><span class="val" title="Valency">'+c.val+'</span><b class="sym">'+c.sym+'</b><span class="nm">'+c.name+'</span>';
  else if(c.kind==='skip')inner='<span class="z">'+ICON.skip+'</span><span class="glyph">'+ICON.skip+'</span><span class="nm">Inert</span>';
  else if(c.kind==='rev')inner='<span class="z">'+ICON.rev+'</span><span class="glyph">'+ICON.rev+'</span><span class="nm">Equilibrium</span>';
  else if(c.kind==='d2')inner='<span class="z">+2</span><b class="sym">+2</b><span class="nm">Precipitate</span>';
  else if(c.kind==='wild')inner='<span class="disc"></span><span class="nm">Catalyst</span>';
  else inner='<span class="z">+4</span><span class="disc"></span><span class="nm">Acid Rain</span>';
  return '<div class="'+cls.join(' ')+'" '+attrs+(o.style?' style="'+o.style+'"':'')+'>'+inner+'</div>';
}

function statusHTML(){
  if(G.over)return 'Game over.';
  if(G.phase==='human'){
    if(G.drawn)return 'You drew <b>'+label(G.drawn)+'</b>. Play it, or keep it.';
    var s='Your turn. Match <b>'+FAM[G.color].short+'</b>';
    if(G.top.kind==='el')s+=' or valency <b>'+G.top.val+'</b>';
    return s+'. Stuck? Draw.';
  }
  if(G.phase==='bot')return nm(G.turn)+' is thinking…';
  return '&nbsp;';
}

function render(){
  if(!G)return;

  var human=G.phase==='human'&&!G.over;
  var ok={};var okN=0;

  $('#opps').innerHTML=G.players.slice(1).map(function(p,k){
    var i=k+1,on=G.turn===i&&!G.over,n=p.hand.length,st='';

  }).join('');

  $('#table').style.setProperty('--glow','var(--f'+G.color+')');
  var canDraw=human&&!G.drawn;
  $('#drawPile').className='pile draw'+(canDraw?' can':'')+(canDraw&&okN===0?' hint':'');
  $('#drawCap').textContent='Draw · '+G.pile.length;

  var pop=shownTop!==G.topKey;shownTop=G.topKey;
  var rot=((parseInt(G.top.id.slice(1),10)*37)%17)-8;
  $('#discard').innerHTML=cardHTML(G.top,{cls:pop?'pop':'',style:'--rot:'+rot+'deg'})+
    '<div class="chips"><span class="chip"><i style="background:var(--f'+G.color+')"></i>'+FAM[G.color].name+'</span>'+(G.top.kind==='el'?'<span class="chip">valency '+G.top.val+'</span>':'')+'</div>';

  var sorted=me.hand.slice().sort(function(a,b){
    return (a.fam===null?9:a.fam)-(b.fam===null?9:b.fam)||((a.kind==='el'?0:1)-(b.kind==='el'?0:1))||((a.val||0)-(b.val||0))||(a.z||0)-(b.z||0);
  });
  $('#hand').innerHTML=sorted.map(function(c){
    var cls='';
    if(human)cls=ok[c.id]?'ok':'no';
    if(G.newIds.has(c.id))cls+=' fresh';
    return cardHTML(c,{hand:true,cls:cls});
  }).join('');
  G.newIds.clear();
  $('#handCount').textContent='Your hand · '+me.hand.length;
  $('#btnKeep').hidden=!(human&&G.drawn);
  $('#dir').className='dirpill'+(G.dir<0?' rev':'');
  $('#dirTxt').textContent='Play order '+(G.dir>0?'→':'←');
  renderInfo();
  fitHand();
}
function fitHand(){
  var h=$('#hand');if(!h)return;
  var cs=h.querySelectorAll('.card');if(!cs.length)return;
  var n=cs.length,cw=cs[0].offsetWidth;if(!cw)return;
  var avail=h.clientWidth-28;
  var ov=0.06;
  if(n>1){
    var need=(avail-cw)/(n-1);
    var stepw=Math.min(cw*1.05,Math.max(cw*0.36,need));
    ov=1-stepw/cw;
  }
  h.style.setProperty('--ov',ov.toFixed(3));
}

function quizShield(n){
  return new Promise(function(res){
    if(!G.qdeck.length)G.qdeck=shuffle(Q.map(function(_,i){return i;}));
    var q=Q[G.qdeck.pop()];
    var opts=shuffle(q.slice(1).map(function(t,i){return {t:t,ok:i===0};}));
    var locked=false,tm=null;
    openModal('<div class="mtag">Shield test · blocks +'+n+'</div><h2>'+q[0]+'</h2><div class="opts">'+
      opts.map(function(o,i){return '<button class="opt" data-i="'+i+'"><span class="k">'+'ABCD'.charAt(i)+'</span><span>'+o.t+'</span></button>';}).join('')+
      '</div><div class="qbar"><i style="animation-duration:15s"></i></div><button class="link" id="qSkip">Skip and take the '+n+' cards</button>');
    function reveal(chosen){
      Array.prototype.forEach.call($('#sheet').querySelectorAll('.opt'),function(b,i){
        b.disabled=true;
        if(opts[i].ok)b.classList.add('right');
        else if(i===chosen)b.classList.add('wrong');
      });
    }
    function finish(v,delay){
      locked=true;clearTimeout(tm);
      setTimeout(function(){G.abort=null;closeModal();res(v);},delay);
    }
    G.abort=function(){locked=true;clearTimeout(tm);res(null);};
    Array.prototype.forEach.call($('#sheet').querySelectorAll('.opt'),function(b){
      b.onclick=function(){
        if(locked)return;
        var i=+b.dataset.i;reveal(i);finish(opts[i].ok,1100);

    });
    $('#qSkip').onclick=function(){if(locked)return;finish(false,0);};
    tm=setTimeout(function(){if(locked)return;reveal(-1);finish(false,1100);},15000);
  });
}

/* ---------- game flow ---------- */
function newGame(){
  token++;var tk=token;
  if(G&&G.abort){try{G.abort();}catch(e){}}
  if(humanWait){var r=humanWait;humanWait=null;r({type:'abort'});}
  closeModal();hideMole();
  var players=[{name:'You',human:true,hand:[]},{name:'Curie',hand:[]},{name:'Mendeleev',hand:[]},{name:'Lavoisier',hand:[]}];
  G={players:players,pile:shuffle(buildDeck()),discard:[],top:null,color:0,dir:1,turn:0,phase:'wait',drawn:null,msg:'',over:false,newIds:new Set(),lastEl:null,shields:0,qdeck:[],abort:null,topKey:0,picking:false};
  for(var r2=0;r2<7;r2++)players.forEach(function(p){p.hand.push(G.pile.pop());});
  var c,skipped=[];
  for(;;){c=G.pile.pop();if(c.kind==='el')break;skipped.push(c);}
  G.pile=skipped.concat(G.pile);
  G.discard.push(c);G.top=c;G.color=c.fam;G.lastEl=c;
  players[0].hand.forEach(function(x){G.newIds.add(x.id);});
  G.msg='Seven cards each. Match the top card by family colour or by valency.';
  render();run(tk);
}

async function run(tk){
  while(!G.over&&tk===token){
    var p=G.players[G.turn];
    if(p.human)await humanTurn(tk);else await botTurn(tk);
  }
}

function waitHuman(){return new Promise(function(res){humanWait=res;});}
function humanAct(a){if(humanWait){var r=humanWait;humanWait=null;r(a);}}

async function humanTurn(tk){
  var me=G.players[0];G.drawn=null;
  for(;;){
    G.phase='human';render();
    var a=await waitHuman();
    if(tk!==token)return;
    if(a.type==='draw'&&!G.drawn){
      var got=drawCards(0,1);
      if(!got.length){G.turn=step(0,1);return;}
      G.drawn=got[0];
      if(!canPlay(G.drawn,me.hand)){
        G.msg='You drew '+label(G.drawn)+'. It does not fit.';
        G.phase='wait';render();
        await sleep(1000);if(tk!==token)return;
        G.drawn=null;G.turn=step(0,1);return;
      }
      G.msg='You drew '+label(G.drawn)+'.';
      continue;
    }
    if(a.type==='pass'&&G.drawn){G.drawn=null;G.msg='You keep the card.';G.turn=step(0,1);return;}
    if(a.type==='play'){G.drawn=null;await doPlay(0,a.card,a.color,tk);return;}
  }
}

function botPick(P){
  var opts=P.hand.filter(function(c){return canPlay(c,P.hand);});
  if(!opts.length)return null;
  var cnt=[0,0,0,0];
  P.hand.forEach(function(c){if(c.fam!==null)cnt[c.fam]++;});
  var threat=G.players[step(G.turn,1)].hand.length<=2;
  var best=null,bs=-1e9;
  opts.forEach(function(c){
    var s=Math.random()*0.6;
    if(c.kind==='el')s+=1.5+cnt[c.fam]*0.15;
    else if(c.kind==='wild')s+=P.hand.length<=3?2:0.2;
    else if(c.kind==='w4')s+=threat?3:(P.hand.length<=3?2:-0.5);
    else s+=1.8+(threat?1.5:0);
    if(s>bs){bs=s;best=c;}
  });
  return best;
}
function botColor(P,card){
  var cnt=[0,0,0,0];
  P.hand.forEach(function(c){if(c!==card&&c.fam!==null)cnt[c.fam]++;});
  var m=Math.max.apply(null,cnt);
  if(m===0)return Math.floor(Math.random()*4);
  var best=[];cnt.forEach(function(v,i){if(v===m)best.push(i);});
  return best[Math.floor(Math.random()*best.length)];
}
async function botTurn(tk){
  var pi=G.turn,P=G.players[pi];
  G.phase='bot';G.drawn=null;render();
  await sleep(900+Math.random()*700);if(tk!==token)return;
  var choice=botPick(P);
  if(!choice){
    var got=drawCards(pi,1);
    G.msg=P.name+' draws a card.';render();
    await sleep(850);if(tk!==token)return;
    if(got.length&&canPlay(got[0],P.hand))choice=got[0];
    else{G.turn=step(pi,1);return;}
  }
  var color=isWild(choice)?botColor(P,choice):null;
  await doPlay(pi,choice,color,tk);
}

async function penalty(v,n,tk){
  var blocked=false;
  if(v===0){
    var r=await quizShield(n);if(tk!==token||r===null)return;
    blocked=r===true;
    if(blocked)G.shields++;
  }else{
    await sleep(700);if(tk!==token)return;
    blocked=Math.random()<0.3;
  }
  if(blocked)G.msg=nm(v)+(v===0?' cracked':' cracks')+' the shield test. +'+n+' blocked!';
  else{drawCards(v,n);G.msg=nm(v)+' '+(v===0?'draw':'draws')+' '+n+' cards.';}
  render();
  await sleep(800);
}

async function doPlay(pi,card,color,tk){
  var P=G.players[pi];
  G.phase='wait';
  P.hand=P.hand.filter(function(c){return c!==card;});
  G.discard.push(card);G.top=card;G.topKey++;
  G.color=card.fam!==null?card.fam:color;
  if(card.kind==='el')G.lastEl=card;
  var m=(pi===0?'You play ':P.name+' plays ')+label(card);
  if(isWild(card))m+=' and call '+FAM[G.color].name;
  G.msg=m+'.';
  render();

  if(P.hand.length===0){win(pi);return;}
  if(P.hand.length===1){
    if(pi===0){
      var ok=await molePrompt();if(tk!==token||ok===null)return;
      if(!ok){drawCards(0,2);G.msg='You forgot to call MOLE! Draw 2.';render();await sleep(800);if(tk!==token)return;}
    }else{flash(P.name+': MOLE!');await sleep(550);if(tk!==token)return;}
  }
  await sleep(450);if(tk!==token)return;

  if(card.kind==='rev'){
    G.dir*=-1;G.msg='Equilibrium shifts. Play order reversed.';
    G.turn=step(pi,1);render();await sleep(500);
  }else if(card.kind==='skip'){
    var s=step(pi,1);
    G.msg=nm(s)+' '+(s===0?'miss':'misses')+' a turn.';
    G.turn=step(pi,2);render();await sleep(700);
  }else if(card.kind==='d2'||card.kind==='w4'){
    var v=step(pi,1),n=card.kind==='d2'?2:4;
    await penalty(v,n,tk);if(tk!==token)return;
    G.turn=step(pi,2);
  }else{
    G.turn=step(pi,1);
  }
}

function win(pi){
  G.over=true;G.phase='over';render();
  var me=pi===0;
  openModal('<div class="mtag">'+(me?'Victory':'Game over')+'</div><h2>'+(me?'You emptied your hand first.':G.players[pi].name+' emptied their hand first.')+'</h2>'+
    '<div class="score">'+G.players.map(function(p){return '<div><span>'+p.name+'</span><span>'+p.hand.length+' card'+(p.hand.length===1?'':'s')+' left</span></div>';}).join('')+
    '<div><span>Shield tests cracked</span><span>'+G.shields+'</span></div></div>'+
    '<div class="row"><button class="btn primary" id="again">Play again</button></div>');
  $('#again').onclick=newGame;
}

/* ---------- input ---------- */
function hint(el,text){
  G.msg=text;renderInfo();
  if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
}
async function onCard(id,el){
  if(!G||G.phase!=='human'||G.over||G.picking)return;
  var me=G.players[0];
  var c=me.hand.filter(function(x){return x.id===id;})[0];
  if(!c)return;
  if(G.drawn&&c!==G.drawn){hint(el,'You drew a card. Play it, or keep it.');return;}
  if(!canPlay(c,me.hand)){
    if(c.kind==='w4')hint(el,'Acid Rain is legal only when you hold no card of the active family.');
    else if(G.top.kind==='el')hint(el,label(c)+' matches neither '+FAM[G.color].short+' nor valency '+G.top.val+'.');
    else hint(el,label(c)+' does not match '+FAM[G.color].short+'.');
    return;
  }
  if(isWild(c)){
    var tk=token;G.picking=true;
    var col=await pickColor();
    if(tk!==token)return;
    G.picking=false;
    if(col===null)return;
    humanAct({type:'play',card:c,color:col});
    return;
  }
  humanAct({type:'play',card:c});
}
$('#hand').addEventListener('click',function(e){var el=e.target.closest('.card');if(el)onCard(el.dataset.id,el);});
$('#hand').addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){var el=e.target.closest('.card');if(el){e.preventDefault();onCard(el.dataset.id,el);}}
});
function drawClick(){if(G&&G.phase==='human'&&!G.drawn&&!G.over)humanAct({type:'draw'});}
$('#drawPile').addEventListener('click',drawClick);
$('#drawPile').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();drawClick();}});
$('#btnKeep').addEventListener('click',function(){if(G&&G.drawn&&G.phase==='human')humanAct({type:'pass'});});
$('#btnRules').addEventListener('click',rulesModal);
var newTimer=null;
$('#btnNew').addEventListener('click',function(){
  var b=$('#btnNew');
  if(newTimer){clearTimeout(newTimer);newTimer=null;b.textContent='New game';newGame();return;}
  b.textContent='Tap again to confirm';
  newTimer=setTimeout(function(){newTimer=null;b.textContent='New game';},2500);
});
window.addEventListener('resize',fitHand);

$('#stack').innerHTML=backHTML()+backHTML()+backHTML();
newGame();
})();
</script>
