<style>
:root{--o-bg:#050507;--o-bg2:#0d0d14;--o-tx:#9a9aae;--st:#101118;--st2:#171925;--st3:#1f2231;--ln:rgba(255,255,255,.09);--ln2:rgba(255,255,255,.16);--tx:#f3f1ea;--mut:#9b9cb0;--gold:#f6c453;--gold2:#ff9f43;--ok:#4ade80;--bad:#ff5d6c;--blue:#5db4ff;--f0:#ff6b6b;--f1:#ffb84d;--f2:#4ade9a;--f3:#6aa8ff;--r:18px;--disp:'Hind Siliguri','Plus Jakarta Sans',system-ui,sans-serif}

/* ===== NB SOUND: শূন্য-নির্ভরতার WebAudio সাউন্ড ইফেক্ট =====
   ব্যবহার: const sfx = NBSound('গেমের-কী'); sfx.ok(); sfx.bad(); sfx.win(); sfx.lose(); sfx.tap(); sfx.pop();
   বাটন: #soundBtn থাকলে সেটি নিজে নিজে 🔔/🔕 টগল করে (localStorage '<কী>-sound') */
function NBSound(key) {
    let on = true, ac = null;
    try { on = localStorage.getItem(key + '-sound') !== '0'; } catch (e) {}
    function tone(f, t0, dur, type, vol) {
        if (!on) return;
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
            const t = ac.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .03);
        } catch (e) {}
    }
    const api = {
        ok() { tone(660, 0, .12); tone(880, .1, .16); },
        bad() { tone(220, 0, .2, 'sawtooth', .1); tone(160, .14, .26, 'sawtooth', .1); },
        tap() { tone(520, 0, .06, 'triangle', .1); },
        pop() { tone(440, 0, .08, 'square', .06); tone(740, .06, .1, 'square', .06); },
        win() { tone(523, 0, .12); tone(659, .12, .12); tone(784, .24, .12); tone(1047, .36, .3); },
        lose() { tone(392, 0, .2); tone(330, .2, .2); tone(262, .4, .4); },
        get on() { return on; },
        toggle() { on = !on; try { localStorage.setItem(key + '-sound', on ? '1' : '0'); } catch (e) {} paint(); if (on) api.ok(); }
    };
    function paint() { const b = document.getElementById('soundBtn'); if (b) b.textContent = on ? '🔔' : '🔕'; }
    document.addEventListener('DOMContentLoaded', () => { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } });
    if (document.readyState !== 'loading') { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } }
    return api;
}

    else if (!isHum(v)) { await sleep(700); if (tk !== token) return; blocked = Math.random() < SK[CFG.skill].block; }
    else { await sleep(500); if (tk !== token) return; }
    if (blocked) G.msg = nm(v) + ' শিল্ড টেস্টে পাস ' + L(V(v, 'করলে', 'করল'), '') + ' — +' + bn(n) + ' আটকে গেল!';
    else { drawCards(v, n); sfx.bad(); G.msg = L(nm(v) + ' ' + bn(n) + 'টি কার্ড ' + V(v, 'তুললে', 'তুলল') + '।', nm(v) + ' drew ' + n + ' cards.'); }
    render(); await sleep(800);
}
async function doPlay(pi, card, color, tk) {
    const P = G.players[pi]; G.phase = 'wait';
    P.hand = P.hand.filter(c => c !== card); G.discard.push(card); G.top = card; G.topKey++;
    G.color = card.fam !== null ? card.fam : color; if (card.kind === 'el') G.lastEl = card;
    let m = L((G.solo && pi === 0 ? 'তুমি ' : P.name + ' ') + label(card) + (G.solo && pi === 0 ? ' খেললে' : ' খেলল'), (G.solo && pi === 0 ? 'You' : P.name) + ' played ' + label(card));
    if (isWild(card)) m += ' — সক্রিয় পরিবার এখন ' + FAM[G.color].name;
    G.msg = m + '।'; render(); sfx.pop();
    if (P.hand.length === 0) { win(pi); return; }
    if (P.hand.length === 1) {
        if (P.human) { const ok = await molePrompt(); if (tk !== token || ok === null) return; if (!ok) { drawCards(pi, 2); G.msg = 'MOLE! বলতে ভুলে গেছ — ২টি কার্ড তুলতে হলো।'; render(); await sleep(800); if (tk !== token) return; } }
        else { flash(P.name + ': MOLE!'); await sleep(550); if (tk !== token) return; }
    }
    await sleep(450); if (tk !== token) return;
    if (card.kind === 'rev') { G.dir *= -1; G.msg = 'সাম্যাবস্থা বদলে গেল — খেলার দিক উল্টে গেল।'; G.turn = step(pi, 1); render(); await sleep(500); if (G.players.length === 2) G.turn = pi; }
    else if (card.kind === 'skip') { const s = step(pi, 1); G.msg = nm(s) + ' এই দান মিস ' + L(V(s, 'করলে', 'করল'), '') + '।'; G.turn = step(pi, 2); render(); await sleep(700); }
    else if (card.kind === 'd2' || card.kind === 'w4') { const v = step(pi, 1), n = card.kind === 'd2' ? 2 : 4; await penalty(v, n, tk); if (tk !== token) return; G.turn = step(pi, 2); }
    else G.turn = step(pi, 1);
}
function win(pi) {
    G.over = true; G.phase = 'over'; stopClock(); render();
    const w = G.players[pi], hum = w.human;
    const rank = G.players.map((p, i) => [(p.human ? '👤 ' : '🤖 ') + p.name, p.hand.length === 0 ? '🏆 জয়ী' : bn(p.hand.length) + 'টি বাকি', i === pi]);
    if (hum) { sfx.win(); PREM.wish({ name: w.name === 'তুমি' ? 'চ্যাম্পিয়ন' : w.name, line: w.name === 'তুমি' ? 'সবার আগে হাত খালি করে তুমি জিতেছ!' : w.name + ' সবার আগে হাত খালি করেছে!', stats: [['🛡 শিল্ড পাস', bn(G.shields)], ['🃏 ডেক বাকি', bn(G.pile.length)]], rank: rank, onAgain: newGame, onSetup: () => openSetup(false) }); }
    else {
        sfx.lose();
        openModal('<span class="mtag">খেলা শেষ</span><h2>' + w.name + ' জিতেছে!</h2><p>রোবটের বুদ্ধি ' + SK[CFG.skill].label + ' ছিল। আবার চেষ্টা করলেই হারিয়ে দিতে পারবে!</p><div class="rank">' + rank.map(r => '<div class="' + (r[2] ? 'me' : '') + '"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join('') + '</div><div class="row"><button class="pbtn gold big" id="again">▶ আবার খেলো</button><button class="pbtn" id="setupB">⚙ সেটিংস</button></div>');
        $('#again').onclick = newGame; $('#setupB').onclick = () => openSetup(false);
    }
}
/* ---------- ইনপুট ---------- */
function hint(el, text) { G.msg = text; renderInfo(); sfx.bad(); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }
async function onCard(id, el) {
    if (!G || G.phase !== 'human' || G.over || G.picking || G.cover) return;
    const me = G.players[G.me]; const c = me.hand.filter(x => x.id === id)[0]; if (!c) return;
    if (G.drawn && c !== G.drawn) { hint(el, 'এইমাত্র তোলা কার্ডটিই খেলতে পারো, নয়তো রেখে দাও।'); return; }
    if (!canPlay(c, me.hand)) {
        if (c.kind === 'w4') hint(el, 'অ্যাসিড বৃষ্টি তখনই খেলা যায় যখন হাতে সক্রিয় পরিবারের কোনো কার্ড নেই।');
        else if (G.top.kind === 'el') hint(el, label(c) + ' — ' + FAM[G.color].short + ' পরিবার বা যোজনী ' + bn(G.top.val) + ', কোনোটাই মেলে না।');
        else hint(el, label(c) + ' সক্রিয় পরিবারের সাথে মেলে না।');
        return;
    }
    if (isWild(c)) { const tk = token; G.picking = true; const col = await pickColor(); if (tk !== token) return; G.picking = false; if (col === null) return; humanAct({ type: 'play', card: c, color: col }); return; }
    humanAct({ type: 'play', card: c });
}
$('#hand').addEventListener('click', e => { const el = e.target.closest('.card'); if (el && el.dataset.id) onCard(el.dataset.id, el); });
$('#hand').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const el = e.target.closest('.card'); if (el && el.dataset.id) { e.preventDefault(); onCard(el.dataset.id, el); } } });
function drawClick() { if (G && G.phase === 'human' && !G.drawn && !G.over && !G.cover) humanAct({ type: 'draw' }); }
$('#drawPile').addEventListener('click', drawClick);
$('#drawPile').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drawClick(); } });
$('#btnKeep').addEventListener('click', () => { if (G && G.drawn && G.phase === 'human') humanAct({ type: 'pass' }); });
$('#btnRules').addEventListener('click', rulesModal);
$('#btnNew').addEventListener('click', () => openSetup(false));
window.addEventListener('resize', fitHand);
$('#stack').innerHTML = backHTML() + backHTML() + backHTML();
window.__t = { get G() { return G; }, CFG: () => CFG, newGame, humanAct, canPlay, setCfg: c => { CFG = Object.assign(CFG, c); } };
openSetup(true);
})();

</script>
