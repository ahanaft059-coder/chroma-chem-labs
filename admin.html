<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ChromaChem Labs</title>
    <style>
        :root {
            --bg-black: #000000;
            --neon-cyan: #06b6d4;
            --neon-purple: #a855f7;
            --text-white: #f8fafc;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: var(--bg-black);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-white);
        }

        .admin-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            background: rgba(11, 15, 25, 0.9);
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.25);
            backdrop-filter: blur(12px);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .admin-header h2 {
            margin: 0;
            font-size: 1.8rem;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .actions-btn {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .btn-clear:hover {
            background: #ef4444;
            color: #fff;
        }

        .btn-back {
            background: rgba(6, 182, 212, 0.2);
            color: var(--neon-cyan);
            border: 1px solid rgba(6, 182, 212, 0.4);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn-back:hover {
            background: var(--neon-cyan);
            color: #000;
        }

        .stats-box {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            margin: 0 0 5px 0;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .stat-card span {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--neon-cyan);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
        }

        th {
            background: rgba(6, 182, 212, 0.1);
            color: var(--neon-cyan);
            font-weight: 600;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h2>🛠️ অ্যাডমিন ড্যাশবোর্ড (ইউজার তালিকা)</h2>
            <div class="actions-btn">
                <button class="btn btn-clear" onclick="clearAllData()">সব ডেটা মুছুন</button>
                <a href="welcome.html" class="btn btn-back">হোমপেজ</a>
            </div>
        </div>

        <div class="stats-box">
            <div class="stat-card">
                <h3>মোট রেজিস্টার্ড ইউজার</h3>
                <span id="total-users">0</span>
            </div>
            <div class="stat-card">
                <h3>মোট সাইট ভিজিটর</h3>
                <span id="total-visitors">0</span>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>নাম</th>
                        <th>ইমেইল / ফোন নম্বর</th>
                        <th>স্কুল</th>
                        <th>শ্রেণি</th>
                        <th>রেজিস্ট্রেশনের সময়</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- ড্যাশবোর্ডের ডেটা জাভাস্ক্রিপ্ট দিয়ে এখানে লোড হবে -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadAdminData() {
            // মোট ভিজিটর কাউন্ট লোড
            let visitors = localStorage.getItem('siteTotalVisits') || 1250;
            document.getElementById('total-visitors').innerText = visitors;

            // রেজিস্টার্ড ইউজারের তালিকা লোড
            let allUsers = JSON.parse(localStorage.getItem('chemAllRegisteredUsers')) || [];
            document.getElementById('total-users').innerText = allUsers.length;

            const tableBody = document.getElementById('user-table-body');
            tableBody.innerHTML = '';

            if (allUsers.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="no-data">এখনো কোনো ইউজার রেজিস্ট্রেশন করেনি!</td></tr>`;
                return;
            }

            allUsers.forEach((user, index) => {
                let row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${user.name}</strong></td>
                        <td>${user.contact}</td>
                        <td>${user.school}</td>
                        <td><span style="color: var(--neon-cyan);">${user.studentClass}</span></td>
                        <td><small style="color: #94a3b8;">${user.time || 'প্রযোজ্য নয়'}</small></td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        // সব ডেটা ক্লিয়ার করার ফাংশন
        function clearAllData() {
            if (confirm('আপনি কি নিশ্চিত যে সমস্ত ইউজারের ডেটা মুছে ফেলতে চান?')) {
                localStorage.removeItem('chemAllRegisteredUsers');
                loadAdminData();
                alert('সব ডেটা সফলভাবে মুছে ফেলা হয়েছে!');
            }
        }

        // পেজ লোড হওয়ার সাথে সাথে ডেটা দেখাবে
        loadAdminData();
    </script>
</body>
</html>
