<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আইসোটোপ আইল্যান্ড (Isotope Island) - Pro Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #ffb703;
            --accent-hover: #fb8500;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        .back-btn { 
            position: fixed; 
            top: 25px; 
            left: 25px; 
            padding: 10px 20px; 
            background: rgba(30, 41, 59, 0.8); 
            backdrop-filter: blur(10px);
            color: #94a3b8; 
            border-radius: 12px; 
            text-decoration: none; 
            border: 1px solid rgba(51, 65, 85, 0.8); 
            transition: 0.3s; 
            z-index: 1000; 
            font-weight: bold;
            font-size: 14px;
        }
        .back-btn:hover { 
            background: #334155; 
            color: white; 
            transform: translateX(-3px); 
        }
        .game-container {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 26px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255,183,3,0.1);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 16px;
        }
        .question-box {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        .option-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        .option-btn:hover {
            background: var(--accent);
            color: #000;
            transform: translateY(-2px);
        }
        #message {
            font-size: 16px;
            font-weight: bold;
            min-height: 25px;
        }
        /* পপ-আপ স্ক্রিন স্টাইল */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
        .overlay-screen h2 { color: var(--accent); font-size: 24px; margin-bottom: 15px; }
        .overlay-screen p { color: #cbd5e1; font-size: 15px; margin-bottom: 20px; line-height: 1.6; }
        .dashboard-stats {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,183,3,0.3);
            border-radius: 14px;
            padding: 15px;
            width: 100%;
            margin-bottom: 20px;
            text-align: left;
            font-size: 15px;
            line-height: 1.8;
            color: #cbd5e1;
        }
        .dashboard-stats span { color: #4cc9f0; float: right; font-weight: bold; }
        .main-btn {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 183, 3, 0.4);
        }
    </style>
</head>
<body>

    <a href="games.html" class="back-btn">← ফিরে যান</a>

    <div class="game-container">
        <!-- গেম ওভার পপ-আপ স্ক্রিন -->
        <div id="dashboardScreen" class="overlay-screen" style="display: none;">
            <h2>🏆 গেম ওভার - রিপোর্ট কার্ড</h2>
            <div class="dashboard-stats" id="dashContent"></div>
            <button class="main-btn" onclick="startGame()">পুনরায় খেলুন 🔄</button>
        </div>

        <h1>🏝️ আইসোটোপ আইল্যান্ড</h1>
        <p>সঠিক উত্তর দিয়ে দ্বীপ জয় করো। একটি ভুল হলেই খেলা শেষ!</p>

        <div class="stats-bar">
            <span>স্কোর: <span id="score">0</span></span>
            <span>সময়: <span id="timer">30</span>সে</span>
        </div>

        <div id="game-area">
            <div class="question-box" id="question-text">প্রশ্ন লোড হচ্ছে...</div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        const questions = [
            { q: "কার্বনের কোন আইসোটোপটি প্রাচীন জীবাশ্মের বয়স নির্ণয়ে ব্যবহৃত হয়?", options: ["Carbon-12", "Carbon-13", "Carbon-14", "Carbon-11"], answer: "Carbon-14" },
            { q: "হাইড্রোজেনের কোন আইসোটোপটিতে কোনো নিউট্রন নেই?", options: ["প্রোটিয়াম (Protium)", "ডিউটেরিয়াম", "ট্রিটিয়াম", "হাইড্রাইড"], answer: "প্রোটিয়াম (Protium)" },
            { q: "ক্লোরিনের দুটি প্রধান আইসোটোপের ভরসংখ্যা ৩৫ এবং কত?", options: ["৩৭", "৩৬", "৩৮", "৩৯"], answer: "৩৭" },
            { q: "ইউরেনিয়ামের কোন আইসোটোপটি পারমাণবিক চুল্লিতে জ্বালানি হিসেবে ব্যবহৃত হয়?", options: ["U-235", "U-238", "U-234", "U-233"], answer: "U-235" },
            { q: "আইসোটোপসমূহের ক্ষেত্রে নিচের কোন বৈশিষ্ট্যটি সর্বদা সমান থাকে?", options: ["ভরসংখ্যা", "নিউট্রন সংখ্যা", "প্রোটন সংখ্যা", "নিউক্লিয়ন সংখ্যা"], answer: "প্রোটন সংখ্যা" },
            { q: "কোন মৌলের আইসোটোপ সংখ্যা প্রকৃতিতে সবচেয়ে বেশি পাওয়া যায়?", options: ["টিন (Sn)", "কার্বন", "অক্সিজেন", "হাইড্রোজেন"], answer: "টিন (Sn)" },
            { q: "ভারী জলের (Heavy Water) সংকেতে হাইড্রোজেনের কোন আইসোটোপটি ব্যবহৃত হয়?", options: ["ডিউটেরিয়াম", "প্রোটিয়াম", "ট্রিটিয়াম", "কোনোটিই নয়"], answer: "ডিউটেরিয়াম" },
            { q: "হাইড্রোজেনের তেজস্ক্রিয় আইসোটোপ কোনটি?", options: ["ট্রিটিয়াম (Tritium)", "প্রোটিয়াম", "ডিউটেরিয়াম", "নিয়ন"], answer: "ট্রিটিয়াম (Tritium)" },
            { q: "আইসোবার (Isobar)-দের ক্ষেত্রে কোন রাশিটি সমান থাকে?", options: ["প্রোটন সংখ্যা", "ভরসংখ্যা", "নিউট্রন সংখ্যা", "ইলেকট্রন বিন্যাস"], answer: "ভরসংখ্যা" },
            { q: "যেসব পরমাণুর নিউট্রন সংখ্যা সমান কিন্তু ভরসংখ্যা ও প্রোটন সংখ্যা ভিন্ন, তাদেরকে কী বলে?", options: ["আইসোটোন (Isotone)", "আইসোটোপ", "আইসোবার", "আইসোমার"], answer: "আইসোটোন (Isotone)" },
            { q: "কোবাল্টের তেজস্ক্রিয় আইসোটোপ (Co-60) কী চিকিৎসায় ব্যবহৃত হয়?", options: ["ক্যান্সার চিকিৎসায়", "রক্তচাপ নিয়ন্ত্রণে", "হাড়ের চিকিৎসায়", "চোখের চিকিৎসায়"], answer: "ক্যান্সার চিকিৎসায়" },
            { q: "আয়োডিনের কোন আইসোটোপটি গলগণ্ড বা থাইরয়েড রোগ নির্ণয় ও চিকিৎসায় ব্যবহৃত হয়?", options: ["I-131", "I-127", "I-125", "I-133"], answer: "I-131" },
            { q: "ফসফরাসের তেজস্ক্রিয় আইসোটোপ কোথায় ব্যবহৃত হয়?", options: ["লিউকেমিয়া বা রক্তরোগ চিকিৎসায়", "কৃষিতে সার হিসেবে", "ব্যাটারিতে", "গাড়ির ইঞ্জিনে"], answer: "লিউকেমিয়া বা রক্তরোগ চিকিৎসায়" },
            { q: "সোডিয়ামের আইসোটোপ Na-24 মানবদেহের কোথায় ব্যবহৃত হয়?", options: ["রক্তনালীর রক্তপ্রবাহ বা ব্লকেজ নির্ণয়ে", "মস্তিষ্কের স্ক্যানে", "হৃদপিণ্ডের গতি মাপতে", "ফুসফুস পরীক্ষায়"], answer: "রক্তনালীর রক্তপ্রবাহ বা ব্লকেজ নির্ণয়ে" },
            { q: "আইসোমার (Isomer) কি?", options: ["একই আণবিক সংকেত কিন্তু ভিন্ন গঠন", "ভিন্ন প্রোটন কিন্তু একই ভর", "সমান নিউট্রন সংখ্যা", "সমান ইলেকট্রন বিন্যাস"], answer: "একই আণবিক সংকেত কিন্তু ভিন্ন গঠন" },
            { q: "প্রাকৃতিক আইসোটোপের শতকরা পরিমাণকে কী বলা হয়?", options: ["আইসোটোপীয় আবৃত্তি (Abundance)", "পারমাণবিক ভর", "আইসোটোপ অনুপাত", "ভর ত্রুটি"], answer: "আইসোটোপীয় আবৃত্তি (Abundance)" },
            { q: "ক্লোরিনের পারমাণবিক ভর ভগ্নাংশ (35.5) হওয়ার কারণ কী?", options: ["আইসোটোপগুলোর আপেক্ষিক উপস্থিতির গড় মান", "প্রোটন ও নিউট্রনের যোগফল", "পরীক্ষামূলক ভুল", "ইলেকট্রনের ভর যোগ করায়"], answer: "আইসোটোপগুলোর আপেক্ষিক উপস্থিতির গড় মান" },
            { q: "প্রোটিয়ামে নিউট্রন সংখ্যা কত?", options: ["০", "১", "২", "৩"], answer: "০" },
            { q: "ডিউটেরিয়ামে নিউট্রন সংখ্যা কত?", options: ["১", "০", "২", "৩"], answer: "১" },
            { q: "ট্রিটিয়ামে নিউট্রন সংখ্যা কত?", options: ["২", "১", "০", "৩"], answer: "২" },
            { q: "কার্বন ডেটিং পদ্ধতিতে কিসের বয়স মাপা হয়?", options: ["জীবদেহাংশ ও প্রাচীন কাঠ", "পাথর ও মাটি", "লোহার অস্ত্র", "প্লাস্টিক"], answer: "জীবদেহাংশ ও প্রাচীন কাঠ" },
            { q: "যেসব পরমাণুর ইলেকট্রন সংখ্যা সমান কিন্তু ভরসংখ্যা ভিন্ন, তাদেরকে মূলত কী বলে?", options: ["আইসোটোপ", "আইসোবার", "আইসোটোন", "আইসোস্টার"], answer: "আইসোটোপ" },
            { q: "অর্গান (Ar - 40) এবং ক্যালসিয়াম (Ca - 40) পরস্পর কী?", options: ["আইসোবার", "আইসোটোপ", "আইসোটোন", "আইসোমার"], answer: "আইসোবার" },
            { q: "কার্বন-১২ এবং কার্বন-১৪ এর মধ্যে পার্থক্য কোথায়?", options: ["নিউট্রন সংখ্যায়", "প্রোটন সংখ্যায়", "ইলেকট্রন সংখ্যায়", "প্রোটন ও ইলেকট্রন উভয়েই"], answer: "নিউট্রন সংখ্যায়" },
            { q: "তেজস্ক্রিয় আইসোটোপ স্বতঃস্ফূর্তভাবে কী বিকিরণ করে?", options: ["আলফা, বিটা ও গামা রশ্মি", "শুধু এক্স-রে", "অবলোহিত রশ্মি", "শব্দ তরঙ্গ"], answer: "আলফা, বিটা ও গামা রশ্মি" },
            { q: "তেজস্ক্রিয়তা আবিষ্কার করেন কোন বিজ্ঞানী?", options: ["হেনরি বেকেরেল", "ম্যাসকিউরি", "রাদারফোর্ড", "জেমস চ্যাডউইক"], answer: "হেনরি বেকেরেল" },
            { q: "আইসোটোপ শব্দটির প্রবক্তা কে?", options: ["ফ্রেডরিক সোডি", "জন ডাল্টন", "জে জে থমসন", "বোর"], answer: "ফ্রেডরিক সোডি" },
            { q: "পরমাণুর কেন্দ্র বা নিউক্লিয়াসে কি কি থাকে?", options: ["প্রোটন ও নিউট্রন", "প্রোটন ও ইলেকট্রন", "নিউট্রন ও ইলেকট্রন", "শুধু প্রোটন"], answer: "প্রোটন ও নিউট্রন" },
            { q: "হাইড্রোজেনের স্থায়ী আইসোটোপ কয়টি?", options: ["দুটি (প্রোটিয়াম ও ডিউটেরিয়াম)", "একটি", "তিনটি", "চারটি"], answer: "দুটি (প্রোটিয়াম ও ডিউটেরিয়াম)" },
            { q: "তেজস্ক্রিয় সোডিয়াম (Na-24) এর অর্ধায়ু (Half-life) কত?", options: ["১৫ ঘণ্টা", "১ বছর", "৫ দিন", "১০ মিনিট"], answer: "১৫ ঘণ্টা" }
        ];

        let score = 0;
        let correctCount = 0;
        let timeLeft = 30;
        let timerInterval;
        let activeQuestions = [];
        let currentQ = {};

        const scoreDisplay = document.getElementById("score");
        const timerDisplay = document.getElementById("timer");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const message = document.getElementById("message");
        const dashboardScreen = document.getElementById("dashboardScreen");

        function startGame() {
            dashboardScreen.style.display = "none";
            score = 0;
            correctCount = 0;
            scoreDisplay.textContent = score;
            activeQuestions = [...questions].sort(() => Math.random() - 0.5);
            nextQuestion();
        }

        function startTimer() {
            timeLeft = 30;
            timerDisplay.textContent = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver("সময় শেষ!");
                }
            }, 1000);
        }

        function nextQuestion() {
            if (activeQuestions.length === 0) {
                activeQuestions = [...questions].sort(() => Math.random() - 0.5);
            }
            currentQ = activeQuestions.pop();
            startTimer();

            questionText.textContent = currentQ.q;
            optionsContainer.innerHTML = "";
            message.textContent = "";

            let shuffledOpts = [...currentQ.options].sort(() => Math.random() - 0.5);
            shuffledOpts.forEach(opt => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            clearInterval(timerInterval);
            const buttons = document.querySelectorAll(".option-btn");
            
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === currentQ.answer) {
                    btn.style.background = "#2ecc71";
                    btn.style.color = "#000";
                } else if (btn.textContent === selected) {
                    btn.style.background = "#e74c3c";
                    btn.style.color = "#fff";
                }
            });

            if (selected === currentQ.answer) {
                score += 10;
                correctCount++;
                scoreDisplay.textContent = score;
                message.textContent = "✅ চমৎকার! সঠিক উত্তর।";
                message.style.color = "#2ecc71";

                setTimeout(() => {
                    nextQuestion();
                }, 1200);
            } else {
                message.textContent = "❌ ভুল উত্তর! গেম ওভার।";
                message.style.color = "#e74c3c";

                setTimeout(() => {
                    showDashboard();
                }, 1500);
            }
        }

        function gameOver(reason) {
            message.textContent = `❌ ${reason} গেম ওভার।`;
            message.style.color = "#e74c3c";
            setTimeout(() => {
                showDashboard();
            }, 1200);
        }

        function showDashboard() {
            clearInterval(timerInterval);
            let grade = "C (উন্নতি প্রয়োজন)";
            if (correctCount >= 15) grade = "A+ (আইসোটোপ বিশেষজ্ঞ 🧪)";
            else if (correctCount >= 8) grade = "B (দারুণ চেষ্টা 👍)";
            else if (correctCount >= 3) grade = "C+ (ভালো)";

            const dashContent = document.getElementById("dashContent");
            dashContent.innerHTML = `
                মোট স্কোর: <span>${score}</span><br>
                সঠিক উত্তর দিয়েছেন: <span>${correctCount} টি</span><br>
                পারফরম্যান্স গ্রেড: <span>${grade}</span>
            `;
            dashboardScreen.style.display = "flex";
        }

        // গেম শুরু করা
        startGame();
    </script>
</body>
</html>
