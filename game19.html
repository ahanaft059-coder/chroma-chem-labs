<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3fc1b0">
    <title>মেটাল এক্সট্রাকশন | Lab Alchemy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function () { try { var b = localStorage.getItem('metal-bg'); if (b === '2' || b === '3') document.documentElement.setAttribute('data-bg', b); } catch (e) {} })();
    </script>
    <style>
/* ===== NB KIT: sticker / neo-brutalist দৃশ্যরূপ =====
   প্রতিটি গেম নিজের :root-এ এই টোকেনগুলো বদলে নিজস্ব রং পায়:
   --o1 --o2 --o3 (বাইরের ব্যাকগ্রাউন্ড), --paper (বোর্ড), --paper2, --ink, --a1 --a2 --a3 (অ্যাকসেন্ট)  */
:root {
    color-scheme: light;
    --o1: #ff6b4a; --o2: #ffd23f; --o3: #5ad1c4;
    --paper: #fff8ec; --paper2: #ffffff; --ink: #1d1030; --mute: #6a5f80;
    --a1: #ff6b4a; --a2: #2ec4b6; --a3: #ffd23f; --good: #12a36b; --bad: #e5384d;
    --bw: 3px; --rad: 16px; --sh: 5px;
    --display: 'Bricolage Grotesque','Hind Siliguri',system-ui,sans-serif;
    --body: 'Hind Siliguri','Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
    --pat: radial-gradient(rgba(29,16,48,.20) 1.4px, transparent 1.6px);
    --pat-size: 22px 22px;
}
:root[data-bg="2"] { --o1: #2ec4b6; --o2: #c9f2ee; --o3: #ff6b4a; }
:root[data-bg="3"] { --o1: #a78bfa; --o2: #ffd6f0; --o3: #ffd23f; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--body); font-weight: 500; line-height: 1.55;
    padding: 18px max(14px, env(safe-area-inset-right, 0px)) 30px max(14px, env(safe-area-inset-left, 0px));
    background-color: var(--o1);
    background-image: var(--pat), radial-gradient(circle at 12% 6%, var(--o2) 0, transparent 46%), radial-gradient(circle at 94% 96%, var(--o3) 0, transparent 50%);
    background-size: var(--pat-size), 100% 100%, 100% 100%;
    background-attachment: fixed; transition: background-color .4s; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

.stage { max-width: 860px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 24px; box-shadow: 9px 9px 0 var(--ink); }
.credit { width: fit-content; max-width: 100%; margin: 18px auto 0; padding: 6px 14px; text-align: center; font-size: 12.5px; font-weight: 700; letter-spacing: .3px; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--ink); }

/* উপরের বার */
.top { display: flex; align-items: center; gap: 10px; }
.titlebox { margin-right: auto; min-width: 0; }
.titlebox b { display: inline-block; padding: 3px 12px; font: 800 clamp(1.05rem, 3.6vw, 1.35rem)/1.3 var(--display); color: var(--ink); background: var(--a3); border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-1.2deg); }
.titlebox small { display: block; margin: 5px 0 0 4px; font-size: 12px; font-weight: 700; color: var(--mute); }
.btn, .back-btn, .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 14px;
    font: 800 14px/1 var(--body); text-decoration: none; cursor: pointer; color: var(--ink); background: var(--paper2);
    border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s, background .12s;
}
.btn:hover:not(:disabled), .back-btn:hover, .icon-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:active:not(:disabled), .back-btn:active, .icon-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: 2px 2px 0 var(--ink); }
.btn.primary { background: var(--a1); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
.btn.alt { background: var(--a2); }
.btn.big { min-height: 54px; padding: 0 26px; font-size: 17px; border-radius: 14px; }
.icon-btn { width: 42px; padding: 0; font-size: 17px; }

/* পিল, ক্যাপসুল, কার্ড */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; font-size: 13px; font-weight: 800; color: var(--ink); background: var(--paper2); border: 2.5px solid var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--ink); }
.pill b { font-variant-numeric: tabular-nums; }
.box { padding: 14px; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: var(--rad); box-shadow: 5px 5px 0 var(--ink); }
.sticker { display: inline-block; padding: 3px 11px; font-size: 12px; font-weight: 800; color: var(--ink); background: var(--a3); border: 2.5px solid var(--ink); border-radius: 8px; transform: rotate(-2deg); }
.meter { height: 16px; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 100%; background: var(--a1); border-right: 2.5px solid var(--ink); transition: width .25s ease; }
.hazard { height: 12px; border: 2.5px solid var(--ink); border-radius: 6px; background: repeating-linear-gradient(-45deg, var(--a3) 0 10px, var(--ink) 10px 20px); }

/* মডাল */
.modal { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; padding: 16px; background: rgba(29,16,48,.58); }
.sheet { width: min(500px, 100%); max-height: 92%; overflow: auto; padding: 22px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 22px; box-shadow: 9px 9px 0 var(--ink); }
.sheet h2 { margin: 6px 0 10px; font: 800 22px/1.35 var(--display); }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 18px); transform: translateX(-50%); z-index: 3500; padding: 8px 16px; font-size: 15px; font-weight: 800; color: var(--ink); background: var(--a3); border: var(--bw) solid var(--ink); border-radius: 99px; box-shadow: 4px 4px 0 var(--ink); opacity: 0; pointer-events: none; }
.toast.on { animation: nbtoast 1.7s ease forwards; }
@keyframes nbtoast { 0% { opacity: 0; transform: translate(-50%, -10px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@keyframes nbshake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes nbpop { from { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
@media (max-width: 520px) { .stage { padding: 12px; border-radius: 20px; gap: 12px; box-shadow: 6px 6px 0 var(--ink); } .back-btn .long { display: none; } .titlebox small { display: none; } }

/* ===== মেটাল এক্সট্রাকশন: টিল + তামা রং, হ্যাজার্ড-স্ট্রাইপ প্যাটার্ন ===== */
:root {
    --o1: #3fc1b0; --o2: #d6f7ef; --o3: #ffa56b;
    --paper: #fff4e2; --paper2: #ffffff; --ink: #1c2b33; --mute: #5d6f78;
    --a1: #d9672b; --a2: #2a9bb0; --a3: #ffc94d;
    --pat: repeating-linear-gradient(45deg, rgba(28,43,51,.10) 0 2px, transparent 2px 16px);
    --pat-size: 100% 100%;
}
:root[data-bg="2"] { --o1: #ffb347; --o2: #fff1c9; --o3: #3fc1b0; }
:root[data-bg="3"] { --o1: #8fb8ff; --o2: #e4f0ff; --o3: #ffb4a2; }
#bgBtn { background: #ffe2c9; }
.lv { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; padding: 6px 4px 0; border-bottom: var(--bw) solid var(--ink); }
.lvb { flex: 0 0 150px; position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-height: 58px; padding: 8px 12px 9px; text-align: left; cursor: pointer;
    background: #d4f1ea; color: var(--ink); border: var(--bw) solid var(--ink); border-bottom: 0; border-radius: 14px 14px 0 0; margin-bottom: -3px; transition: transform .12s, background .12s; }
.lvb:nth-child(4n+2) { background: #ffe6c7; } .lvb:nth-child(4n+3) { background: #ffd9cf; } .lvb:nth-child(4n) { background: #e2dcff; } .lvb:nth-child(4n+1) { background: #d4f1ea; }
.lvb:hover:not(:disabled) { transform: translateY(-3px); }
.lvb:active:not(:disabled) { transform: translateY(1px); }
.lvb b { font: 800 14px/1.3 var(--body); padding-right: 52px; } .lvb small { font-size: 12px; font-weight: 700; color: var(--mute); line-height: 1.3; }
.lvb i { position: absolute; top: 6px; right: 6px; padding: 1px 7px; font-style: normal; font-size: 12px; letter-spacing: 1px; background: var(--a3); border: 2px solid var(--ink); border-radius: 99px; box-shadow: 2px 2px 0 var(--ink); transform: rotate(3deg); }
.lvb.on { background: #fff; padding-bottom: 12px; box-shadow: 0 -4px 0 var(--a1) inset; }
.lvb.on small { color: var(--ink); }
.lvb:disabled { opacity: .55; cursor: default; filter: grayscale(.4); }
.hud { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; }
.hud .pill:nth-child(1) { background: #c9f3ea; } .hud .pill:nth-child(2) { background: #ffd4c4; } .hud .pill:nth-child(3) { background: #fff0a8; }

.job { padding: 12px 16px; background: #ffe1b8; border: var(--bw) solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink); }
.job h2 { margin: 6px 0 4px; font: 800 clamp(1.1rem, 3.6vw, 1.45rem)/1.4 var(--display); }
.job p { margin: 0; font-size: 13.5px; font-weight: 600; }
.flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-weight: 800; font-size: 13px; }
.flow span { padding: 2px 10px; background: var(--paper2); border: 2.5px solid var(--ink); border-radius: 99px; }
.flow em { font-style: normal; font-weight: 800; }

.line { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
.slot { display: flex; align-items: stretch; gap: 0; min-height: 52px; border: 2.5px dashed var(--ink); border-radius: 12px; background: repeating-linear-gradient(-45deg, rgba(28,43,51,.05) 0 8px, transparent 8px 16px); }
.slot .n { display: grid; place-items: center; width: 38px; flex: 0 0 38px; font: 800 16px var(--display); color: var(--mute); border-right: 2.5px dashed var(--ink); }
.slot .c { flex: 1; padding: 8px 12px; font-size: 13.5px; font-weight: 700; color: var(--mute); display: flex; align-items: center; }
.slot.next { border-style: solid; background: #fff9d6; } .slot.next .n { color: var(--ink); }
.slot.done { border-style: solid; background: #d9f5e6; animation: nbpop .3s ease; }
.slot.done .n { background: var(--good); color: #fff; border-right: 2.5px solid var(--ink); }
.slot.done .c { flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; color: var(--ink); }
.slot .f { font: 700 12.5px/1.4 'Plus Jakarta Sans', var(--body); color: #0d5c46; word-break: break-word; }
.slot .why { font-size: 12px; font-weight: 600; color: #365; }
.tray { display: flex; flex-wrap: wrap; gap: 9px; }
.card { flex: 1 1 230px; text-align: left; padding: 10px 13px; font-size: 13.5px; font-weight: 700; line-height: 1.45; cursor: pointer; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
.card:nth-child(3n+1) { background: #fff; } .card:nth-child(3n+2) { background: #e3f7f2; } .card:nth-child(3n) { background: #fff0d6; }
.card:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--ink); }
.card:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
.card.shake { animation: nbshake .35s; background: #ffd0d6 !important; }
.card.hint { animation: hintp .8s ease 3; outline: 4px solid var(--a1); outline-offset: 2px; }
@keyframes hintp { 50% { transform: scale(1.04); } }
.msg { min-height: 24px; padding: 6px 12px; font-size: 13.5px; font-weight: 700; border-radius: 10px; }
.msg.good { color: #0b5a3c; background: #d9f5e6; border: 2.5px solid var(--ink); } .msg.bad { color: #7a1020; background: #ffd9de; border: 2.5px solid var(--ink); }

/* ধাপ ৪: সক্রিয়তা সিরিজ */
.ladder { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bin { position: relative; min-height: 150px; padding: 10px; text-align: left; cursor: pointer; border: var(--bw) solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s; }
.bin:nth-child(1) { background: #ffd9cf; } .bin:nth-child(2) { background: #fff0b8; } .bin:nth-child(3) { background: #d4f1ea; }
.bin:active { transform: translate(2px,2px); }
.bin h3 { margin: 0 0 2px; font: 800 14px/1.3 var(--body); } .bin small { display: block; margin-bottom: 8px; font-size: 11.5px; font-weight: 700; color: var(--mute); }
.bin .put { display: flex; flex-wrap: wrap; gap: 5px; }
.bin.target { outline: 4px solid var(--a1); outline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 10px; font: 800 15px var(--display); cursor: pointer; color: var(--ink); background: #fff; border: 2.5px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink); }
.chip small { font-size: 11px; font-weight: 700; color: var(--mute); }
.chip.sel { background: var(--a3); transform: translate(-1px,-1px) rotate(-2deg); box-shadow: 4px 4px 0 var(--ink); }
.chip.shake { animation: nbshake .35s; background: #ffd0d6; }
.chip.placed { cursor: default; background: #fff; box-shadow: 2px 2px 0 var(--ink); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; min-height: 58px; background: var(--paper2); border: var(--bw) solid var(--ink); border-radius: 12px; }
.axis { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--mute); }
.sheet { position: relative; text-align: center; padding-top: 0; background: #fffdf3; }
.sheet::before { content: "LAB LABEL · METAL"; display: block; margin: 0 -22px 14px; padding: 7px 14px; font: 800 12px/1.2 var(--display); letter-spacing: 1.5px; color: #fff; background: var(--a1); border-bottom: var(--bw) solid var(--ink); border-radius: 18px 18px 0 0; }
.stars { font-size: 38px; letter-spacing: 6px; color: #ffb800; -webkit-text-stroke: 1.5px var(--ink); text-shadow: 3px 3px 0 var(--ink); }
.sheet p { font-size: 14.5px; margin: 6px 0 14px; } .sheet ul { text-align: left; font-size: 14px; padding-left: 22px; }
.learn { text-align: left; padding: 10px 12px; margin: 10px 0 14px; font-size: 13.5px; font-weight: 600; background: #e3f7f2; border: 2.5px solid var(--ink); border-radius: 10px; }
@media (max-width: 560px) { .ladder { grid-template-columns: 1fr; } .bin { min-height: 0; } }
    </style>
</head>
<body>
    <div class="stage">
        <header class="top">
            <a class="back-btn" href="games.html#adv" aria-label="গেম হাবে ফিরে যাও">←<span class="long">গেম হাব</span></a>
            <div class="titlebox"><b>⛏️ মেটাল এক্সট্রাকশন</b><small>Advanced Game</small></div>
            <button class="icon-btn" id="soundBtn" title="সাউন্ড চালু/বন্ধ" aria-label="সাউন্ড চালু বা বন্ধ করো">🔔</button>
            <button class="icon-btn" id="bgBtn" title="বাইরের ব্যাকগ্রাউন্ডের রং বদলাও" aria-label="বাইরের ব্যাকগ্রাউন্ডের রং বদলাও">🌓</button>

        </div>
        <section class="job" id="job"></section>
        <div class="meter"><i id="bar" style="width:0%"></i></div>

        <div class="row"><button class="btn" id="btnHint">💡 ইঙ্গিত</button><button class="btn" id="btnReset">↺ নতুন করে সাজাও</button></div>

    <p class="credit">Developed &amp; Designed by Ahanaf Abid Omlan</p>
    <div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

    <script>
/* ===== NB SOUND: শূন্য-নির্ভরতার WebAudio সাউন্ড ইফেক্ট =====
   ব্যবহার: const sfx = NBSound('গেমের-কী'); sfx.ok(); sfx.bad(); sfx.win(); sfx.lose(); sfx.tap(); sfx.pop();
   বাটন: #soundBtn থাকলে সেটি নিজে নিজে 🔔/🔕 টগল করে (localStorage '<কী>-sound') */
function NBSound(key) {
    let on = true, ac = null;
    try { on = localStorage.getItem(key + '-sound') !== '0'; } catch (e) {}
    function tone(f, t0, dur, type, vol) {
        if (!on) return;
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
            const t = ac.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .03);
        } catch (e) {}
    }
    const api = {
        ok() { tone(660, 0, .12); tone(880, .1, .16); },
        bad() { tone(220, 0, .2, 'sawtooth', .1); tone(160, .14, .26, 'sawtooth', .1); },
        tap() { tone(520, 0, .06, 'triangle', .1); },
        pop() { tone(440, 0, .08, 'square', .06); tone(740, .06, .1, 'square', .06); },
        win() { tone(523, 0, .12); tone(659, .12, .12); tone(784, .24, .12); tone(1047, .36, .3); },
        lose() { tone(392, 0, .2); tone(330, .2, .2); tone(262, .4, .4); },
        get on() { return on; },
        toggle() { on = !on; try { localStorage.setItem(key + '-sound', on ? '1' : '0'); } catch (e) {} paint(); if (on) api.ok(); }
    };
    function paint() { const b = document.getElementById('soundBtn'); if (b) b.textContent = on ? '🔔' : '🔕'; }
    document.addEventListener('DOMContentLoaded', () => { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } });
    if (document.readyState !== 'loading') { const b = document.getElementById('soundBtn'); if (b) { paint(); b.addEventListener('click', api.toggle); } }
    return api;
}

    (function () {
        'use strict';
        let sfx;
        try { sfx = NBSound('metal'); } catch (e) { sfx = { ok() {}, bad() {}, tap() {}, pop() {}, win() {}, lose() {}, toggle() {} }; }
        const $ = s => document.querySelector(s);
        const bn = n => Number(n).toLocaleString('bn-BD', { useGrouping: false });
        const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
        const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

        $('#bgBtn').addEventListener('click', () => {
            const cur = document.documentElement.getAttribute('data-bg') || '1';
            const next = cur === '1' ? '2' : cur === '2' ? '3' : '1';
            if (next === '1') document.documentElement.removeAttribute('data-bg'); else document.documentElement.setAttribute('data-bg', next);

            const last = S.st === STAGES.length - 1;
            $('#sheet').innerHTML = '<div class="stars">' + starStr(st) + '</div><h2>' + L.icon + ' ' + L.name + (L.mode === 'sort' ? ' — সিরিজ মিলে গেছে!' : ' নিষ্কাশন সম্পূর্ণ!') + '</h2><p>ভুল: <b>' + bn(S.miss) + '</b> · ইঙ্গিত: <b>' + bn(S.h0 - S.hints) + '</b></p><div class="learn">🧠 ' + L.learn + '</div><div class="row">' +
                (last ? '' : '<button class="btn primary big" data-act="next">পরের ধাপ ▶</button>') + '<button class="btn" data-act="again">↺ আবার খেলি</button><button class="btn" data-act="close">বন্ধ করো</button></div>';
            $('#modal').hidden = false;
        }
        function miss(el, text) { S.miss++; sfx.bad(); if (el) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); } msg(text, 'bad'); updateHud(); }

        function placeStep(k, el) {
            if (S.done) return;
            const L = SD(); const c = L.steps[k]; const need = minRank();
            if (c.d) { miss(el, '❌ ফাঁদ! ' + c.why); return; }
            if (c.r !== need) { miss(el, '❌ এখন এই ধাপের সময় হয়নি — আগের কোনো ধাপ বাকি আছে।'); return; }
            S.placed.push(c); sfx.ok(); msg('✔ ' + c.why, 'good'); renderPlay(); updateHud();
            if (S.placed.length === mustSteps().length) setTimeout(finish, 500);
        }
        function placeMetal(bk, el) {
            if (S.done || S.sel == null) { if (S.sel == null) toast('আগে একটা ধাতু বাছো'); return; }
            const L = SD(); const m = L.metals[S.sel];
            if (m.k !== bk) { miss(document.querySelector('[data-metal="' + S.sel + '"]'), '❌ ' + m.s + ' (' + m.n + ') এই ঘরে নয়। এর সক্রিয়তা ভাবো!'); return; }
            S.binAssign[m.s] = bk; S.sel = null; sfx.ok(); msg('✔ ' + m.s + ': ' + m.why, 'good'); renderPlay(); updateHud();
            if (progress() === L.metals.length) setTimeout(finish, 500);
        }
        function hint() {
            if (S.hints <= 0 || S.done) return;
            const L = SD(); S.hints--;
            if (L.mode === 'sort') {
                const pool = S.order.filter(k => !(L.metals[k].s in S.binAssign)); const k = S.sel != null ? S.sel : pool[0]; S.sel = k;
                const m = L.metals[k]; const b = L.bins.find(x => x.k === m.k); renderPlay();
                msg('💡 ' + m.s + ' → ' + b.n, 'good');
            } else {
                const need = minRank(); const k = L.steps.findIndex(x => !x.d && x.r === need && !S.placed.includes(x));
                renderPlay(); const el = document.querySelector('[data-step="' + k + '"]'); if (el) el.classList.add('hint');
                msg('💡 হাইলাইট করা কার্ডটাই পরের ধাপ।', 'good');
            }
            sfx.pop(); updateHud();
        }

        document.addEventListener('click', e => {
            const t = e.target.closest('[data-st],[data-step],[data-metal],[data-bin],[data-act],#btnHint,#btnReset,#btnRules'); if (!t) return;
            if (t.dataset.st != null) { sfx.tap(); startStage(+t.dataset.st); return; }
            if (t.dataset.step != null) { placeStep(+t.dataset.step, t); return; }
            if (t.dataset.metal != null) { S.sel = S.sel === +t.dataset.metal ? null : +t.dataset.metal; sfx.tap(); renderPlay(); return; }
            if (t.dataset.bin != null) { placeMetal(t.dataset.bin, t); return; }
            if (t.id === 'btnHint') { hint(); return; }
            if (t.id === 'btnReset') { sfx.tap(); startStage(S.st); return; }
            if (t.id === 'btnRules') {
                $('#sheet').innerHTML = '<h2>📖 নিয়ম</h2><ul><li>ধাপের কার্ড ট্যাপ করে সঠিক ক্রমে বসাও। ভুল ক্রম বা ফাঁদ কার্ডে <b>ভুল</b> গোনা হয়।</li><li>প্রতিটি ধাপ বসালে কারণটা শিখবে (💡)।</li><li>শেষ ধাপে ধাতু বাছো, তারপর ঠিক ঘরে ট্যাপ করো।</li><li>তারা = কম ভুল ও কম ইঙ্গিত।</li></ul><div class="row"><button class="btn primary" data-act="close">বুঝেছি</button></div>';
                $('#modal').hidden = false; return;
            }
            if (t.dataset.act === 'close') { $('#modal').hidden = true; return; }
            if (t.dataset.act === 'again') { $('#modal').hidden = true; startStage(S.st); return; }
            if (t.dataset.act === 'next') { $('#modal').hidden = true; startStage(Math.min(S.st + 1, STAGES.length - 1)); return; }
        });
        document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.bin')) { e.preventDefault(); placeMetal(e.target.dataset.bin, e.target); } });
        window.__t = { S, STAGES, startStage, placeStep, placeMetal, finish };
        startStage(0);
    })();
    </script>
</body>
</html>
