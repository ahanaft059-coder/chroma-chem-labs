<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পেজ ১: পারমাণবিক ধর্ম গ্রাফ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
            --shadow: rgba(15, 23, 42, 0.08);
        }
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --shadow: rgba(0, 0, 0, 0.4);
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 30px 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }
        .container { width: 100%; max-width: 950px; }
        
        .top-nav { display: flex; justify-content: flex-start; margin-bottom: 20px; }
        .back-btn {
            text-decoration: none; color: var(--text-color); font-weight: bold; background: var(--card-bg);
            padding: 10px 18px; border-radius: 14px; border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px var(--shadow); transition: all 0.2s; cursor: pointer;
        }
        .back-btn:hover { transform: translateX(-3px); }

        header h2 {
            font-size: 28px;
            margin: 0 0 5px 0;
            background: linear-gradient(45deg, #3498db, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        header p { margin-bottom: 30px; opacity: 0.8; font-size: 15px; text-align: center; }

        /* Controls Panel for 3 Properties */
        .controls-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 12px 15px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            box-shadow: 0 5px 15px var(--shadow);
            width: 100%;
            box-sizing: border-box;
        }
        .btn-toggle {
            padding: 12px;
            font-size: 14.5px;
            font-weight: bold;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-toggle.active {
            color: white;
        }
        #radiusBtn.active { background: #3498db; border-color: #3498db; }
        #energyBtn.active { background: #2ecc71; border-color: #2ecc71; }
        #electronegBtn.active { background: #e74c3c; border-color: #e74c3c; }

        /* Graph Container */
        .chart-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px var(--shadow);
            position: relative;
            margin-bottom: 25px;
        }

        .analysis-text {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            font-size: 14.5px;
            line-height: 1.6;
            text-align: left;
            box-shadow: 0 5px 15px var(--shadow);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <a href="visualizations.html" class="back-btn">← ভিজ্যুয়ালাইজেশন হাবে ফিরুন</a>
        </div>

        <header>
            <h2>📊 পেজ ১: পারমাণবিক ধর্ম গ্রাফ (Atomic Properties Panel)</h2>
            <p>১ থেকে ৩৬ নম্বর মৌলের পারমাণবিক ব্যাসার্ধ, আয়নিকরণ শক্তি ও তড়িৎ ঋণাত্মকতার তুলনামূলক ট্রেন্ড</p>
        </header>

        <div class="controls-box">
            <button id="radiusBtn" class="btn-toggle active" onclick="switchChart('radius')">পারমাণবিক ব্যাসার্ধ (pm) 🔵</button>
            <button id="energyBtn" class="btn-toggle" onclick="switchChart('energy')">আয়নিকরণ শক্তি (kJ/mol) 🟢</button>
            <button id="electronegBtn" class="btn-toggle" onclick="switchChart('electroneg')">তড়িৎ ঋণাত্মকতা (Pauling Scale) 🔴</button>
        </div>

        <div class="chart-box">
            <canvas id="periodicChart" style="width: 100%; height: 400px;"></canvas>
        </div>

        <div class="analysis-text" id="analysisBox">
            </div>
    </div>

    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');

        // Elements 1 to 36 Labels
        const elementLabels = ['H', 'He', 'Li', 'Be', 'B', 'C', 'N', 'O', 'F', 'Ne', 'Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', 'Ar', 'K', 'Ca', 'Sc', 'Ti', 'V', 'Cr', 'Mn', 'Fe', 'Co', 'Ni', 'Cu', 'Zn', 'Ga', 'Ge', 'As', 'Se', 'Br', 'Kr'];

        // Dataset 1: Atomic Radius (pm)
        const radiusData = [53, 31, 167, 112, 87, 67, 56, 48, 42, 38, 190, 145, 118, 111, 98, 88, 79, 71, 243, 194, 184, 176, 171, 166, 161, 156, 152, 149, 145, 142, 136, 125, 114, 103, 94, 88];

        // Dataset 2: First Ionization Energy (kJ/mol)
        const energyData = [1312, 2372, 520, 900, 801, 1086, 1402, 1314, 1681, 2081, 496, 738, 578, 786, 1012, 1000, 1251, 1521, 419, 590, 633, 659, 651, 653, 717, 762, 760, 737, 746, 906, 579, 762, 947, 941, 1140, 1351];

        // Dataset 3: Electronegativity (Pauling Scale)
        // Note: Noble gases (He, Ne, Ar, Kr) have negligible/stable valence shells, values set to 0 or near 0 for better visualization trend.
        const electronegData = [2.20, 0, 0.98, 1.57, 2.04, 2.55, 3.04, 3.44, 3.98, 0, 0.93, 1.31, 1.61, 1.90, 2.19, 2.58, 3.16, 0, 0.82, 1.00, 1.36, 1.54, 1.63, 1.66, 1.55, 1.83, 1.88, 1.91, 1.90, 1.65, 1.81, 2.01, 2.18, 2.55, 2.96, 3.00];

        let currentChart = null;

        function renderChart(dataType) {
            const ctx = document.getElementById('periodicChart').getContext('2d');
            if (currentChart) { currentChart.destroy(); }

            let isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            let gridColor = isDark ? '#334155' : '#cbd5e1';
            let textColor = isDark ? '#f8fafc' : '#0f172a';

            let label, datasetData, mainColor, fillGradientColor, yTitle;

            if (dataType === 'radius') {
                label = 'পারমাণবিক ব্যাসার্ধ (Picometer)';
                datasetData = radiusData;
                mainColor = '#3498db';
                fillGradientColor = 'rgba(52, 152, 219, 0.12)';
                yTitle = 'ব্যাসার্ধ (pm)';
            } else if (dataType === 'energy') {
                label = 'প্রথম আয়নিকরণ শক্তি (kJ/mol)';
                datasetData = energyData;
                mainColor = '#2ecc71';
                fillGradientColor = 'rgba(46, 204, 113, 0.12)';
                yTitle = 'শক্তি (kJ/mol)';
            } else {
                label = 'তড়িৎ ঋণাত্মকতা (Pauling Scale)';
                datasetData = electronegData;
                mainColor = '#e74c3c';
                fillGradientColor = 'rgba(231, 76, 60, 0.12)';
                yTitle = 'ঋণাত্মকতার মান';
            }

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: elementLabels,
                    datasets: [{
                        label: label,
                        data: datasetData,
                        borderColor: mainColor,
                        backgroundColor: fillGradientColor,
                        borderWidth: 3,
                        fill: true,
                        tension: 0.28,
                        pointRadius: 4,
                        pointHoverRadius: 7,
                        pointBackgroundColor: mainColor
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: textColor, font: { size: 14, weight: 'bold' } } }
                    },
                    scales: {
                        x: {
                            grid: { color: gridColor },
                            ticks: { color: textColor, font: { weight: 'bold' } },
                            title: { display: true, text: 'মৌলের প্রতীক (পারমাণবিক সংখ্যা ১-৩৬)', color: textColor }
                        },
                        y: {
                            grid: { color: gridColor },
                            ticks: { color: textColor },
                            title: { display: true, text: yTitle, color: textColor }
                        }
                    }
                }
            });
        }

        function switchChart(type) {
            document.getElementById('radiusBtn').classList.remove('active');
            document.getElementById('energyBtn').classList.remove('active');
            document.getElementById('electronegBtn').classList.remove('active');

            if (type === 'radius') {
                document.getElementById('radiusBtn').classList.add('active');
                document.getElementById('analysisBox').innerHTML = `<strong>💡 গ্রাফ পর্যবেক্ষণ ও রসায়নের ট্রিকস:</strong><br>• পর্যায় সারণির একই পর্যায় বাম থেকে ডানে গেলে (যেমন: <span style="font-family:monospace;">Li</span> থেকে <span style="font-family:monospace;">Ne</span>) পারমাণবিক ব্যাসার্ধের মান ক্রমান্বয়ে **কমে যাচ্ছে**! কারণ প্রোটন সংখ্যা বাড়ায় নিউক্লিয়াসের আকর্ষণ বৃদ্ধি পায়।<br>• কিন্তু যখনই একটি নতুন পর্যায় শুরু হয় (<span style="font-family:monospace;">Na</span> অথবা <span style="font-family:monospace;">K</span>), গ্রাফটি হঠাৎ করে এক লাফে অনেক উপরে উঠে যায়! কারণ সেখানে নতুন ইলেকট্রন খোলস (Shell) যুক্ত হয়।`;
            } else if (type === 'energy') {
                document.getElementById('energyBtn').classList.add('active');
                document.getElementById('analysisBox').innerHTML = `<strong>💡 গ্রাফ পর্যবেক্ষণ ও রসায়নের ট্রিকস:</strong><br>• লক্ষ্য করো, নিষ্ক্রিয় গ্যাসগুলোর (<span style="font-family:monospace;">He, Ne, Ar</span>) ক্ষেত্রে আয়নিকরণ শক্তির গ্রাফটি সবচেয়ে উঁচুতে বা পিক-এ অবস্থান করছে, কারণ এদের ইলেকট্রন বিন্যাস পূর্ণ থাকায় ইলেকট্রন সরাতে সবচেয়ে বেশি শক্তি লাগে।<br>• অপরপক্ষে ক্ষার ধাতুগুলোর (<span style="font-family:monospace;">Li, Na, K</span>) ক্ষেত্রে আয়নিকরণ শক্তির মান একদম নিচের দিকে নেমে গেছে, কারণ এরা সহজেই ১টি ইলেকট্রন ছেড়ে দিতে চায়।`;
            } else {
                document.getElementById('electronegBtn').classList.add('active');
                document.getElementById('analysisBox').innerHTML = `<strong>💡 গ্রাফ পর্যবেক্ষণ ও রসায়নের ট্রিকস:</strong><br>• তড়িৎ ঋণাত্মকতার গ্রাফটি লক্ষ্য করো—এটিও আয়নিকরণ শক্তির মতোই একই পর্যায়ে বাম থেকে ডানে গেলে ক্রমান্বয়ে **বৃদ্ধি পায়**। এই কারণেই হ্যালোজেন গ্রুপের ফ্লোরিনের (<span style="font-family:monospace;">F</span>) মান গ্রাফে সর্বোচ্চ (৩.৯৮)।<br>• নিষ্ক্রিয় গ্যাসগুলোর (<span style="font-family:monospace;">He, Ne, Ar</span>) ক্ষেত্রে গ্রাফটি হুট করে শূন্যে নেমে গেছে, কারণ এদের অষ্টক পূর্ণ থাকায় এরা সমযোজী বন্ধনে আবদ্ধ ইলেকট্রন জোড়কে নিজের দিকে আকর্ষণ করে না।`;
            }
            renderChart(type);
        }

        // Initial View Load
        switchChart('radius');
    </script>
</body>
</html>
