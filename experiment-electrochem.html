<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060f">
<title>তড়িৎ বিশ্লেষ্য ও পরিবাহিতা ল্যাব | Lab Alchemy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function () {
    let t = 'dark';
    try { t = localStorage.getItem('theme') || 'dark'; } catch (e) {}
    if (t === 'auto') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{--bg-color:#eef2f9;--card-bg:rgba(255,255,255,.74);--card-solid:#fff;--text-color:#0f172a;--text-muted:#5b6b82;--border-color:rgba(15,23,42,.12);--shadow:0 10px 30px -5px rgba(15,23,42,.08);--section-border:rgba(168,85,247,.28);--gradient-primary:linear-gradient(135deg,#9333ea,#3b82f6);--gradient-glow:rgba(147,51,234,.18);--grid-line:rgba(15,23,42,.05);--blob-opacity:.22;--gold:#d97706;--accent:#7c3aed;--ok:#16a34a;--bad:#dc2626;--glass:#cfe3f5;--stand:#e2e8f0;--tick:#334155}
[data-theme="dark"]{--bg-color:#05060f;--card-bg:rgba(16,20,36,.62);--card-solid:#0b0f1c;--text-color:#f8fafc;--text-muted:#94a3b8;--border-color:rgba(255,255,255,.1);--shadow:0 20px 40px -15px rgba(0,0,0,.7);--section-border:rgba(168,85,247,.35);--gradient-primary:linear-gradient(135deg,#a855f7,#60a5fa);--gradient-glow:rgba(168,85,247,.28);--grid-line:rgba(255,255,255,.035);--blob-opacity:.42;--gold:#fbbf24;--accent:#a78bfa;--ok:#4ade80;--bad:#f87171;--glass:#8fb4d6;--stand:#1e293b;--tick:#cbd5e1}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;padding:18px 18px 64px;font-family:'Plus Jakarta Sans','Hind Siliguri','Segoe UI',system-ui,sans-serif;background:var(--bg-color);color:var(--text-color);transition:background .4s,color .4s;animation:pageIn .6s ease both}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(95px);opacity:var(--blob-opacity);animation:drift 26s ease-in-out infinite alternate}
.b1{width:520px;height:520px;background:#0891b2;top:-150px;left:-120px}
.b2{width:620px;height:620px;background:#7e22ce;bottom:-230px;right:-170px;animation-duration:32s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto}
.top{position:sticky;top:10px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;margin-bottom:26px;border-radius:24px;background:var(--card-bg);border:1.5px solid var(--border-color);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-color)}
.orb{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 35% 30%,#fff,#22d3ee 55%,#a855f7);box-shadow:0 0 18px #22d3ee,0 0 34px rgba(168,85,247,.7)}
.brand b{display:block;font-size:18px;font-weight:800;line-height:1.2}
.brand small{display:block;font-size:12px;font-weight:700;color:#a855f7}
.top-right{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:14px;cursor:pointer;font-size:16px;color:var(--text-color);background:var(--card-solid);border:1px solid var(--border-color);display:inline-flex;align-items:center;justify-content:center;transition:transform .3s,box-shadow .3s}
.icon-btn:hover{transform:rotate(180deg);box-shadow:0 8px 22px var(--gradient-glow)}
.back-btn{display:inline-flex;align-items:center;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:700;text-decoration:none;color:var(--text-color);background:var(--card-solid);border:1px solid var(--border-color);transition:transform .25s,border-color .25s}
.back-btn:hover{transform:translateX(-3px);border-color:rgba(168,85,247,.6)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
.hero{text-align:center;margin-bottom:22px}
.pill{display:inline-block;padding:6px 16px;border-radius:30px;font-size:13px;font-weight:700;color:#a855f7;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.3)}
.hero h1{margin:14px 0 10px;font-size:clamp(1.8rem,4.6vw,2.9rem);font-weight:800;letter-spacing:-.5px;line-height:1.25;background:var(--gradient-primary);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite}
.hero h1 .em{-webkit-text-fill-color:initial}
@keyframes shimmer{to{background-position:200% center}}
.hero p{margin:0 auto;max-width:640px;font-size:15.5px;line-height:1.7;font-weight:500;color:var(--text-muted)}
.lab{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:22px;align-items:start}
@media(max-width:900px){.lab{grid-template-columns:1fr}.back-btn .long{display:none}}
.card{position:relative;border-radius:24px;padding:20px;background:var(--card-bg);border:1.5px solid var(--section-border);box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.card h2{margin:0 0 12px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.stage{position:sticky;top:90px}
@media(max-width:900px){.stage{position:static}}
.stage svg{width:100%;height:auto;display:block;max-height:640px}
.hud{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hud .box{flex:1 1 120px;padding:8px 12px;border-radius:14px;background:var(--card-solid);border:1px solid var(--border-color)}
.hud small{display:block;font-size:11px;font-weight:700;color:var(--text-muted)}
.hud b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper{display:grid;gap:10px;margin-bottom:14px}
.st{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--card-solid);border:1.5px solid var(--border-color);transition:border-color .25s,opacity .25s}
.st .no{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--card-bg);border:1.5px solid var(--border-color)}
.st.active{border-color:#a855f7;box-shadow:0 0 0 4px var(--gradient-glow)}
.st.done{border-color:rgba(74,222,128,.5)}
.st.done .no{background:var(--ok);color:#fff;border-color:transparent}
.st.lock{opacity:.5}
.st .tx{flex:1;min-width:0}
.st .tx b{display:block;font-size:14.5px}
.st .tx small b{display:inline;font-size:inherit}
.st .tx small{color:var(--text-muted);font-size:12.5px;line-height:1.5}
.st select,.st .sel{margin-top:6px;font-family:inherit;font-size:13.5px;font-weight:600;padding:7px 10px;border-radius:10px;color:var(--text-color);background:var(--card-bg);border:1px solid var(--border-color);max-width:100%}
.st select option{background:var(--card-solid);color:var(--text-color)}
.btn{font-family:inherit;font-size:14px;font-weight:800;padding:10px 16px;border-radius:12px;border:0;cursor:pointer;color:#fff;background:var(--gradient-primary);transition:transform .2s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px var(--gradient-glow)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--card-solid);color:var(--text-color);border:1px solid var(--border-color)}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.tap{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.tap button{flex:1 1 90px}
.tap button.on{background:var(--gradient-primary);color:#fff;border-color:transparent}
.hint{font-size:13px;line-height:1.7;color:var(--text-muted);margin:8px 2px 0}
.live{padding:10px 14px;border-radius:14px;font-size:14px;font-weight:600;line-height:1.6;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.3);margin-top:10px;min-height:48px}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border-color)}
.tbl th{font-size:12px;color:var(--text-muted);font-weight:800}
.tbl tr.sel td{background:rgba(168,85,247,.08)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.num{font-family:inherit;font-size:15px;font-weight:700;padding:10px 14px;border-radius:12px;width:170px;color:var(--text-color);background:var(--card-solid);border:1.5px solid var(--border-color);outline:none}
.num:focus{border-color:#a855f7;box-shadow:0 0 0 4px var(--gradient-glow)}
.res{margin-top:14px;padding:14px 16px;border-radius:16px;font-size:14.5px;line-height:1.8;background:var(--card-solid);border:1.5px solid var(--border-color)}
.res.ok{border-color:rgba(74,222,128,.6)}
.res.bad{border-color:rgba(248,113,113,.6)}
.res h3{margin:0 0 6px;font-size:16px}
.res code,.th code{font-family:'Hind Siliguri',ui-monospace,monospace;font-weight:700;background:rgba(168,85,247,.12);padding:1px 7px;border-radius:8px}
.formula{display:block;text-align:center;margin:8px 0;padding:10px;border-radius:12px;font-size:17px;font-weight:800;background:rgba(168,85,247,.1);border:1px dashed rgba(168,85,247,.4)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 14px}
.tab{font-family:inherit;font-size:14px;font-weight:800;padding:10px 18px;border-radius:30px;cursor:pointer;color:var(--text-muted);background:var(--card-solid);border:1.5px solid var(--border-color);transition:.2s}
.tab:hover{color:var(--text-color);border-color:rgba(168,85,247,.55)}
.tab.on{color:#fff;border-color:transparent;background:var(--gradient-primary);box-shadow:0 8px 20px var(--gradient-glow)}
.pane{display:none}.pane.on{display:block;animation:pageIn .4s ease both}
.th{line-height:1.85;font-size:15px}
.th h3{margin:18px 0 6px;font-size:17px}
.th ul,.th ol{margin:6px 0;padding-left:22px}
.th table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.th th,.th td{border:1px solid var(--border-color);padding:8px 10px;text-align:left}
.th th{background:var(--card-solid)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px;border:1px solid var(--border-color)}
details.qa{border:1px solid var(--border-color);border-radius:14px;background:var(--card-solid);margin:8px 0;padding:0 14px}
details.qa summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:14.5px}
details.qa p{margin:0 0 12px;color:var(--text-muted);line-height:1.8;font-size:14px}
.chartwrap svg{width:100%;height:auto;display:block}
.chartwrap text{fill:var(--text-muted);font-size:10px;font-family:inherit}
.toast{position:fixed;left:50%;bottom:52px;transform:translate(-50%,16px);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:700;color:#fff;background:#111827;border:1px solid rgba(255,255,255,.15);opacity:0;pointer-events:none;transition:.3s;z-index:3000;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.credit-bar{position:fixed;bottom:0;left:0;width:100%;height:34px;z-index:2500;display:flex;align-items:center;justify-content:center;font-size:.78rem;letter-spacing:.6px;color:#64748b;background:rgba(5,6,15,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.06)}
[data-theme="light"] .credit-bar{background:rgba(255,255,255,.88);color:#475569;border-top-color:rgba(15,23,42,.1)}
.credit-bar span{margin-left:5px;font-weight:700;background:linear-gradient(90deg,#22d3ee,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.swirl{animation:swirl .5s ease-in-out 3}
@keyframes swirl{25%{transform:translate(5px,0) rotate(2deg)}75%{transform:translate(-5px,0) rotate(-2deg)}}
.drip{animation:fall .55s linear infinite}
@keyframes fall{0%{transform:translateY(0);opacity:1}85%{opacity:1}100%{transform:translateY(var(--fd,70px));opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.prog{height:8px;border-radius:8px;background:var(--card-solid);border:1px solid var(--border-color);overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;width:0;background:var(--gradient-primary);transition:width .4s}
.tagx{float:right;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.35)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.scroll{overflow-x:auto}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.ob{font-family:inherit;font-size:14px;font-weight:700;padding:9px 14px;border-radius:12px;cursor:pointer;color:var(--text-color);background:var(--card-solid);border:1.5px solid var(--border-color);transition:.2s}
.ob.on{border-color:#a855f7;background:rgba(168,85,247,.18);box-shadow:0 0 14px rgba(168,85,247,.35)}
.ob:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--card-solid);color:var(--text-color);border:1.5px solid var(--border-color)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pst h3{margin:0 0 6px;font-size:17px}.pst p{margin:6px 0;line-height:1.8;font-size:14.5px}
.pst .lbl{font-size:12.5px;font-weight:800;color:var(--text-muted);margin-top:10px}
.msg{margin-top:10px;padding:9px 13px;border-radius:12px;font-size:13.5px;font-weight:600;line-height:1.7;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.3)}
.msg.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4)}.msg.bad{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4)}
table.rt{width:100%;border-collapse:collapse;font-size:14px}table.rt td,table.rt th{padding:7px 10px;border-bottom:1px solid var(--border-color);text-align:left}
table.rt th{color:var(--text-muted);font-size:12.5px}
.stars{font-size:26px;letter-spacing:4px}
.res{margin-top:10px;padding:10px 13px;border-radius:12px;background:var(--card-solid);border:1px dashed var(--border-color);font-size:14px;line-height:1.8}
@keyframes inv{0%{transform:rotate(0)}50%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
.inv{animation:inv .7s ease}
@keyframes stir{0%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}100%{transform:rotate(-7deg)}}
.stirring{animation:stir .45s ease 2}
.bub{opacity:0;animation:rise 1.5s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
</style>
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="grid-bg"></div>
<div class="wrap">
  <header class="top">
    <a class="brand" href="dashboard.html"><span class="orb"></span><span><b>Lab Alchemy</b><small>Digital Lab</small></span></a>
    <div class="top-right">
      <button class="icon-btn" id="themeBtn" title="থিম পরিবর্তন করো" aria-label="থিম পরিবর্তন করো">🌓</button>
      <a class="back-btn" href="digitallab.html">← <span class="long">ল্যাব হাবে ফিরে যান</span></a>
    </div>
  </header>
  <section class="hero">
    <span class="pill">⚡ তড়িৎ রসায়ন · প্র্যাক্টিক্যাল</span>
    <h1><span class="em">🔌</span> তড়িৎ বিশ্লেষ্য ও পরিবাহিতা ল্যাব</h1>
    <p>কোন তরল বিদ্যুৎ পরিবহন করে? বাল্ব জ্বলে কি না দেখো, তারপর CuSO₄ দ্রবণের তড়িৎ বিশ্লেষণ করে ক্যাথোডে কতটুকু তামা জমে ফ্যারাডের সূত্রে মিলিয়ে দেখো।</p>
  </section>
  <div class="tabs" style="margin-top:0">
    <button class="tab on" data-m="cond">💡 পরিবাহিতা পরীক্ষা</button>
    <button class="tab" data-m="elec">🔋 CuSO₄ তড়িৎ বিশ্লেষণ</button>
  </div>

  <div class="lab">
    <section class="card stage">
      <h2>🔬 পরীক্ষার টেবিল <span class="tagx" id="stageTag">বাল্ব সার্কিট</span></h2>
      <svg id="svg" viewBox="0 0 400 400" role="img" aria-label="তড়িৎ বিশ্লেষণ সার্কিট">
        <defs>
          <radialGradient id="glow"><stop offset="0" stop-color="#fde047" stop-opacity=".95"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient>
          <linearGradient id="glassG" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".3" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
          <clipPath id="clipL"><path d="M100 160 L100 335 Q100 346 112 346 L288 346 Q300 346 300 335 L300 160 Z"/></clipPath>
        </defs>
        <rect x="14" y="360" width="372" height="12" rx="6" fill="var(--stand)" stroke="var(--border-color)"/>
        <!-- wires -->
        <path d="M150 50 H70 V100 H146" fill="none" stroke="var(--text-muted)" stroke-width="3"/>
        <path d="M250 50 H281 M329 50 H350 V100 H254" fill="none" stroke="var(--text-muted)" stroke-width="3" id="wireR"/>
        <path d="M250 50 H350 V100 H254" fill="none" stroke="var(--text-muted)" stroke-width="3" id="wireA" style="display:none"/>
        <!-- battery -->
        <rect x="150" y="34" width="100" height="32" rx="6" fill="var(--card-solid)" stroke="var(--text-muted)" stroke-width="2"/>
        <rect x="150" y="34" width="50" height="32" rx="6" fill="rgba(239,68,68,.15)"/>
        <text x="165" y="56" font-size="17" font-weight="800" fill="var(--text-color)" font-family="inherit">−</text>
        <text x="228" y="56" font-size="17" font-weight="800" fill="var(--text-color)" font-family="inherit">+</text>
        <text id="batT" x="200" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-muted)" font-family="inherit">৬ V</text>
        <!-- bulb -->
        <g id="bulbG">
          <circle id="halo" cx="305" cy="50" r="46" fill="url(#glow)" opacity="0"/>
          <circle cx="305" cy="50" r="22" fill="rgba(255,255,255,.08)" stroke="var(--text-muted)" stroke-width="2"/>
          <circle id="bulbF" cx="305" cy="50" r="18" fill="#fde047" opacity="0"/>
          <path d="M296 60 L300 46 L305 56 L310 46 L314 60" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
        </g>
        <g id="ammG" style="display:none"><circle cx="305" cy="50" r="24" fill="var(--card-solid)" stroke="var(--text-muted)" stroke-width="2.5"/><text x="305" y="45" text-anchor="middle" font-size="11" font-weight="800" fill="var(--text-muted)" font-family="inherit">A</text><text id="ammT" x="305" y="60" text-anchor="middle" font-size="11" font-weight="800" fill="#4ade80" font-family="ui-monospace,monospace">0.00</text></g>
        <!-- beaker -->
        <g clip-path="url(#clipL)"><rect id="liq" x="90" y="200" width="220" height="150" fill="rgba(160,200,255,.28)" style="transition:fill 1s"/></g>
        <path d="M100 160 L100 335 Q100 346 112 346 L288 346 Q300 346 300 335 L300 160" fill="url(#glassG)" stroke="var(--glass)" stroke-width="2.5"/>
        <!-- electrodes -->
